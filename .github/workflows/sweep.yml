# On demand: sweep the full archived history of every X account in
# data/accounts.yaml through the Wayback Machine, including posts deleted since,
# and commit the candidates to inbox/ for triage. Each account runs as its own
# job so a slow account can't stall the rest. It can take several hours.
#
# Run it from Actions → Sweep → Run workflow. Nothing is added to the record;
# the inbox files are read and triaged by hand.
name: Sweep

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: 'X handles to sweep, space-separated (empty = every account in data/accounts.yaml)'
        default: ''
      from:
        description: 'Earliest post date, YYYY[-MM[-DD]] (empty = full history)'
        default: ''
      limit:
        description: 'Most recent archived posts to read per account'
        default: '2000'
      match:
        description: 'Keep posts whose text matches this regex (deleted posts are always kept)'
        default: 'safety|safe|align|regulat|nonprofit|non-profit|mission|open.?source|military|defen[cs]e|pentagon|department of war|surveil|advertis|\bads?\b|profit|equity|humanity|commit|promise|pledge|pause|slow|race|democra|china|board|congress|senate|lawsuit|copyright|election|super ?pac|teen|mental health|preparedness|responsible scaling|\brsp\b|evaluat|audit'

permissions:
  contents: write

jobs:
  accounts:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          WANTED: ${{ inputs.accounts }}
        run: |
          if [ -n "$WANTED" ]; then
            list=$(printf '%s\n' $WANTED | jq -R . | jq -cs .)
          else
            list=$(grep -E '^\s+x:\s' data/accounts.yaml | awk '{print $2}' | jq -R . | jq -cs .)
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Accounts: $list"

  sweep:
    needs: accounts
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3  # be gentle with archive.org
      matrix:
        account: ${{ fromJson(needs.accounts.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sweep @${{ matrix.account }}
        continue-on-error: true
        env:
          FROM: ${{ inputs.from }}
          LIMIT: ${{ inputs.limit }}
          MATCH: ${{ inputs.match }}
        run: |
          args=(--account "${{ matrix.account }}" --via wayback --limit "$LIMIT" --cdx-limit 50000 --keep-deleted --match "$MATCH")
          [ -n "$FROM" ] && args+=(--from "$FROM")
          npm run find-posts -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-${{ matrix.account }}
          path: inbox/*-${{ matrix.account }}.*
          if-no-files-found: ignore

  commit:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: inbox-*
          path: inbox
          merge-multiple: true
      - name: Commit inbox files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox
          if git diff --cached --quiet; then
            echo "Nothing found."
          else
            git commit -m "Sweep: full-history post candidates, $(date -u +%F)"
            git pull --rebase
            git push
          fi
