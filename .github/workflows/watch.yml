# Weekly: re-read the watched policy pages, check every cited source, add
# every recent post from watched accounts to their archive in inbox/sweep/ and
# queue the unread ones in inbox/sweep/QUEUE.md, snapshot and archive sources
# that lack a copy, commit the results, and open an issue when a watched page
# has changed. If any step fails, including the ones set to keep going, it
# opens a "Watch run failed" issue that names the steps and links the run.
#
# Optional repository secrets: X_BEARER_TOKEN (X API), BSKY_HANDLE and
# BSKY_APP_PASSWORD (Bluesky search).
#
# Optional repository secrets IA_ACCESS_KEY and IA_SECRET_KEY (free at
# https://archive.org/account/s3.php) enable automatic archiving.
name: Watch

on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      # A fine-grained token with Contents read and write on
      # aLemiscate/accountability-archive, where the raw page copies go (see
      # scripts/archive-copies.mjs). Without it, new snapshots keep only their
      # text and hashes.
      ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check out the archive repository, for raw page copies
        id: archive_checkout
        if: env.ARCHIVE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: aLemiscate/accountability-archive
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: archive-repo
          # Its history and file list, but none of its files: the copy step only adds new ones.
          filter: blob:none
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - name: Install packages
        id: install
        run: npm ci
      - name: Install the browser
        id: browser
        run: npx playwright install --with-deps chromium
      - name: Install pdftotext
        id: pdftotext
        run: sudo apt-get install -y --no-install-recommends poppler-utils  # pdftotext, for quote checks against PDFs

      - name: Watch policy pages
        id: watch
        run: npm run watch-pages

      - name: Check sources
        id: sources
        run: npm run check-sources

      - name: Add every recent post from watched accounts to their archive
        id: posts
        # No topic filter: every post is read in full (see inbox/sweep/TRIAGE.md).
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: npm run find-posts -- --all --from "$(date -u -d '14 days ago' +%F)" --limit all --store

      - name: Queue unread posts for reading
        id: queue
        run: npm run reading-queue

      - name: Snapshot sources that have no snapshot yet
        id: snapshot
        run: npm run capture -- --snapshot-missing --limit 20

      - name: Archive sources that have no archive link
        id: archive
        if: env.IA_ACCESS_KEY != ''
        run: npm run capture -- --archive-missing --limit 25

      - name: Copy raw page copies to the archive repository
        id: copies
        if: always()
        run: |
          if [ ! -d archive-repo ]; then
            n=$(git ls-files --others --ignored --exclude-standard -- snapshots | wc -l)
            if [ "$n" != 0 ]; then echo "::warning::ARCHIVE_TOKEN is not set, so $n raw page file(s) from this run (HTML, screenshots, PDFs) were not kept. Their text and hashes are."; fi
            exit 0
          fi
          npm run archive-copies -- archive-repo
          cd archive-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse snapshots
          if git diff --cached --quiet; then echo "Nothing new for the archive."; exit 0; fi
          git commit -m "Copies for $(git diff --cached --name-only | cut -d/ -f2 | sort -u | wc -l) snapshot(s)"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          echo "::error::Could not push to the archive repository."; exit 1

      - name: Commit results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch reports data/entries snapshots inbox
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Watch: $(date -u +%F) page checks, source health, archives"
            git push
          fi

      - name: Open an issue for changed pages
        id: changed
        if: steps.watch.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.watch.outputs.changed }}
        run: |
          day=$(date -u +%F)
          body="The weekly watcher found edits to watched pages on ${day}."$'\n\n'
          for id in ${CHANGED//,/ }; do
            body+="- **${id}**: [diff](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/HEAD/watch/${id}/${day}.diff)"$'\n'
          done
          body+=$'\n'"If a change weakens or removes a commitment, add a \`did\` entry with a \`revision\` block (npm run new)."
          gh issue create --title "Watched page changed: ${CHANGED//,/, }" --body "$body"

      # continue-on-error hides a step's failure from the run's result (its
      # conclusion reads success), so read each step's outcome instead.
      - name: Open an issue when any step failed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<<"$STEPS" | paste -sd, -)
          if [ -z "$failed" ] && [ "$JOB_STATUS" = success ]; then
            echo "Every step succeeded."
            exit 0
          fi
          day=$(date -u +%F)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The Watch run on ${day} had failing steps: ${failed:-a setup step without an id}."$'\n\n'
          body+="Run log: ${run_url}"$'\n\n'
          body+="A failed posts step lets the rest of the run finish, so this week's reading queue may be missing posts. Fix the cause, then re-run Watch from the Actions tab."
          gh issue create --title "Watch run failed: ${day} (${failed:-setup})" --body "$body"
