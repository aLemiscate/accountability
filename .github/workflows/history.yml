# On demand: pull the archived history of every page in data/history.yaml
# (usage policies, terms, privacy policies, pricing, usage-limit help pages and
# model-retirement pages) from the Wayback Machine, plus each page as it reads
# today. Every distinct text is saved under inbox/history/<id>/ with an index
# of which capture showed which text, so changes can be dated and compared.
# Run it again to continue where a run stopped. Needs no keys.
name: History

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Page ids to pull, space-separated (empty = every page)'
        default: ''
      minutes:
        description: 'Minutes to spend reading captures before saving and stopping'
        default: '320'

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Pull page histories
        run: npm run page-history -- --minutes "${{ inputs.minutes }}" ${{ inputs.only && format('--only "{0}"', inputs.only) || '' }}

      - name: Commit histories
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/history
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "History: archived page versions ($(git diff --cached --name-only -- inbox/history | wc -l) files)"
            for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i * 10)); done
          fi
