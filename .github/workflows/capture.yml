# Backfill evidence: snapshot every cited source that has no snapshot yet
# (page HTML and text, full-page screenshot, X/Bluesky post text, hashes, and
# a Wayback Machine copy), then commit the snapshots and updated entries.
#
# With "history" set, it instead pulls the archived history of pages listed in
# data/history.yaml (usage policies, terms, privacy policies, pricing,
# usage-limit help pages, model-retirement pages): every distinct version the
# Wayback Machine holds, plus each page as it reads today, saved under
# inbox/history/<id>/ (see scripts/page-history.mjs). Run it again to continue
# where a run stopped. Neither mode needs keys.
#
# Run it from the Actions tab ("Capture" → Run workflow). GitHub's runners
# have open internet access, so this works even where a local or cloud
# sandbox blocks news sites, X or archive.org.
name: Capture

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of source URLs to capture in this run
        default: '100'
        required: true
      archive:
        description: Also save a Wayback Machine copy of each source
        type: boolean
        default: true
      history:
        description: 'Pull page histories instead: page ids from data/history.yaml, space-separated, or "all" (empty = take snapshots)'
        default: ''
      minutes:
        description: Minutes a history run may spend reading captures before saving and stopping
        default: '320'

permissions:
  contents: write
  issues: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      # A fine-grained token with Contents read and write on
      # aLemiscate/accountability-archive, where the raw page copies go (see
      # scripts/archive-copies.mjs). Without it, new snapshots keep only their
      # text and hashes.
      ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check out the archive repository, for raw page copies
        id: archive_checkout
        if: env.ARCHIVE_TOKEN != ''
        # A bad token shouldn't stop the capture; the issue step below reports it.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: aLemiscate/accountability-archive
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: archive-repo
          # Its history and file list, but none of its files: the copy step only adds new ones.
          filter: blob:none
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends poppler-utils  # pdftotext, for quote checks against PDFs

      - name: Snapshot sources without a snapshot
        if: inputs.history == ''
        run: npm run capture -- --snapshot-missing --limit "${{ inputs.limit }}" ${{ !inputs.archive && '--no-archive' || '' }}

      - name: Check that quotes match their snapshots
        if: inputs.history == ''
        run: npm run build

      - name: Pull page histories
        if: inputs.history != ''
        run: npm run page-history -- --minutes "${{ inputs.minutes }}" ${{ inputs.history != 'all' && format('--only "{0}"', inputs.history) || '' }}

      - name: Copy raw page copies to the archive repository
        id: copies
        if: always() && inputs.history == ''
        continue-on-error: true
        run: |
          if ! git -C archive-repo rev-parse -q --verify HEAD >/dev/null 2>&1; then
            n=$(git ls-files --others --ignored --exclude-standard -- snapshots | wc -l)
            [ "$n" = 0 ] && exit 0
            if [ -z "$ARCHIVE_TOKEN" ]; then why="the ARCHIVE_TOKEN secret is not set"; else why="the archive repository could not be checked out (has ARCHIVE_TOKEN expired or been revoked?)"; fi
            echo "::error::$n raw page file(s) from this run (HTML, screenshots, PDFs) were not kept, because $why. Their text and hashes are."
            exit 1
          fi
          npm run archive-copies -- archive-repo
          cd archive-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse snapshots
          if git diff --cached --quiet; then echo "Nothing new for the archive."; exit 0; fi
          git commit -m "Copies for $(git diff --cached --name-only | cut -d/ -f2 | sort -u | wc -l) snapshot(s)"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          echo "::error::Could not push to the archive repository."; exit 1

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots data/entries data/commitments data/patterns.yaml
          if [ -d inbox/history ]; then git add inbox/history; fi
          if git diff --cached --quiet; then
            echo "Nothing new captured."
          else
            if [ -n "${{ inputs.history }}" ]; then
              git commit -m "History: archived page versions ($(git diff --cached --name-only -- inbox/history | wc -l) files)"
            else
              git commit -m "Capture: snapshots for $(git diff --cached --name-only -- snapshots | cut -d/ -f2 | sort -u | wc -l) source(s)"
            fi
            pushed=0
            for i in 1 2 3 4; do git pull --rebase && git push && pushed=1 && break; sleep $((i * 10)); done
            if [ "$pushed" != 1 ]; then git status --short | head -20; echo "::error::Could not push the capture commit."; exit 1; fi
          fi

      # continue-on-error hides these steps' failures from the run's result,
      # so read their outcomes instead.
      - name: Open an issue when raw page copies were not kept
        if: always() && (steps.archive_checkout.outcome == 'failure' || steps.copies.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="This Capture run could not save its raw page copies (HTML, screenshots, PDFs) to aLemiscate/accountability-archive. Their text and hashes were committed here."$'\n\n'
          body+="Run log: ${run_url}"$'\n\n'
          body+="The usual cause is an expired or revoked ARCHIVE_TOKEN. Create a new fine-grained token with Contents read and write on accountability-archive only, and save it as the ARCHIVE_TOKEN secret."
          gh issue create --title "Capture run did not keep raw page copies: $(date -u +%F)" --body "$body"
