title: Said / Did
tagline: What OpenAI and Anthropic promised and claimed, and what they did next.
description: >-
  A living, sourced record of public claims and promises made by OpenAI,
  Anthropic and their leaders, about safety and ethics and about their
  products (capabilities, features and release dates, usage limits and plan
  terms), set against what the companies later did.
  Every entry cites its sources. Commentary is labeled as commentary.
