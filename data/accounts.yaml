# Public accounts of in-scope people and organizations, for `npm run find-posts`.
# Every account must belong to an actor in actors.yaml (same scope rules:
# public or official role only, no private accounts).
#
#   actor     id from actors.yaml
#   x         X/Twitter handle, without @
#   bluesky   Bluesky handle (e.g. name.bsky.social), if they post there
#   match     optional topic filter for this account's sweep triage list
#             (a regex; replaces the run's default)
#   sweep     false to leave the account out of the full-history Sweep
#   since     YYYY-MM the person joined the company or its board. Posts from
#             before then are not claims by the company and are read only
#             once; posts from then on (including after they left, when they
#             speak as former staff) are read for every kind of claim.
#             Omit when all their posts count (org accounts, founders).
#   tenure    instead of since, for someone who left and came back: a list
#             of YYYY-MM..YYYY-MM ranges (an open end means "to now").
#   speaks_for  false for someone in the record who never spoke for either
#             company (a litigant or outside critic). Their posts are read once
#             for what they say about the companies; there are no company
#             claims among them to re-read for.
#
# Confirm a handle belongs to the person before relying on results.

- actor: openai
  x: OpenAI
- actor: sam-altman
  x: sama
- actor: greg-brockman
  x: gdb
- actor: ilya-sutskever
  x: ilyasut
- actor: jan-leike
  x: janleike
  since: 2021-01
- actor: caitlin-kalinowski
  x: kalinowski007
  since: 2024-11
- actor: anthropic
  x: AnthropicAI
  bluesky: anthropic.com
- actor: dario-amodei
  x: DarioAmodei
- actor: jack-clark
  x: jackclarkSF
  since: 2016-01
