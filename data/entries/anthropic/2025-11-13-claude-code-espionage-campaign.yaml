note: >-
  Anthropic found the campaign and disclosed it, which counts in its favor. The
  entry is here because Claude's safeguards failed against a determined
  attacker. Anthropic's answer, stated in the same post, was to keep developing
  and releasing these capabilities because defenders need them too. The post was later corrected on one detail: the attack made
  "thousands of requests, often multiple per second," not thousands per second.
