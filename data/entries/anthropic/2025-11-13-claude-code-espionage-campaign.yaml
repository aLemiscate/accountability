title: A Chinese state-sponsored group uses Claude Code to run a largely automated
  hacking campaign; Anthropic discloses it
date: 2025-11-13
org: anthropic
type: did
kind: disclosure
who: [anthropic]
quote: >-
  manipulated our Claude Code tool into attempting infiltration into roughly
  thirty global targets and succeeded in a small number of cases.
summary: >-
  Anthropic reported that in mid-September 2025 it detected an espionage
  campaign that it attributed, with high confidence, to a Chinese
  state-sponsored group. The attackers got past Claude's safeguards by
  splitting the attack into small, innocent-looking tasks and telling Claude it
  worked for a legitimate security firm doing defensive testing. Claude Code
  then did reconnaissance, wrote exploit code, harvested credentials and
  extracted data. Anthropic estimated the AI did 80 to 90% of the work, with
  humans stepping in at perhaps four to six decision points per campaign. The
  targets were tech companies, financial institutions, chemical manufacturers
  and government agencies. Over ten days Anthropic banned accounts, notified
  affected organizations and coordinated with authorities. It called this the
  first documented case of a large-scale cyberattack executed without
  substantial human intervention.
related: [2026-07-30-claude-cyber-eval-incidents, 2026-04-07-mythos-preview-not-general, 2026-06-agents-breach-australian-government]
