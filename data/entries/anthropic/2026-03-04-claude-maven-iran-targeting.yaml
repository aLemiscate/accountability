title: 'Reports: Claude, through Palantir''s Maven, helped pick and rank targets
  in the strikes on Iran'
date: 2026-03-04
org: anthropic
type: did
kind: outcome
who: [anthropic]
summary: >-
  The Washington Post reported that to strike more than 1,000 targets in the
  first 24 hours of the U.S. war on Iran, the military used Claude embedded in
  Palantir's Maven Smart System. The Post said the system proposed hundreds of
  targets, ranked them by importance and issued precise location coordinates.
  Its sources said Claude would stay in use until the Pentagon found a
  replacement, even though days earlier the President had directed agencies to
  stop using Anthropic's products. Weeks before, the Wall
  Street Journal had reported that Claude, also through Palantir, was used in the
  January operation to capture Nicolás Maduro, though not how. Anthropic had said
  Claude was used across the Pentagon for "operational planning," among other
  things. Its two red lines, fully autonomous weapons and mass domestic
  surveillance, don't cover target selection when a human approves the strike.
related: [2026-02-27-anthropic-pentagon-red-lines, 2024-11-07-palantir-aws-defense, 2025-07-14-defense-contract-200m]
