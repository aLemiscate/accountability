response: >-
  On the Maduro report, Anthropic said it "cannot comment" on any specific
  operation and that any use must comply with its usage policies, according to
  Small Wars Journal's summary of the Journal's story. Amodei's February 26
  statement said "partially autonomous weapons, like those used today in
  Ukraine, are vital to the defense of democracy."
updates:
  - date: 2026-03-24
    text: >-
      Military Times reported that Maven "uses Anthropic's Claude AI model,
      embedded in its system, to semi-autonomously rank targets by strategic
      importance, drafting automated legal justifications for each strike."
      More than 120 House Democrats had asked the Pentagon whether Maven was used
      to identify the Shajareh Tayyebeh elementary school in Minab as a target;
      a Tomahawk strike there on the war's first day killed at least 168 people.
      CNN's sources said preliminary findings pointed to outdated Defense
      Intelligence Agency data. None of the reporting cited here ties Claude to
      that strike.
    sources:
      - title: Deadly Iran school strike casts shadow over Pentagon's AI targeting
          push
        publisher: Military Times
        url: https://www.militarytimes.com/news/your-military/2026/03/24/deadly-iran-school-strike-casts-shadow-over-pentagons-ai-targeting-push/
        date: 2026-03-24
        type: reporting
        snapshot: snapshots/2026-09-30-militarytimes.com-07a5595d
note: >-
  This entry doesn't show a broken promise. Anthropic never promised to stay out
  of targeting, and nothing public says a human was taken out of the loop. It's
  here because the red lines Anthropic was praised and punished for holding
  cover much less than "no help with killing," and the record should show both
  the red lines and what they leave out. The reporting relies on unnamed
  sources; the Pentagon and Anthropic haven't confirmed the details.
