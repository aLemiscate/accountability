title: 'Anthropic: Claude 3.5 Haiku comes "at the same cost as before"; it
  launched at four times the price'
date: 2024-10-22
org: anthropic
type: said
kind: claim
who: [anthropic]
venue: Launch thread on X for the upgraded Claude 3.5 Sonnet and Claude 3.5 Haiku
quote: >-
  Haiku now outperforms many state-of-the-art models on coding tasks—including
  the original Claude 3.5 Sonnet and GPT-4o—at the same cost as before.
summary: >-
  Announcing Claude 3.5 Haiku, Anthropic said it would match earlier top models
  "at the same cost as before" and be released "later this month." It came out
  on Nov. 4, priced at $1 per million input tokens and $5 per million output
  tokens, four times Claude 3 Haiku's $0.25 and $1.25, and without the image
  input its predecessor had. "During final testing, Haiku surpassed Claude 3
  Opus, our previous flagship model, on many benchmarks—at a fraction of the
  cost," Anthropic wrote. "As a result, we've increased pricing for Claude 3.5
  Haiku to reflect its increase in intelligence." In December it cut the price
  to $0.80 and $4.
concreteness: measurable
status: broken
patterns: []
