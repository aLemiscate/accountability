updates:
  - date: 2026-03-05
    text: >-
      Anthropic said it had received the Department's letter formally
      designating it a supply chain risk, would challenge it in court, and would
      keep supplying its models to the military "at nominal cost" during any
      transition. Amodei also apologized for the tone of a leaked internal post
      written on the day of the blacklisting.
    sources:
      - title: Where things stand with the Department of War
        publisher: Anthropic
        url: https://www.anthropic.com/news/where-stand-department-war
        date: 2026-03-05
        type: primary
        snapshot: snapshots/2026-09-29-anthropic.com-d3ae286e
  - date: 2026-03-26
    text: A federal judge blocked the designation while the case proceeded.
    sources:
      - title: Judge blocks Pentagon's effort to 'punish' Anthropic by labeling it a
          supply chain risk
        publisher: CNN
        url: https://www.cnn.com/2026/03/26/business/anthropic-pentagon-injunction-supply-chain-risk
        date: 2026-03-26
        type: reporting
        archive: https://web.archive.org/web/20260929212057/https://www.cnn.com/2026/03/26/business/anthropic-pentagon-injunction-supply-chain-risk
        snapshot: snapshots/2026-09-29-cnn.com-541985bc
  - date: 2026-08-27
    text: >-
      A federal judge ruled the designation "constituted unlawful retaliation in
      violation of the First Amendment."
    sources:
      - title: Judge rules the Pentagon's supply chain risk label for Anthropic unlawful
        publisher: CNN
