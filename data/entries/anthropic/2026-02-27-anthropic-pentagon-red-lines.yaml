title: Anthropic refuses to drop its limits on mass surveillance and autonomous
  weapons, and is blacklisted
date: 2026-02-27
org: anthropic
type: said
kind: commitment
who: [anthropic, dario-amodei]
venue: Public standoff with the Department of Defense
quote: >-
  Regardless, these threats do not change our position: we cannot in good
  conscience accede to their request.
summary: >-
  Anthropic refused Pentagon demands to remove restrictions that bar Claude's
  use for mass domestic surveillance and fully autonomous weapons, arguing the
  models aren't reliable enough for those uses and that powerful AI raises
  serious privacy risks. On February 27, the President directed federal agencies
  to stop using Anthropic's AI, and Defense Secretary Pete Hegseth designated
  the company a "supply chain risk to national security." The stance wasn't
  new. In September 2025 Semafor reported that Anthropic had turned down
  contractors for the FBI, Secret Service and ICE rather than make exceptions
  to its ban on domestic surveillance. Officials complained the policy was
  vague and "selectively" enforced.
concreteness: measurable
status: kept
breaks_if: >-
  Anthropic relaxes those two restrictions for any government customer, or
  settles the dispute on terms that do.
patterns: [principles-with-a-price]
related: [2026-02-27-pentagon-classified-deal]
