title: 'White House commitments: Anthropic will "publish reports for all new
  significant model public releases"'
date: 2023-07-21
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Voluntary commitments announced at the White House
quote: >-
  They commit to publish reports for all new significant model public releases
  within scope.
summary: >-
  Anthropic signed the same voluntary commitments as OpenAI and five other
  companies: internal and external red-teaming before release, information
  sharing on risks, protecting unreleased model weights, watermarking, research
  on bias and discrimination, and a public report for every significant model
  release in scope. The companies said they intended the commitments "to remain
  in effect until regulations covering substantially the same issues come into
  force."
concreteness: conditional
status: open
breaks_if: >-
  A significant public model release ships without a public report on its safety
  evaluations, limitations and societal risks; or Anthropic says the commitments
  no longer apply without regulation having replaced them.
patterns: []
related: [2023-07-21-white-house-voluntary-commitments]
