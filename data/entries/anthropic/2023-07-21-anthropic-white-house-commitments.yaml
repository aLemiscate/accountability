  - title: 'FACT SHEET: Biden-Harris Administration Secures Voluntary Commitments
      from Leading Artificial Intelligence Companies to Manage the Risks Posed
      by AI'
    publisher: The White House
    url: https://bidenwhitehouse.archives.gov/briefing-room/statements-releases/2023/07/21/fact-sheet-biden-harris-administration-secures-voluntary-commitments-from-leading-artificial-intelligence-companies-to-manage-the-risks-posed-by-ai/
    date: 2023-07-21
    type: primary
    snapshot: snapshots/2026-09-29-bidenwhitehouse.archives.gov-a9468089
note: >-
  Same promise, same standard as OpenAI's entry. Anthropic has kept publishing
  system cards for its major releases (Opus 4.5, Opus 4.6, Mythos 5 and Opus 5
  among them) and, since 2026, risk reports. That's why this one is still open
  rather than eroded.
