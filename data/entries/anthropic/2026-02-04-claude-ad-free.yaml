updates:
  - date: 2026-02-05
    text: >-
      OpenAI president Greg Brockman asked Anthropic and Dario Amodei on X:
      "will you commit to never selling claude's 'users' attention or data to
      advertisers'? genuine question, your blog post makes it sound like you're
      keeping the option open." This record found no public answer.
    sources:
      - title: Greg Brockman on X
        publisher: X
        url: https://x.com/gdb/status/2019300639155900608
        date: 2026-02-05
        type: primary
        snapshot: snapshots/2026-09-30-x.com-8c00d1e8
note: >-
  This is a clear, measurable promise, and a marketing campaign. The exit clause
  means it's a promise to explain a reversal, not a promise never to reverse.
  OpenAI's "last resort" took twenty months. The promise also costs Anthropic
  less than it would cost a consumer-first company. Two weeks earlier, at Davos,
  Amodei put the business at "maybe 80-20 on the enterprise side" and said: "And
  so that really allows us to proceed in a different way, right? We don't have
  to do ads." (Quoted from the audio of CNBC's Squawk Pod, about 4:16.)
