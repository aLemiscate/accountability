title: 'Standing promise: "Claude will remain ad-free"'
date: 2026-02-04
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Blog post, "Claude is a space to think," plus a Super Bowl campaign
quote: >-
  Claude will remain ad-free. … There are many good places for advertising. A
  conversation with Claude is not one of them.
summary: >-
  Anthropic promised no ads or sponsored links next to conversations and no
  advertiser influence on responses, and launched a Super Bowl campaign ("Ads
  are coming to AI. But not to Claude.") aimed at ChatGPT's new ads. The same
  post includes an exit: "Should we need to revisit this approach, we'll be
  transparent about our reasons for doing so."
concreteness: measurable
status: open
breaks_if: >-
  Sponsored links, product placement or affiliate recommendations in Claude
  responses or next to conversations; ads in Claude apps; or an announcement
  that "revisits" the approach.
patterns: []
related: [2026-02-04-altman-never-run-ads-like-that]
