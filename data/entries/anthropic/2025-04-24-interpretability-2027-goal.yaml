title: 'Standing goal: interpretability that "can reliably detect most model
  problems" by 2027'
date: 2025-04-24
org: anthropic
type: said
kind: commitment
who: [dario-amodei, anthropic]
venue: Essay, "The Urgency of Interpretability"
quote: >-
  Anthropic is doubling down on interpretability, and we have a goal of getting
  to “interpretability can reliably detect most model problems” by 2027.
summary: >-
  Amodei argued that AI systems equivalent to "a country of geniuses in a
  datacenter" could arrive "as soon as 2026 or 2027," that deploying them
  without understanding how they work would be "basically unacceptable," and
  that interpretability was in a race with model capability. He set a dated goal
  for Anthropic and described the end state as something like a brain scan of a
  model, able to identify "tendencies to lie or deceive, power-seeking, flaws in
  jailbreaks" and more, which he said would likely be a key part of testing and
  deploying models at AI Safety Level 4. Anthropic's interpretability work since
  has included tools it used in safety testing of new models, such as the
  natural-language autoencoders it described in May 2026.
concreteness: directional
status: open
breaks_if: >-
  The end of 2027 passes without Anthropic showing interpretability detecting
  most problems in its frontier models, and without saying it missed the goal;
  or Anthropic releases ASL-4 models without the interpretability-based checks
  it described.
patterns: [unfalsifiable]
