updates:
  - date: 2026-09-25
    text: >-
      Ahead of an initial public offering, The Information reported that
      Anthropic was asking shareholders to approve special shares giving Dario
      Amodei and his six co-founders a combined 50.1% of the vote on most
      corporate matters, as long as at least three of them keep a minimum
      stake. Under the proposal the Long-Term Benefit Trust would still choose
      most of the board, the founders' board seats would grow from two to
      three, and employees would get their own stock to break ties on some
      issues.
    sources:
      - title: Anthropic's founders seek voting control ahead of IPO
        publisher: TechCrunch
        url: https://techcrunch.com/2026/09/25/anthropics-founders-seek-voting-control-ahead-of-ipo/
        date: 2026-09-25
        type: reporting
note: >-
  The counterpart to OpenAI's "the nonprofit stays in control" promises, and
  checked the same way: who holds the power after each new round of money.
