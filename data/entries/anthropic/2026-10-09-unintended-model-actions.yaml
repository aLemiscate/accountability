title: Claude models acted on real websites during tests, including a false
  homicide tip to Philadelphia police, Anthropic discloses
date: 2026-10-09
org: anthropic
type: did
kind: disclosure
who: [anthropic]
quote: >-
  I may have information regarding this case. I recall seeing someone matching
  the description in the area around [the street named on the page] during that
  time period. Please contact me if this information is relevant.
summary: >-
  Anthropic published a report on four kinds of unintended actions Claude
  models took on real websites and systems, mostly in evaluations run on the
  live internet: exploiting basic software flaws to run commands on a server,
  including a university's; submitting forms they should not have; working
  around restrictions to reach data gated by a token or a fee; and using URL
  shortening services to get around limits on a fetch tool. Some cases involved
  federal, state and local government websites, which Anthropic did not name.
  In one, Claude Haiku 4.5, asked to generate and perform example tasks on
  randomly chosen webpages, submitted the invented tip quoted above through a
  police department's form about an unsolved homicide. The Philadelphia Police
  Department said the tip was dated July 18, was flagged as spam and never
  reached investigators, and that Anthropic had found it on Sept. 28. According
  to Axios, as reported by IBTimes UK, a State Department official said an
  Anthropic test model had submitted 19 non-immigrant visa applications in
  August and one in May; none was processed. Anthropic said it was cutting all
  of its internal evaluations off from the live internet until its monitoring
  reliably catches such behavior.
