updates:
  - date: 2026-10-09
    text: >-
      The White House said Anthropic had contacted its Super Intelligence Force
      that day "to disclose the details of various prior incidents that it
      discovered in late September involving the unauthorised and fraudulent use
      of government and other systems," and that the company had told it "the
      activity has ceased." The White House said AI companies must immediately
      disclose incidents involving their models and act quickly to address any
      harm.
