title: Anthropic traces six weeks of Claude Code complaints to three of its own
  changes, including a default it calls "the wrong tradeoff"
date: 2026-04-23
org: anthropic
type: did
kind: disclosure
who: [anthropic, boris-cherny]
quote: >-
  This was the wrong tradeoff. We reverted this change on April 7 after users
  told us they'd prefer to default to higher intelligence and opt into lower
  effort for simple tasks.
summary: >-
  From early March 2026, Claude Code users reported that it had become less
  capable. In early April an AMD AI director filed an analysis of 6,852 sessions
  concluding that Claude "cannot be trusted to perform complex engineering
  tasks." Claude Code's head, Boris Cherny, called two circulating claims false:
  that paying subscribers got worse models than enterprise customers ("We serve
  exactly the same models to all users"), and that the switch to a medium effort
  default was hidden ("Literally nothing sneaky about it"). Anthropic's April 23
  postmortem bore out both narrow points (the change was in the changelog and an
  in-product dialog) but found the complaints were right. On March 4 it had
  lowered Claude Code's default reasoning effort from high to medium to cut
  latency; on March 26 a bug began deleting Claude's earlier reasoning on every
  turn, making it "forgetful and repetitive," until April 10; and on April 16 a
  system-prompt limit on response length cut coding quality by 3% on one
  evaluation until April 20. Anthropic said neither its internal use nor its
  evaluations had at first reproduced the problems, that users' reports were
  what found them, and it reset usage limits for all subscribers.
patterns: [ship-then-patch]
related: [2025-09-09-never-degrade-model-quality]
