response: >-
  Anthropic said it takes reports of degradation "very seriously," that the API
  and inference layer were not affected, and that it would have more staff use
  the public build, run per-model evaluations on every Claude Code system-prompt
  change, and add soak periods and gradual rollouts for changes that could trade
  off against intelligence. Cherny had earlier said the hidden thinking display
  was "a UI-only change" that "does not impact thinking itself."
note: >-
  Cherny's specific denials held up; the general complaint he was answering also
  held up. The comparison in this record is OpenAI's GPT-4o sycophancy rollback:
  in both, a change passed internal checks and users found the problem.
