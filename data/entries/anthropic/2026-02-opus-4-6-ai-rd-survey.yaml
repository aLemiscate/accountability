response: >-
  Anthropic wrote that it had committed to publishing sabotage risk reports for
  models beyond Opus 4.5 "so as not to rely on difficult and subjective
  assessments of model capabilities like the one above for compliance with the
  RSP," and published one for Opus 4.6.
note: >-
  Anthropic disclosed the method in detail, which is how outsiders found the
  problem with it. The same month, OpenAI's first High cyber model raised a
  similar question about who decides when a threshold is crossed (see related).
