response: >-
  Anthropic said the bypass exposed no "unique Mythos-level cyber
  capabilities" and fell within a deliberate safety margin, that no universal
  jailbreak had been found, and that researchers at the Commerce Department's
  Center for AI Standards and Innovation had tested its old and new safeguards
  and found them "extraordinarily strong." It said the government should be able
  to block unsafe deployments through a statutory process that is "transparent,
  fair, clear, and grounded in technical facts," and that this action was not
  one.
updates:
  - date: 2026-06-26
    text: >-
      Two weeks later OpenAI released its GPT-5.6 models only to a "small group
      of trusted partners" whose participation had been shared with the
      government; Altman wrote that the limited launch came "at the request of
      the US government." OpenAI said: "We don't believe this kind of government access process should
      become the long-term default."
