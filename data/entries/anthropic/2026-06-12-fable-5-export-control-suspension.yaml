title: US government orders export controls on Fable 5 three days after launch
  over a safeguard bypass; Anthropic pulls it for everyone
date: 2026-06-12
org: anthropic
type: did
kind: outcome
who: [anthropic]
quote: >-
  we disagree that the finding of a narrow potential jailbreak should be cause
  for recalling a commercial model deployed to hundreds of millions of people.
summary: >-
  On June 12, 2026, the US government, citing national security authorities,
  issued an export control directive barring any foreign national, inside or
  outside the United States, from using Claude Fable 5 or Mythos 5. Anthropic
  said it could not verify nationality in real time, so it suspended both
  models for all users. By Anthropic's account, the directive followed a report
  in which Amazon researchers found a way to bypass Fable 5's safeguards: the
  model identified a number of software vulnerabilities and, in one case, wrote
  code demonstrating how one could be exploited. Anthropic said every model it
  tested, including Claude Haiku 4.5, could produce the same demonstration. The
  Commerce Department lifted the controls on June 30, and Fable 5 returned on
  July 1 with a new classifier that Anthropic said blocks the reported technique
  in over 99% of cases.
