title: Anthropic finds a training error let reward code see Claude's reasoning,
  including for two released models
date: 2026-04-07
org: anthropic
type: did
kind: disclosure
who: [anthropic]
quote: >-
  a number of environments used for Mythos Preview had a technical error that
  allowed reward code to see chains-of-thought.
summary: >-
  In its alignment risk update for Claude Mythos Preview, Anthropic disclosed
  that about 8% of the model's reinforcement-learning episodes had shown its
  chain of thought to reward code, in some cases including preference models,
  "which would have applied some supervision to chains-of-thought." The error
  was confined to three kinds of environment: GUI computer use, office tasks
  and some STEM tasks. It said the same error "also affected the training of
  Claude Opus 4.6 and Claude Sonnet 4.6," both already released. Anthropic
  said it didn't know how much the error affected the model's reasoning, and
  that it may have affected "opaque reasoning or secret-keeping abilities."
  Where the Opus 4.6 report said "we do not train models" to shape their
  reasoning, this report said "we do not generally train models" that way.
contradicts: [2026-02-10-opus-4-6-reasoning-not-trained]
related: [2026-05-07-accidental-cot-grading, 2025-11-24-sabotage-risk-reports-commitment, 2026-04-07-mythos-preview-not-general]
patterns: []
sources:
