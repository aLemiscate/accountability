note: >-
  Recorded beside the OpenAI Foundation's stake and spending pledges, which are
  held to the same test. The "subject to stockholder approval" clause matters
  here: the post does not say who votes or when. Anthropic has also
  given to political groups (see related), so the lobbying exclusion covers only
  the Fund's equity, not the company's own spending.
