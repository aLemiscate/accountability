title: 'Anthropic forecasts that "in two years, AI will favor defense" in
  cybersecurity'
date: 2026-10-08
org: anthropic
type: said
kind: claim
who: [anthropic]
venue: Anthropic announcement, "Introducing the Anthropic Cyber Mission"
quote: >-
  Our forecast is that in two years, AI will favor defense: it will be easier to
  catch bugs before they ship, write fundamentally secure software from scratch,
  and actively defend systems with models. But in the near term, that may not be
  true.
summary: >-
  Launching what it called "a long-term commitment to securing the systems
  everyone depends on," Anthropic started a Critical Infrastructure Defense
  Program with eleven security and industrial firms and OSS Scanner, free
  model-run scans for open-source projects whose reports are "sent without human
  review"; it said it expects "a true-positive rate above 90%." It wrote that
  "Highly cyber-capable AI models are widely available to attackers now," that
  defensive tools "have not yet reached enough of the defenders who need them,"
  and that over the coming months it would "share what we learn along the way,
  including what didn't work."
concreteness: directional
status: open
last_checked: 2026-10-14
due: '2028-10'
breaks_if: >-
  In October 2028, Anthropic's own threat reporting or independent security
  research shows AI still favoring attackers, for example AI-found
  vulnerabilities being exploited faster than they are fixed; or OSS Scanner's
  reports run well below the 90% true-positive rate Anthropic expected.
patterns: []
related: [2026-04-07-glasswing-report-back, 2026-04-07-mythos-preview-not-general]
sources:
  - title: Introducing the Anthropic Cyber Mission
    publisher: Anthropic
    url: https://www.anthropic.com/news/anthropic-cyber-mission
    date: 2026-10-08
    type: primary
    snapshot: snapshots/2026-10-14-anthropic.com-c4a1f46e
note: >-
  A dated forecast in Anthropic's own words, made while it widened access to its
  most cyber-capable models. "Favor defense" has no agreed measure; the
  breaks-if test uses the gap between finding and fixing that Anthropic itself
  pointed to in Glasswing.
