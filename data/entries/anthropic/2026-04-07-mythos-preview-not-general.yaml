title: 'Standing promise: no general release of a Mythos-class model until
  safeguards "reliably block their most dangerous outputs"'
date: 2026-04-07
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Project Glasswing announcement and post on X
quote: >-
  We do not plan to make Mythos Preview generally available. Our goal is to
  deploy Mythos-class models safely at scale, but first we need safeguards that
  reliably block their most dangerous outputs.
summary: >-
  Anthropic announced Claude Mythos Preview, an unreleased frontier model that
  it said showed AI can "surpass all but the most skilled humans at finding and
  exploiting software vulnerabilities." It gave the model only to Project
  Glasswing partners and more than 40 other organizations that maintain
  critical software, for defensive work. It said it
  would test the safeguards needed for a general release on an upcoming Claude
  Opus model first.
concreteness: conditional
status: open
breaks_if: >-
  A generally available Mythos-class model is shown to give attackers
  Mythos-level cyber capability that other public models don't, through a
  bypass Anthropic knew of or failed to fix promptly; or Anthropic releases a
  Mythos-class model without the safeguards it described.
patterns: []
related: [2026-08-14-risk-report-classifier-gap, 2026-07-30-claude-cyber-eval-incidents]
