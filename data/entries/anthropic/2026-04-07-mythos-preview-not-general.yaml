updates:
  - date: 2026-06-09
    text: >-
      Anthropic released Claude Fable 5, "a Mythos-class model that we've made
      safe for general use." Queries on a narrow range of topics are routed to
      Claude Opus 4.8 instead; Anthropic said the safeguards were tuned
      conservatively and trigger in under 5% of sessions. It released Claude
      Mythos 5, "the same underlying model as Fable 5, but with the safeguards
      lifted in some areas," to a small group of cyber defenders.
