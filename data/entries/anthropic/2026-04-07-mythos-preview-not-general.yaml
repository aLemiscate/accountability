        snapshot: snapshots/2026-09-30-anthropic.com-e11fcea9
  - date: 2026-06-12
    text: >-
      Three days after launch, the US government ordered export controls on both
      models after Amazon researchers reported a way around Fable 5's
      safeguards, and Anthropic pulled them for all users. See
      2026-06-12-fable-5-export-control-suspension.
  - date: 2026-08-14
    text: >-
      Anthropic's Risk Report disclosed that data-labeling contractors had used
      a platform flaw in April 2026 to reach Mythos Preview, running without
      classifiers, for about two weeks. See
      2026-08-14-risk-report-classifier-gap.
  - date: 2026-09-01
    text: >-
      Anthropic released Claude Fable 5.1 to everyone and Claude Mythos 5.1, the
      same model with lighter safeguards in some areas, only to U.S.
      participants in its trusted access programs, including a new invite-only
      program giving vetted life scientists reduced biology safeguards. It said
      Fable 5.1 may now be used to find software vulnerabilities but not to
      develop exploits for them, and that its cyber safeguards produce about 60%
      fewer false positives in Claude Code.
