  - date: 2026-06-12
    text: >-
      Three days after launch, the US government ordered export controls on
      both models after Amazon researchers reported a way around Fable 5's
      safeguards, and Anthropic pulled them for all users. See
      2026-06-12-fable-5-export-control-suspension.
  - date: 2026-08-14
    text: >-
      Anthropic's Risk Report disclosed that data-labeling contractors had used a
      platform flaw in April 2026 to reach Mythos Preview, running without
      classifiers, for about two weeks. See 2026-08-14-risk-report-classifier-gap.
note: >-
  "Reliably" is the load-bearing word, and Anthropic's own position is that no
  model can be made fully jailbreak-proof. It argues its safeguards block the
  outputs that matter even when minor bypasses are found. The record tests that
  claim against what is later reported.
