  - date: 2026-07-21
    text: >-
      Federal lobbying disclosures show Anthropic's spending rising from
      $200,000 in 2023, all of it paid to an outside firm, to $720,000 in 2024,
      and to a record $1.97 million in the second quarter of 2026 alone, more
      than Nvidia spent that quarter. (TechCrunch, citing OpenSecrets, put 2023
      at $280,000; that figure appears to add $80,000 a subcontractor reported,
      which under the disclosure rules is already part of the prime firm's
      fees.) Its reported issues included cybersecurity, copyright, cloud
      computing and defense procurement.
