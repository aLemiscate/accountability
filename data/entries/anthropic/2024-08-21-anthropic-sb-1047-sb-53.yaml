title: Anthropic says SB 1047's benefits "likely outweigh its costs," then
  endorses its successor, SB 53
date: 2024-08-21
org: anthropic
type: did
kind: action
who: [anthropic, dario-amodei]
quote: >-
  In our assessment the new SB 1047 is substantially improved, to the point
  where we believe its benefits likely outweigh its costs. However, we are not
  certain of this, and there are still some aspects of the bill which seem
  concerning or ambiguous to us.
summary: >-
  After first submitting a "support if amended" letter, Anthropic told Gov.
  Newsom that the amended SB 1047 likely presented "a feasible compliance burden
  for companies like ours" and that its benefits likely outweighed its costs,
  stopping short of a full endorsement. Newsom vetoed the bill. In September
  2025 Anthropic formally endorsed the narrower SB 53, which requires large
  developers to publish safety frameworks, release transparency reports, report
  critical safety incidents within 15 days and protect whistleblowers, while
  saying frontier AI safety is best handled federally. TechCrunch reported that
  Meta and OpenAI lobbied against it; Newsom signed it on Sept. 29, 2025.
patterns: []
