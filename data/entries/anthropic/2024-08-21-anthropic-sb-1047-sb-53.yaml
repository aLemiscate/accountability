updates:
  - date: 2025-06-05
    text: >-
      In a New York Times op-ed, Amodei opposed the proposed 10-year federal
      moratorium on state AI laws: "a 10-year moratorium is far too blunt an
      instrument," and without a federal plan "would give us the worst of both
      worlds — no ability for states to act, and no national policy as a
      backstop." He called for a federal transparency standard instead.
