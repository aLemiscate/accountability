updates:
  - date: 2025-06-05
    text: >-
      In a New York Times op-ed, Amodei opposed the proposed 10-year federal
      moratorium on state AI laws: "a 10-year moratorium is far too blunt an
      instrument," and without a federal plan "would give us the worst of both
      worlds — no ability for states to act, and no national policy as a
      backstop." He called for a federal transparency standard instead.
    sources:
      - title: Anthropic's Dario Amodei says AI element in GOP megabill 'far too blunt
          an instrument'
        publisher: The Hill
        url: https://thehill.com/policy/technology/5334913-anthropic-ceo-ai-regulation-donald-trump-gop-megabill/
        date: 2025-06-05
        type: reporting
        snapshot: snapshots/2026-09-30-thehill.com-f20c4c8e
  - date: 2026-05-19
    text: >-
      On The Oprah Podcast, Daniela Amodei described the 2024 letter as
      "Anthropic's decision to publicly support SB 1047," adding, "we thought it
      was drafted imperfectly." The letter itself stopped short of a full
      endorsement. (Quoted from the audio of The Oprah Podcast, about 39:18.)
    sources:
      - title: The Co-Founders of Claude AI Tell Oprah About the Impact Artificial
          Intelligence Has on Your Life
        publisher: The Oprah Podcast
        url: https://podcasts.apple.com/us/podcast/the-co-founders-of-claude-ai-tell-oprah-about/id1782960381?i=1000768533274
        date: 2026-05-19
        type: primary
        snapshot: snapshots/2026-10-07-podcasts.apple.com-f4b009e5
  - date: 2026-06-10
    text: >-
      Anthropic also endorsed New York's RAISE Act, saying its safeguards were
      "raising the bar," and Illinois's S.B. 315, which adds annual outside
      audits. Its head of external affairs, Sarah Heck, said the California and
      New York laws "should inspire Congress to build on them." The company said
      Congress should not preempt state law unless it first passes a "strong"
      federal framework.
