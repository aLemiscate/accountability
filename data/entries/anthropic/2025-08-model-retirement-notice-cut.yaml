title: Anthropic quietly cuts the notice it promises before retiring a model, from
  "at least 6 months" to "at least 60 days"
date: 2025-08
org: anthropic
type: did
kind: action
who: [anthropic]
quote: >-
  We provide at least 60 days notice before model retirement for publicly
  released models.
summary: >-
  From September 2024, Anthropic's model deprecations page said it gave "at
  least 6 months † notice before model retirement for publicly released
  models" (the dagger marked a 60-day exception for the old Claude 1 family),
  and that each model got a "Guaranteed Available Until" date "at least one
  year out." The guarantee and its column were taken off the page between
  February 27 and March 4, 2025. Between August 7 and August 10, 2025, "6
  months" became "60 days," with no note of the change. The same edit added
  a "Not sooner than" retirement date a year after each active model's
  release, and a warning that deprecated models "are likely to be less
  reliable." Three days later, on August 13, Anthropic told developers the two
  Claude Sonnet 3.5 models would be retired on October 22, 70 days out (later
  moved to October 28). The two retirements announced in 2025 before the
  change gave 181 and 189 days' notice. Of the seven announced since, through
  September 2026, one gave 114 days and the other six gave 60 to 76.
patterns: [silent-edit]
related: [2025-11-04-model-weight-preservation]
