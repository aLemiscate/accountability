response: >-
  No statement from Anthropic about the change was found. Its API release
  notes for August 2025 list the Sonnet 3.5 retirement but not the new notice
  period.
note: >-
  The first archived copy of the page, from September 7, 2024, said "at least
  60 days" and a guaranteed date "typically one year out"; by September 12 it
  said 6 months and "at least one year out," so the August 2025 edit went back
  to where the page began. Every model retired so far stayed available until
  at least the date it was guaranteed or promised, so this is a shorter
  warning, not an earlier retirement: the year-after-release floor survived in
  the "Not sooner than" dates. Anthropic keeps retired models' weights (see related) but does not
  serve them through the API. For comparison, OpenAI’s deprecations page has
  said since about June 2026 that it gives generally available models "At least 6
  months" notice. Dates and notice periods were read from every archived
  version of the page, in order.
