title: 'Claude Startups expansion promises a free year of Team and "$1,000 in API
  credits as soon as you’re approved"; both offers are paused three days later'
date: 2026-10-06
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Posts on Twitter/X by @claudeai
quote: >-
  You'll also receive up to $7,000 in Claude products and credits to build
  with. That includes a free year of Claude Team for companies new to Team, plus
  $1,000 in API credits as soon as you’re approved.
summary: >-
  Announcing that the Claude Startups program was "expanding to more founders,"
  Anthropic said members could get "a year of Claude Team, API credits, special
  offers on the tools a startup runs on, and office hours with Anthropic’s
  Applied AI team," and that "Startups founded in the last five years or funded
  in the last two are eligible to apply." Three days later it paused the Team
  and API credit offers, saying it had "underestimated demand for the program."
concreteness: measurable
status: reversed
outcome:
  date: 2026-10-09
  text: >-
    @claudeai posted: "Unfortunately, we underestimated demand for the program,
    and we need to pause the Claude Team and $1,000 API credit offers." The
    program page now says the cohort is full and applications are closed: "Our
    current cohort is now full, so we weren’t able to move forward with
    applications that were still in review, and we’ve emailed everyone
    affected." The member benefits it lists no longer include the Team year or
    the $1,000 in credits. Forbes reported that applicants who had been approved
    but had not yet claimed the benefits would be asked to re-verify and could
    be turned down.
