response: >-
  The pause post quoted one by Sarah Wolf, Anthropic's head of startup
  marketing: "We didn’t anticipate the demand for the Claude Startups program.
  In the first 48 hours of the program, we received 21x the number of
  applications compared to the last 5 months it’s been live." She added that
  Anthropic had let "way too many people in this time." Forbes reported her
  saying the acceptance criteria had not been properly tuned.
note: >-
  A small offer, withdrawn quickly and openly, with the reason given. It is
  recorded because it was a concrete, dated promise to applicants ("as soon as
  you’re approved"), and the same standard applies to OpenAI's plan promises.
  What became of applicants who were approved but had not claimed the credits
  rests on Forbes's reporting; Anthropic's page says only that applications
  still in review did not go forward.
