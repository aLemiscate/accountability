updates:
  - date: 2023-08-08
    text: >-
      Five months later Amodei described how the principle had been applied: "we
      didn't cause the big acceleration that happened late last year and at the
      beginning of this year. We weren't the ones who did that." He added: "And
      then once it had happened, once the ecosystem had changed, then we did a
      lot of things to stay on the frontier."
