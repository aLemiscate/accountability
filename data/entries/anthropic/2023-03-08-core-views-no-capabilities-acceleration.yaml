  - date: 2026-09-09
    text: >-
      Jacob Coxon, a pretraining researcher who had worked at OpenAI and then
      Anthropic, resigned and posted: "Neither company is acting responsibly.
      They are racing straight to self-improving superintelligence and gambling
      with our lives." He wrote that at Anthropic "the stakes are
      well-understood, but they are locked in a race to get there first."
      Anthropic's alignment stress-testing lead Evan Hubinger replied: "I
      believe Anthropic is trying its best, but we do not yet have a plan to
      solve alignment for superintelligence and are not clearly on track to."
