note: >-
  Withholding publications is one way to avoid accelerating. Shipping the best
  model on the market is another question, and this principle never addressed
  it. A year before the essay, in March 2022, Dario Amodei had stated a narrower
  version on the Future of Life Institute podcast: "I think we shouldn't be
  racing ahead or trying to build models that are way bigger than other orgs are
  building them," while still working "on top of models that are reasonably
  close to state of the art." One action did match the principle. In the summer
  of 2022 Anthropic finished training the first Claude, and Amodei, TIME
  reported, "ultimately decided not to" release it, "opting instead to continue
  internal safety testing"; ChatGPT launched about three months later. Amodei's
  account in 2026: "we chose not to release this because we were worried that it
  would kick off an arms race and not give us enough time to build these systems
  safely." (Quoted from the audio of People by WTF, about 29:35.)
