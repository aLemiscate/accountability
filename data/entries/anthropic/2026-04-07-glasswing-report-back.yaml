title: 'Anthropic promises to "report back what we learn" from giving Mythos to
  software defenders'
date: 2026-04-07
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Project Glasswing launch
quote: >-
  We’re committing up to $100M in Mythos Preview usage credits for our partners
  and over 40 other organizations that maintain critical software, including
  open-source projects. Anthropic will report back what we learn.
summary: >-
  Launching Claude Mythos Preview only to a limited group of companies and
  maintainers of critical software, Anthropic committed up to $100 million in
  usage credits and $4 million in donations to open-source security groups, and
  said it would share what it learned so "the whole industry can benefit."
concreteness: directional
status: kept
breaks_if: >-
  No public account of the results, or a report that omits bad news such as
  false positives or unpatched findings.
patterns: []
