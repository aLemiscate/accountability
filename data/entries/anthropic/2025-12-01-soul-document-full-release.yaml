      - title: Amanda Askell on X ("Claude's constitution is out!")
        publisher: X
        url: https://x.com/AmandaAskell/status/2014010171081581048
        date: 2026-01-21
        type: primary
note: >-
  Kept, seven weeks later. The document became public because a user drew it
  out of the model; the commitment to publish it in full came after that, and
  Anthropic met it.
