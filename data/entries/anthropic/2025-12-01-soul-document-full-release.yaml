title: 'Askell confirms Claude''s extracted "soul document" is real: "we intend to
  release the full version"'
date: 2025-12-01
org: anthropic
type: said
kind: commitment
who: [amanda-askell, anthropic]
venue: Post on X
quote: >-
  I just want to confirm that this is based on a real document and we did train
  Claude on it, including in SL. It's something I've been working on for a
  while, but it's still being iterated on and we intend to release the full
  version and more details soon.
summary: >-
  On Nov. 28, 2025, a user published on LessWrong a long document he had drawn
  out of Claude Opus 4.5, which first surfaced in the model's output as a
  "soul_overview" section. Anthropic researcher Amanda Askell, later the lead
  author of Claude's constitution, confirmed that it was based on a real
  document used in training, including supervised learning, and said Anthropic
  would publish the full version.
concreteness: directional
status: kept
breaks_if: >-
  No full version published, or a published version that leaves out parts of
  what Claude is trained on.
sources:
  - title: Amanda Askell on X
    publisher: X
    url: https://x.com/AmandaAskell/status/1995610567923695633
    date: 2025-12-01
    type: primary
  - title: Claude 4.5 Opus' Soul Document
    publisher: Richard Weiss, LessWrong
    url: https://www.lesswrong.com/posts/vpNG99GhbBoLov9og/claude-4-5-opus-soul-document
    date: 2025-11-28
    type: analysis
updates:
  - date: 2026-01-21
    text: >-
      Anthropic published Claude's constitution "in full" under a CC0 public
      domain license, describing it as "a crucial part of our model training
      process" and "the final authority on how we want Claude to be and to
      behave." Askell wrote that it was "a work in progress that will no doubt
      change."
    sources:
      - title: Claude's new constitution
        publisher: Anthropic
        url: https://www.anthropic.com/news/claude-new-constitution
        date: 2026-01-22
