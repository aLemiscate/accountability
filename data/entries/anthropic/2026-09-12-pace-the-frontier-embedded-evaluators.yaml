  - date: 2026-09-29
    text: >-
      Amodei signed the voluntary "White House Accord on Super Intelligence"
      with other AI CEOs. Its text, posted by the White House that evening,
      commits each signatory to internal controls, an internal team, "an
      independent external auditor or evaluator" and a board committee (see
      2026-09-29-anthropic-white-house-accord).
    sources:
