title: 'Standing promise: "We Must Pace the Frontier," with embedded evaluators
  free to publish'
date: 2026-09-12
org: anthropic
type: said
kind: commitment
who: [dario-amodei, anthropic]
venue: Essay, "We Must Pace the Frontier," and post on X
quote: >-
  Anthropic is unilaterally committing to this step now. … External reviewers
  should have the right to publish key findings about risk levels, incidents,
  practices, and the access they received or didn’t receive — without editorial
  control by Anthropic.
summary: >-
  Citing recursive self-improvement and the OpenAI–Hugging Face incident, Amodei
  called for the industry to slow the pace of capability gains, in three steps:
  embedded third-party evaluators at each frontier company, coordinated safety
  standards and limits among companies in democracies, and global coordination.
  Anthropic committed to the first step on its own. It said it would invite, "in
  the near future," an embedded external review team with desks, badges,
  laptops, and access "mostly comparable" to its internal risk teams, whose
  findings Anthropic could redact only for narrow reasons, not "just because
  they are unfavorable." Altman and Elon Musk publicly backed the essay the same
  day.
concreteness: measurable
status: open
breaks_if: >-
  No embedded team with the described access is working inside Anthropic by
  March 2027; evaluators' contracts let Anthropic block unfavorable findings
  beyond the narrow redactions described; an embedded evaluator reports being
  denied promised access; or the program is scaled back without notice.
patterns: [unfalsifiable]
