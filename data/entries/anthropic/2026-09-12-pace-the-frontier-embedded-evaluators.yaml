updates:
  - date: 2026-09-18
    text: >-
      Anthropic named its first embedded-evaluation partner: Accenture, with the
      work led by its AI unit Faculty. Anthropic said it will fund Accenture's
      work directly, that each company expects to invest at least $1 billion in
      this area over five years, that the partnership is non-exclusive, and that
      it is "in dialogue with METR and other nonprofit evaluators." It added
      that "many of the details about how it will operate are still being worked
      out."
    sources:
      - title: Partnering with Accenture on embedded evaluation
        publisher: Anthropic
        url: https://www.anthropic.com/news/accenture-embedded-evaluation
        date: 2026-09-18
        type: primary
        snapshot: snapshots/2026-09-29-anthropic.com-5ec4e61a
  - date: 2026-09-29
    text: >-
      Amodei signed the voluntary "White House Accord on Superintelligence" with
      other AI CEOs. Its text had not been published. Meta's Mark Zuckerberg
      said it commits signatories to "robust" internal controls and "multiple
      layers of auditing."
    sources:
      - title: AI firms sign ‘morally binding’ self-policing pledge in White House
          meeting
        publisher: The Hill
        url: https://thehill.com/homenews/administration/6118906-tech-ceos-sign-white-house-ai-accord/
        date: 2026-09-29
        type: reporting
note: >-
  Seven months earlier, Anthropic dropped its pause pledge. Its chief science
  officer said then that unilateral commitments made little sense "if
  competitors are blazing ahead." This essay commits to a unilateral step. That
  is a change for the better, and the test is concrete. The essay sells embedded
  evaluators as "a second opinion free of commercial incentives," yet the first
  partner is a commercial consultancy that deploys AI for clients and is paid by
  Anthropic.
