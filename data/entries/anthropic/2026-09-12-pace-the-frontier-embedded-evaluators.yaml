updates:
  - date: 2026-09-18
    text: >-
      Anthropic named its first embedded-evaluation partner: Accenture, with the
      work led by its AI unit Faculty. Anthropic said it will fund Accenture's
      work directly, that each company expects to invest at least $1 billion in
      this area over five years, that the partnership is non-exclusive, and that
      it is "in dialogue with METR and other nonprofit evaluators." It added
      that "many of the details about how it will operate are still being worked
      out."
    sources:
      - title: Partnering with Accenture on embedded evaluation
        publisher: Anthropic
        url: https://www.anthropic.com/news/accenture-embedded-evaluation
        date: 2026-09-18
        type: primary
        snapshot: snapshots/2026-09-29-anthropic.com-5ec4e61a
  - date: 2026-09-22
    text: >-
      Ten days after the essay, Anthropic released Claude Opus 5.5, its first
      model since the pledge. TechCrunch reported that, according to Anthropic,
      it set a new state of the art in coding and knowledge-work performance and
      beat the larger Fable model on many benchmarks, at a lower price; its
      safety training was "broadly similar to its predecessors," with
      pre-release evaluation by METR. Anthropic alignment researcher Sam Bowman
      wrote: "We think Opus 5.5 is sufficiently safer than it's predecessors
      that releasing it, more likely than not, reduces risks related to
      misalignment."
