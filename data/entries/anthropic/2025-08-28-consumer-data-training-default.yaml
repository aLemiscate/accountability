response: >-
  Anthropic said the data would improve model safety and capabilities such as
  coding, and that users stay in control and can change the setting at any time.
note: >-
  Privacy had been a selling point, and the flip was framed as user choice.
  Whether a pre-set toggle counts as a choice is the question. The opt-out also
  has limits: the privacy policy says that even for users who opt out, Anthropic
  will use conversations "flagged for safety review" and material users report
  to it for model improvement.
  In July 2023, asked on CNBC how Anthropic keeps personal data out of Claude,
  Daniela Amodei described the earlier rule: "unless we're given permission to
  … train on your data or if you've violated our AUP, those are the only times
  when we would have the sort of opportunity or the right to use training
  data." (Quoted from the audio.)
