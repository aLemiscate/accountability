title: Claude consumer chats become training data, with 5-year retention, unless
  users opt out
date: 2025-08-28
org: anthropic
type: did
kind: revision
who: [anthropic]
summary: >-
  Anthropic changed its consumer terms so that Free, Pro and Max chats and
  coding sessions would be used to train models when the setting is on, and kept
  for five years. Existing users had to choose by October 8, 2025 to keep using
  Claude. TechCrunch reported that the training toggle was switched on by
  default in the update prompt. Commercial, government and education plans were
  excluded.
revision:
  before: >-
    Consumer chats weren't used for model training by default, and were deleted
    from the back end within 30 days.
  after: >-
    Chats are used for training when the setting is on, with 5-year retention;
    30 days applies only if the user declines.
patterns: [consent-by-default]
sources:
  - title: Updates to Consumer Terms and Privacy Policy
    publisher: Anthropic
    url: https://www.anthropic.com/news/updates-to-our-consumer-terms
    date: 2025-08-28
    type: primary
    snapshot: snapshots/2026-09-29-anthropic.com-0b955373
  - title: 'Anthropic users face a new choice: opt out or share your data for AI
      training'
    publisher: TechCrunch
    url: https://techcrunch.com/2025/08/28/anthropic-users-face-a-new-choice-opt-out-or-share-your-data-for-ai-training/
    date: 2025-08-28
    type: reporting
response: >-
  Anthropic said the data would improve model safety and capabilities such as
  coding, and that users stay in control and can change the setting at any time.
note: >-
  Privacy had been a selling point, and the flip was framed as user choice.
  Whether a pre-set toggle counts as a choice is the question.
