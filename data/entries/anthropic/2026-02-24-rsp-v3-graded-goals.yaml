related: [2026-05-26-rsp-v3-3-bio-threshold, 2026-08-14-risk-report-classifier-gap]
note: >-
  The company sets the goals and grades them. The check is whether the grades
  are ever failing ones. So far the grading has been public, including some
  unflattering results, and the goals have moved in public too.
