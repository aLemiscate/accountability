title: RSP v2.2 takes sophisticated insiders out of the ASL-3 security standard,
  eight days before ASL-3 is switched on
date: 2025-05-14
org: anthropic
type: did
kind: revision
who: [anthropic]
quote: >-
  Version 2.2 implements a minor revision, amending a footnote to exclude both
  sophisticated insiders and state-compromised insiders from the scope of the
  ASL-3 Security Standard.
summary: >-
  Anthropic described the change as minor. It narrowed who the ASL-3 security
  standard has to defend against. Eight days later, on May 22, 2025, Anthropic
  activated ASL-3 protections for Claude Opus 4. Its announcement noted that
  "sophisticated insider risk" was out of the standard's scope.
revision:
  before: >-
    Only "highly sophisticated state-compromised insiders" were explicitly
    excluded from the scope of the ASL-3 Security Standard.
  after: >-
    Both sophisticated insiders and state-compromised insiders are excluded.
patterns: [unfalsifiable]
related: [2025-05-22-asl-3-protections-activated]
sources:
  - title: Anthropic's Responsible Scaling Policy (version history)
    publisher: Anthropic
    url: https://www.anthropic.com/responsible-scaling-policy
    type: primary
    snapshot: snapshots/2026-09-29-anthropic.com-afe1e125
  - title: Activating AI Safety Level 3 protections
    publisher: Anthropic
    url: https://www.anthropic.com/news/activating-asl3-protections
    date: 2025-05-22
    type: primary
    snapshot: snapshots/2026-09-29-anthropic.com-7512ddb5
note: >-
  The change was logged, not hidden. But lowering the bar just before a standard
  first has to be met is the shape to watch for: the test was adjusted to fit
  the moment it mattered.
