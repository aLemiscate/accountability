title: 'Standing promise: keep the weights of every released Claude model "for,
  at minimum, the lifetime of Anthropic"'
date: 2025-11-04
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Research post, "Commitments on model deprecation and preservation"
quote: >-
  we are committing to preserving the weights of all publicly released models,
  and all models that are deployed for significant internal use moving forward
  for, at minimum, the lifetime of Anthropic as a company.
summary: >-
  Citing safety risks such as shutdown-avoidant behavior in testing, costs to
  users attached to particular models, and the possibility that models have
  morally relevant preferences, Anthropic committed to keeping retired models'
  weights. When a model is deprecated, it will also interview the model and
  preserve a post-deployment report. It said it does "not commit to taking
  action on the basis of such preferences."
concreteness: conditional
status: open
breaks_if: >-
  Anthropic deletes the weights of a publicly released model, or retires a
  model without the interview and report.
patterns: [unfalsifiable]
related: [2025-11-24-sabotage-risk-reports-commitment]
sources:
  - title: Commitments on model deprecation and preservation
    publisher: Anthropic
    url: https://www.anthropic.com/research/deprecation-commitments
    date: 2025-11-04
    type: primary
    snapshot: snapshots/2026-09-30-anthropic.com-410a986c
updates:
  - date: 2026-02-25
    text: >-
      Claude Opus 3, retired on January 5, 2026, was the first model to go
      through the process. Anthropic kept it "available post-retirement on
      claude.ai to all paid users" and "by request on the API," and said: "We
      intend to grant access liberally." Acting on what Opus 3 said in its
      retirement interview, it also gave the model a weekly newsletter for at
      least three months. Anthropic added: "At present, we are not committing
      to similar actions for every model in the future."
    sources:
      - title: An update on our model deprecation commitments for Claude Opus 3
        publisher: Anthropic
        url: https://www.anthropic.com/research/deprecation-updates-opus-3
        date: 2026-02-25
        type: primary
note: >-
  Only Anthropic can check the weights and interviews: they are kept, not
  published. The continued access to Opus 3 can be checked from outside. It is in the record for completeness, as a promise about how the
  company treats its own models.
