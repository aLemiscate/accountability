response: >-
  Anthropic said the safeguards keep foreign adversaries from using its most
  capable models to erode the US lead in chips and AI software, and that hidden
  safeguards "can be targeted more narrowly, allowing us to ship quickly with
  very few false positives." Visible ones, it said, would mean more harmless
  requests flagged while it improves its classifiers.
note: >-
  This was disclosed, in the system card, which is more than a silent change.
  But the launch post described only the visible fallback, and the design meant
  a person whose request was flagged could not know their answer had been
  weakened. Using Claude to build competing models was already against
  Anthropic's terms; the question was whether to tell people when it acted.
