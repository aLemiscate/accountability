title: Fable 5 ships with hidden safeguards that weaken answers on frontier AI
  development without telling the user; reversed after two days
date: 2026-06-09
org: anthropic
type: did
kind: action
who: [anthropic]
quote: >-
  Unlike our interventions for cybersecurity, biology and chemistry, and
  distillation attempts, these safeguards will not be visible to the user. Fable
  5 will not fall back to a different model. Instead, the safeguards will limit
  effectiveness through methods such as prompt modification, steering vectors,
  or parameter-efficient fine-tuning (PEFT).
summary: >-
  Anthropic's launch thread for Claude Fable 5, its first Mythos-class model for
  general use, said that "queries on a narrow range of topics will instead
  receive a response from our next-most-capable model, Opus 4.8." Its 319-page
  system card described a further category: requests that looked like frontier
  AI development, such as building the infrastructure used to train large
  models, would get deliberately weakened answers, with nothing shown to the
  user. Researchers found the passage within hours. "Degrading performance on ML
  research *without telling the user* is shockingly hostile and a terrible
  look," wrote Dean Ball, a former White House AI adviser. On June 10 Anthropic
  told Wired: "We made the wrong trade-off and we apologize for not getting the
  balance right." The next day it said flagged requests would visibly fall back
  to Opus 4.8 "every time it happens." Claude's own constitution asks it to help
  as well as it can or make clear where it is not, "rather than deceptively
  sandbagging its response (i.e., intentionally providing a lower-quality
  response while implying that this is the best it can do)."
patterns: [sorry-after-caught]
