title: 'Anthropic: "we’ll be releasing Claude 3.5 Haiku and Claude 3.5 Opus later
  this year"; 3.5 Opus never shipped'
date: 2024-06-20
org: anthropic
type: said
kind: commitment
who: [anthropic, dario-amodei]
venue: Claude 3.5 Sonnet launch post
quote: >-
  To complete the Claude 3.5 model family, we’ll be releasing Claude 3.5 Haiku
  and Claude 3.5 Opus later this year.
summary: >-
  Launching Claude 3.5 Sonnet, Anthropic promised the rest of the 3.5 family,
  including a new top model, Claude 3.5 Opus, by the end of 2024. Claude 3.5
  Haiku shipped in November. Anthropic's model documentation still listed 3.5
  Opus as coming "Later this year" on Oct. 8; by Oct. 22, the day Anthropic
  launched an upgraded 3.5 Sonnet, the page no longer mentioned it, as Simon
  Willison noted that day. There was no announcement. Asked in November when
  it was coming, Dario Amodei said: "Not giving you an exact date, but as far
  as we know, the plan is still to have a Claude 3.5 Opus." No Claude 3.5 Opus
  was released; the next Opus model was Claude Opus 4, in May 2025.
concreteness: measurable
status: broken
patterns: [coming-weeks]
related: [2024-10-22-claude-3-5-haiku-same-cost]
