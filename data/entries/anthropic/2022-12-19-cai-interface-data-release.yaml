note: >-
  A small promise with no date, graded broken because almost four years have
  passed with no release and no word that the plan was dropped. The red-teaming
  release it pointed to did happen, and Anthropic has published 13 other
  datasets since. If the data was released somewhere not checked here, this
  entry is wrong and will be corrected.
