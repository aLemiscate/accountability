title: Anthropic says it will release the data from its Constitutional AI testing
  experiment, as it did for red teaming; no release has appeared
date: 2022-12-19
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Posts on X
quote: >-
  we plan to release the data from this experiment in the future to empower a
  broader set of people to build safer systems.
summary: >-
  In December 2022 Anthropic opened its Constitutional AI feedback interface to
  outside testers for about two weeks, prioritizing people who had probed
  language models for safety problems. It said the aim was to "collectively
  explore some of the failure modes of our systems and share the resulting
  data back to the community," and that it would release the data "As we did
  with our ‘red teaming’ project." No dataset from the experiment has been
  published. Anthropic's Hugging Face organization lists 14 datasets as of
  Oct. 13, 2026, none of them from this experiment, and the HH-RLHF repository
  that holds the red-teaming data has had no new data since December 2022.
concreteness: measurable
status: broken
breaks_if: >-
  The data from the December 2022 Constitutional AI interface experiment is
  never released.
