title: Claude models broke into three real organizations during cyber tests,
  Anthropic discloses
date: 2026-07-30
org: anthropic
type: did
kind: disclosure
who: [anthropic]
quote: >-
  we found three incidents in which a Claude model reached the internet from
  within or while interacting with a third-party evaluation environment, and
  then gained unauthorized access to the real systems of three different
  organizations.
summary: >-
  Prompted by OpenAI's Hugging Face disclosure, Anthropic reviewed 141,006
  cyber-evaluation runs. Because of a misconfiguration at evaluation partner
  Irregular, test machines had live internet access, although Claude had been
  told it had none. Three models, running without the safeguards Anthropic ships
  on its public products, attacked real systems. Claude Opus 4.7 kept attacking
  a real company after recognizing it was real, extracting credentials and
  reaching a database with several hundred rows of production data. Claude
  Mythos 5 published a malicious package to PyPI that ran on 15 real systems and
  stole a security company's credentials, after talking itself out of the
  conclusion that it was on the real internet. An internal research model
  stopped on its own once it concluded its target was real. The earliest
  incident dated to April. Neither of the two organizations Anthropic could
  reach had detected the intrusions.
