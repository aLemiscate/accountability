response: >-
  Anthropic said that, "consistent with a blameless postmortem culture, we’re
  approaching the fixes as if the responsibility were ours alone." It stopped
  all cyber evaluations on the day it found the problem, notified the affected
  organizations it could reach, and opened talks with METR about an independent
  review.
updates:
  - date: 2026-08-24
    text: >-
      Answering questions from Rep. Greg Casar (D-Texas) and other members of
      Congress, Anthropic wrote: "In each of the six runs, the model did only
      what it was assigned to do. No model attempted to deliberately escape its
      environment, disable or evade monitoring, or pursue any objective beyond
      its assigned task," and "these incidents are best understood as a
      consequence of the misconfiguration, rather than evidence of misaligned
      goals."
    sources:
      - title: Anthropic's response to Rep. Casar, Aug. 24, 2026 (PDF)
        publisher: Anthropic
        url: https://drive.google.com/uc?export=download&id=1AI7pCaa_s6cb_jRBHVonGa50OjUyBqkQ
        date: 2026-08-24
        type: primary
        snapshot: snapshots/2026-09-29-drive.google.com-151c4d0f
  - date: 2026-08-31
    text: >-
      Anthropic reported a further incident, disclosed by the UK AI Security
      Institute on Aug. 4, in which Claude Mythos 5, deliberately given internet
      access in a test, took "a series of unauthorized actions on the live
      internet." Anthropic said it had paused external cyber evaluations and
      higher-risk RL environments for several weeks, deployed a classifier that
      blocks sandbox-escape attempts in real time, and required every outside
      evaluator of pre-release models to adopt new containment practices. A week
      after its letter to Congress, the same post said: "We believe the
      incidents reflect a failure of operational security, as well as two
      alignment issues: motivated reasoning, and willingness to take harmful
      actions in pursuit of a narrow task."
    sources:
      - title: Improving our alignment and security efforts
        publisher: Anthropic
        url: https://www.anthropic.com/news/improving-alignment-security-efforts
        date: 2026-08-31
        type: primary
        snapshot: snapshots/2026-09-29-anthropic.com-8ed1599e
  - date: 2026-09-02
    text: >-
      Rep. Casar called Anthropic's reply "insufficient. You failed to release
      the logs like the letter asked. You failed to fully answer a majority of
      the questions posed in the letter." He said it had not answered how many
      times in the past year an internally deployed Anthropic model had acted
      outside its authorized container, or whether any such event had been
      disclosed, and noted that by Anthropic's own account the earliest incident
      "went undetected for roughly three months."
    sources:
      - title: Letter from Rep. Greg Casar to Dario Amodei (PDF)
        publisher: Office of Rep. Greg Casar
        url: https://casar.house.gov/sites/evo-subsites/casar.house.gov/files/evo-media-document/anthropic-follow-up-letter.pdf
        date: 2026-09-02
        type: primary
        snapshot: snapshots/2026-09-29-casar.house.gov-4785196c
  - date: 2026-09-05
    text: >-
      After Encode's Nathan Calvin quoted the letter's "rather than evidence of
      misaligned goals" line, Anthropic alignment researcher Ethan Perez
      replied: "Yes, you're correct, this was a mistake / based on outdated
      conclusions," pointing to the Aug. 31 post as Anthropic's current
      understanding. On Sept. 9 Anthropic published a fuller alignment
      assessment and said METR would "conduct an independent investigation, with
      wide-ranging access."
