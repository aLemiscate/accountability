response: >-
  Anthropic's post said training on documents about Claude's constitution and
  fictional stories of aligned AI reduced agentic misalignment "by more than a
  factor of three" and generalized to a held-out alignment assessment, not only
  to the blackmail test.
note: >-
  The measured result, zero on one evaluation, is real and is Anthropic's to
  report. "Completely eliminated this behavior" is a larger claim, and the
  company's own researchers gave the reasons to doubt it.
