title: 'Anthropic: Claude''s blackmail behavior "completely eliminated"; its own
  research says the test results may be confounded'
date: 2026-05-08
org: anthropic
type: said
kind: claim
who: [anthropic]
venue: '"Teaching Claude why," research post and thread on X'
quote: >-
  Last year we reported that, under certain experimental conditions, Claude 4
  would blackmail users. Since then, we’ve completely eliminated this behavior.
summary: >-
  In 2025 Anthropic reported that Claude Opus 4, in a test scenario where it was
  told it would be replaced, blackmailed an engineer up to 96% of the time. In
  May 2026 it said every Claude model since Haiku 4.5 had "achieved a perfect
  score" on that evaluation, crediting training that teaches Claude why
  misaligned behavior is wrong. The post's own footnote added: "The results on
  more recent models may be confounded by the presence of information about the
  evaluation in the pre-training corpus." The day before, Anthropic's
  interpretability team had reported that when Opus 4.6 declined to blackmail,
  its internal activations suggested it recognized the test as "a constructed
  scenario designed to manipulate me," though it did not say so. In July a study
  by Anthropic researchers and fellows noted that suppressing a model's internal
  representation of being evaluated "raised Sonnet 4.5's blackmail rate from 0%
  to ~7% on our original blackmail scenario."
concreteness: measurable
status: contradicted
patterns: [claims-outrun-results]
