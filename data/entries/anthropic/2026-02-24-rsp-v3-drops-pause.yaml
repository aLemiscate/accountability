  - date: 2026-06-04
    text: >-
      An Anthropic Institute post on AI building itself said: "We believe it
      would be good for the world to have the option to slow or temporarily
      pause frontier AI development to enable societal structures and alignment
      research to keep up with the advance of the technology." It added that if
      systems to verify a coordinated slowdown existed, "we expect that we would
      slow down or temporarily pause, if other developers at or near the
      frontier also did so in a verifiable manner." That evening on CNN, Jack
      Clark said: "when I look down at the car we're driving, all I have is a
      gas pedal. I don't have a brake pedal."
