response: >-
  Anthropic said it chose to "acknowledge these challenges transparently and
  restructure the RSP before we reach these higher levels," instead of weakening
  commitments at the moment they would bind.
updates:
  - date: 2026-02-25
    text: >-
      Anthropic alignment researcher Sam Bowman endorsed an outside argument
      that voluntary slowdown commitments were "no longer plausible" as steps
      toward a multilateral agreement, and wrote: "The Anthropic RSP changes are
      an attempt to work out what kinds of firm commitments have the most
      leverage in an environment that's less promising than we'd expected for
      policy and coordination."
    sources:
      - title: Sam Bowman on X
        publisher: X
        url: https://x.com/sleepinyourhat/status/2026797148566859836
        date: 2026-02-25
        type: primary
        snapshot: snapshots/2026-09-30-x.com-2fe3fe44
  - date: 2026-07-08
    text: >-
      Four point releases followed (v3.1 on Apr 2, v3.2 on Apr 29, v3.3 on May
      26, v3.4 on Jul 8, 2026). v3.1 added that Anthropic remains "free to take
      measures such as pausing" when it deems them appropriate. v3.3 rewrote the
      novel-bioweapons threshold. The page watcher tracks further changes.
    sources:
      - title: Anthropic's Responsible Scaling Policy
        publisher: Anthropic
        url: https://www.anthropic.com/responsible-scaling-policy
        type: primary
        snapshot: snapshots/2026-09-29-anthropic.com-afe1e125
        archive: https://web.archive.org/web/20260929201416/https://www.anthropic.com/responsible-scaling-policy
  - date: 2026-09-12
    text: >-
      Seven months after this rewrite, Dario Amodei called for the industry to
      slow down and committed Anthropic, unilaterally, to embedded third-party
      evaluators. The essay framed "pacing" as not halting model training.
    sources:
      - title: We Must Pace the Frontier
