title: 'RSP v3 drops the pause pledge: "it wouldn''t actually help anyone for us
  to stop training"'
date: 2026-02-24
org: anthropic
type: did
kind: revision
who: [anthropic, jared-kaplan]
quote: >-
  We felt that it wouldn't actually help anyone for us to stop training AI models
summary: >-
  Anthropic rewrote its Responsible Scaling Policy. It removed the hard
  commitment not to train or release models without adequate safeguards
  guaranteed in advance, and replaced it with a Frontier Safety Roadmap and Risk
  Reports. Kaplan told TIME that it didn't make sense "to make unilateral
  commitments … if competitors are blazing ahead." Anthropic cited a "zone of
  ambiguity" around thresholds, a policy climate that had "shifted toward
  prioritizing AI competitiveness," and higher-level safeguards that "might
  prove outright impossible to implement without collective action."
revision:
  before: >-
    If-then commitments: pause training or withhold deployment when capabilities
    pass a threshold and the matching safeguards aren't in place.
  after: >-
    "Rather than being hard commitments, these are public goals that we will
    openly grade our progress towards."
contradicts: [2023-09-19-rsp-pause-commitment]
patterns: [race-clause, unfalsifiable]
