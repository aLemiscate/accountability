note: >-
  This is the race clause, stated by the company that built its identity on
  refusing it. The reasons given may be sincere. The result is still a pause
  commitment turned into self-graded goals. In November 2024 Amodei had argued
  for regulation on exactly this ground: "I don't think you can trust these
  companies to adhere to these voluntary plans on their own."
