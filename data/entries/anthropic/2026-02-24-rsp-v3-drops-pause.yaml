note: >-
  This is the race clause, stated by the company that built its identity on
  refusing it. The reasons given may be sincere. The result is still a pause
  commitment turned into self-graded goals. In November 2024 Amodei had argued
  for regulation on exactly this ground: "I don't think you can trust these
  companies to adhere to these voluntary plans on their own." In March 2025
  Kaplan described what the hard lines were for. The RSP, he told Azeem Azhar,
  meant "we were more free to move quickly, because the idea would be we have
  this framework in place where we can move as fast as we can … and we would be
  sort of bound by, to sort of not cross certain lines until we were ready."
  (Quoted from the audio of the Exponential View episode, about 27:53.) In July
  2025 Amodei gave both halves of the reasoning. If models got "a few years
  ahead" with only current alignment techniques, "I would definitely be
  advocating for us to slow down a lot." But: "Even if one company was willing
  to slow down the technology … that doesn't stop all the other companies."
  (Quoted from the audio of the Big Technology Podcast, about 1:04:19.)
