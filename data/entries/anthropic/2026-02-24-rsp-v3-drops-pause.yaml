  - date: 2026-05-28
    text: >-
      Asked about "Anthropic's decision to drop its responsible scaling policy,"
      Jack Clark said: "We didn't drop our responsible scaling policy, we
      changed it." Asked about the promise not to train a model if safety wasn't
      assured in advance, he said: "Well we still make safety cases in the
      responsible scaling policy so I'm not sure that's quite accurate," adding
      that "we've tweaked the RSP." He argued that if a company changing its own
      self-regulation is "such a big deal," that "is like a giant flashing sign
      that that should be a regulated thing." (Quoted from the audio of The Slow
      Newscast, about 30:35 to 32:47.)
    sources:
      - title: 'Anthropic co-founder Jack Clark: What does the future of AI look like?'
        publisher: The Slow Newscast
