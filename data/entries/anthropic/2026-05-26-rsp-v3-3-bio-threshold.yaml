title: RSP v3.3 redefines the novel-bioweapons threshold, from "significantly
  help" to "functionally substitute"
date: 2026-05-26
org: anthropic
type: did
kind: revision
who: [anthropic]
quote: >-
  This version 3.3 update does the following: 1) revises our threshold for novel
  chemical/biological weapons production to better track the threat model of
  concern
summary: >-
  Three months after RSP v3, Anthropic rewrote the capability threshold for
  novel chemical and biological weapons (which its Risk Reports call CB-2). The
  old test asked whether a model could "significantly help" moderately
  resourced, expert-backed teams. The new one asks whether it can "functionally
  substitute for the scarce human expertise" that is the main barrier, doing
  work that would otherwise require recruiting one of a small number of
  world-leading specialists. The same revision lowered the damage bar from harm
  "far beyond" COVID-19 to harm "comparable to or worse than" it. The August
  2026 Risk Report, the first under the new wording, found that Anthropic's
  models "may provide significant uplift to relevant threat actors, but do not
  yet meet our CB-2 threshold."
revision:
  before: >-
    "AI systems with the ability to significantly help threat actors (for
    example, moderately resourced expert-backed teams) create/obtain and deploy
    chemical and/or biological weapons with potential for catastrophic damages
    far beyond those of past catastrophes such as COVID-19."
  after: >-
    "AI systems that can functionally substitute for the scarce human expertise
    that is currently the primary barrier to novel development of chemical and
    biological weapons with potential for catastrophic harm."
patterns: [unfalsifiable]
related: [2026-02-24-rsp-v3-graded-goals, 2026-02-24-rsp-v3-drops-pause]
