    date: 2026-08-14
    type: primary
    snapshot: snapshots/2026-09-29-www-cdn.anthropic.com-026a83da
note: >-
  The change was disclosed, with a redline. The problem is the effect. Under the
  old wording, "may provide significant uplift" to expert-backed teams reads
  close to the line. Under the new wording, the same finding clears it
  comfortably. When the company that grades the test also rewrites it, the
  outcome is harder to read.
