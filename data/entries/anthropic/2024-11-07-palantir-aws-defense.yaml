title: Claude goes to U.S. defense and intelligence agencies through Palantir
date: 2024-11-07
org: anthropic
type: did
kind: action
who: [ anthropic ]
summary: >-
  Anthropic, Palantir and AWS partnered to give U.S. intelligence and defense
  agencies access to Claude 3 and 3.5 through Palantir's AI Platform, including
  Palantir's Impact Level 6 environment, which handles data up to the "secret"
  classification. Anthropic's policy still barred uses such as disinformation,
  weapons design, censorship, domestic surveillance and malicious cyber
  operations, while allowing some government agencies to use the models. The
  groundwork was laid in June 2024, when Anthropic wrote "contractual
  exceptions to our general Usage Policy" for "carefully selected government
  agencies," allowing "legally authorized foreign intelligence analysis" and
  "providing warning in advance of potential military activities."
patterns: [ principles-with-a-price ]
