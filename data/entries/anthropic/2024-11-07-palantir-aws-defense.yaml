response: >-
  Anthropic says supporting democratic governments' national security fits its
  mission, and that its usage restrictions still apply.
note: >-
  This isn't a broken promise by itself, because Anthropic never promised to
  stay out of defense. It's here because of what came next: the same company's
  limits were tested by the Pentagon in 2026.
