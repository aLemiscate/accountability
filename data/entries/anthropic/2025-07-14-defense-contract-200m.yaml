title: Pentagon awards Anthropic up to $200M for "agentic AI workflows"
date: 2025-07-14
org: anthropic
type: did
kind: action
who: [anthropic]
quote: >-
  We're announcing a $200M ceiling contract with the U.S. Department of
  Defense.
summary: >-
  The Pentagon's Chief Digital and AI Office gave Anthropic, Google and xAI
  contracts with a $200M ceiling each, following a similar award to OpenAI a
  month earlier, to develop "agentic AI workflows across a variety of mission
  areas." Breaking Defense noted that the office has said it aims to apply AI
  both to back-office processes and to uniquely military functions. Anthropic
  said it would help "enhance U.S.
  national security and responsible AI deployment."
