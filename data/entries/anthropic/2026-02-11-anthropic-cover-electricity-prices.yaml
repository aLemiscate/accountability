updates:
  - date: 2026-05-06
    text: >-
      Anthropic agreed to use all of the compute at SpaceX's Colossus 1 data
      center in Memphis, more than 300 megawatts, and restated the pledge in the
      same post as a commitment "to cover any consumer electricity price
      increases caused by our data centers in the US." Colossus 1 is leased
      capacity, the category the February pledge left to "exploring further
      ways." According to the Southern Environmental Law Center, which
      represents the NAACP, the site ran on as many as 35 gas turbines without
      air permits after it opened in 2024; xAI removed them after a notice of
      intent to sue under the Clean Air Act and obtained permits for its
      remaining 15. Asked by the Bureau of Investigative Journalism about
      environmental checks and consultation with local groups, Anthropic pointed
      to a $1 million donation to a Memphis education nonprofit and to its
      public statements about talks with local policymakers, and did not address
      those questions.
