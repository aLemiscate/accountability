updates:
  - date: 2026-04-13
    text: >-
      Transformer reported that Anthropic had restricted its donation from being
      used to influence federal elections. The restriction was disclosed only
      after Transformer asked whether the gift complied with rules barring
      political contributions by government contractors, despite widespread
      coverage assuming the money would fund the group's super PACs.
    sources:
      - title: Anthropic’s donations can’t be used to influence elections — despite what
          everyone thought
        publisher: Transformer
        url: https://www.transformernews.ai/p/anthropic-super-pac-donations-public-first-leading-the-future-brad-carson
        date: 2026-04-13
        type: reporting
        archive: https://web.archive.org/web/20261001031330/https://www.transformernews.ai/p/anthropic-super-pac-donations-public-first-leading-the-future-brad-carson
        snapshot: snapshots/2026-10-01-transformernews.ai-d8fb1b7e
  - date: 2026-06-23
    text: >-
      In the New York primary where Leading the Future spent $8 million against
      Alex Bores, groups supporting him spent roughly $20 million, most of it
      from an Anthropic-backed organization, according to Gizmodo. Bores lost.
      Anthropic has said its own gifts are barred from being used to influence
      elections.
    sources:
      - title: AI Super PAC’s First Major Target Loses New York Congressional Primary
        publisher: Gizmodo
        url: https://gizmodo.com/ai-super-pacs-first-major-target-loses-new-york-congressional-primary-2000776808
        date: 2026-06-24
        type: reporting
        archive: https://web.archive.org/web/20261001031456/https://gizmodo.com/ai-super-pacs-first-major-target-loses-new-york-congressional-primary-2000776808
  - date: 2026-07-21
    text: >-
      Anthropic gave another $20 million, bringing its total to $40 million, and
      said both donations "cannot be used to influence the election of any
      candidate for federal, state, or local office."
    sources:
      - title: Donating another $20 million to Public First Action
        publisher: Anthropic
        url: https://www.anthropic.com/news/donation-public-first-action
        date: 2026-07-21
        type: primary
        snapshot: snapshots/2026-09-29-anthropic.com-9d9e4fbe
note: >-
  Recorded under the same standard as Brockman's giving. It isn't a broken
  promise, since Anthropic's spending matches its stated policy views. The
  reason it's here is that the early coverage, and the company's vague
  announcement, made the gift look like election money when it wasn't.
