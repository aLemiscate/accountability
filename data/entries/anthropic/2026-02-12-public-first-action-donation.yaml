    date: 2026-02-12
    type: primary
    snapshot: snapshots/2026-09-29-anthropic.com-f3105fa4
  - title: Anthropic gives $20 million to group pushing for AI regulations ahead of
      2026 elections
    publisher: CNBC
    url: https://www.cnbc.com/2026/02/12/anthropic-gives-20-million-to-group-pushing-for-ai-regulations-.html
