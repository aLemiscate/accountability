title: Anthropic gives $20M to Public First Action, a group backing AI safeguards
date: 2026-02-12
org: anthropic
type: did
kind: action
who: [anthropic]
quote: >-
  We don’t want to sit on the sidelines while these policies are developed.
summary: >-
  Anthropic donated $20 million to Public First Action, a bipartisan 501(c)(4)
  run by former lawmakers Brad Carson and Chris Stewart that supports candidates
  who back AI safeguards. The group has three affiliated super PACs. Coverage
  framed the gift as a counterweight to Leading the Future, the $125 million
  super PAC network backed by OpenAI president Greg Brockman and Andreessen
  Horowitz.
patterns: []
related: [2025-08-25-leading-the-future-super-pac]
sources:
