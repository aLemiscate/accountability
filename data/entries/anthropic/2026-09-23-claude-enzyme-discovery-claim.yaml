title: 'Anthropic: "Claude autonomously discovered a novel enzyme system"; a
  biologist who used Claude says his team had studied it for years'
date: 2026-09-23
org: anthropic
type: said
kind: claim
who: [anthropic]
venue: Anthropic Science post and technical report launching its life sciences lab
quote: >-
  Today, we’re sharing early results from one of our first research programs,
  in which Claude autonomously discovered a novel enzyme system that is
  associated with an array of DNA repeats, a pattern reminiscent of CRISPR.
summary: >-
  Announcing its new biology lab, Anthropic said Claude agents, given "only
  high-level direction," had searched gene databases and found reverse
  transcriptases in viruses that infect bacteria, each next to an array of RNA
  genes, which it named ARTs; its report said the AI had taken "the first
  steps of a biological discovery on its own." Mario Rodríguez Mestre, a
  computational biologist at the University of Copenhagen, told The New York
  Times that he had first found the enzymes in 2022, that his group had
  studied them for four years without yet publishing, and that over three
  years of using Claude for code and manuscripts he had shared drafts
  describing them, including an analysis of the same 2022 data set Anthropic
  cited. He is a co-inventor on a 2023 patent filing by ReNegade Therapeutics
  covering a number of reverse transcriptases, these among them. "They are the
  same systems we have been studying for years," he said, while adding that he
  could not be sure Anthropic relied on his work: "coincidences happen." Seth
  Shipman, a bioengineer at the Gladstone Institutes, said: "Many of us know
  about these systems."
concreteness: measurable
status: open
breaks_if: >-
  Published work or a patent filing is shown to describe the same system (the
  enzymes with their RNA arrays), or evidence shows the agents were steered by
  researchers' own conversations with Claude.
patterns: [claims-outrun-results]
related: [2026-09-08-navier-stokes-announcement, 2025-08-28-consumer-data-training-default]
sources:
  - title: Claude discovers a novel enzyme system with CRISPR-like repeats
    publisher: Anthropic
    url: https://www.anthropic.com/news/claude-discovers-novel-enzyme-system
    date: 2026-09-23
    type: primary
  - title: Did Anthropic's artificial intelligence really make a scientific
      discovery on its own? (The New York Times, via The Irish Times)
    publisher: The Irish Times
    url: https://www.irishtimes.com/world/2026/09/28/did-anthropics-artificial-intelligence-really-make-a-scientific-discovery-on-its-own/
    date: 2026-09-28
    type: reporting
response: >-
  Anthropic told the Times: "We are not aware of any previously published work
  describing the ART system we recently found. Claude was also not trained on
  any user transcripts, and our molecular biology team has no such access,
  either."
note: >-
  The counterpart to OpenAI's Navier-Stokes dispute, two weeks apart: both
  companies announced an AI-led discovery that researchers who used their
  products say overlapped with their own unpublished work, and both said
  their teams had no access to it. The difference is in what was disputed.
  No one has said OpenAI's proof is wrong; here the question is whether the
  system was new.
