note: >-
  The refund offer was real and the terms Anthropic cited did bar automated
  access outside its own tools. What changed was enforcement, at a day's
  notice, for people who had built their work on it. OpenAI's comparable
  change, restoring Codex's five-hour limit for Plus at a day's notice, is in
  the related OpenAI entry.
