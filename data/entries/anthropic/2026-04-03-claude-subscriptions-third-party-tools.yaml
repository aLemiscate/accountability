response: >-
  An Anthropic spokesperson told The Register: "Using Claude subscriptions with
  third-party tools isn't permitted under our Terms of Service, and they put an
  outsized strain on our systems. Capacity is something we manage thoughtfully,
  and we need to prioritize customers using our core products."
updates:
  - date: 2026-04-21
    text: >-
      Anthropic's pricing page briefly stopped listing Claude Code as part of
      the $20 Pro plan, and a support page was changed to mention only Max.
      Head of growth Amol Avasare said it was "a small test on ~2 percent of new
      prosumer signups" and that existing subscribers weren't affected, adding:
      "We've made small adjustments along the way (weekly caps, tighter limits
      at peak), but usage has changed a lot and our current plans weren't built
      for this." The page was restored.
