title: Anthropic cuts third-party tools like OpenClaw from Claude subscriptions
  with one day's notice
date: 2026-04-03
org: anthropic
type: did
kind: action
who: [anthropic, boris-cherny]
quote: >-
  Starting tomorrow at 12pm PT, Claude subscriptions will no longer cover usage
  on third-party tools like OpenClaw.
summary: >-
  In January 2026 Anthropic "tightened our safeguards against spoofing the
  Claude Code harness" after accounts using third-party tools with Claude
  subscriptions were banned by its abuse filters. On April 3, Claude Code head
  Boris Cherny announced that from the next day Pro and Max subscriptions
  would no longer cover tools such as OpenClaw; they could still be used
  through paid extra-usage bundles or an API key. Asked whether this had ever
  been allowed, he replied: "Right, it wasn't allowed. We're now being more
  explicit about that." Anthropic gave subscribers a one-time credit equal to
  a month's plan, discounted usage bundles, and a refund for anyone who
  cancelled. Days later users complained that scripted use of Claude Code
  itself was being flagged; Cherny blamed "an overactive abuse-detection system"
  and said Anthropic was "working on making the terms for -p crystal clear."
  On May 13 Anthropic announced a monthly Agent SDK credit, from June 15,
  covering scripts, claude -p and third-party apps outside the regular
  limits; on June 15 it paused that change, saying third-party app usage
  "still draw from your subscription's usage limits."
patterns: [shrinking-plan]
related: [2025-07-28-claude-weekly-limits]
