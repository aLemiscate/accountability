response: >-
  Anthropic said it had fully fixed the gap, that its review of the traffic
  found no meaningful uplift to any threat actor, and that it was describing the
  incidents so other developers would check their own systems. It noted that its
  previous report "did not consider our human feedback platforms as a risk
  surface."
note: >-
  This is self-disclosure, and it's exactly what the "openly grade" promise asks
  for. It also shows how thin the line is between a safeguard being announced
  and it actually running everywhere it needs to.
