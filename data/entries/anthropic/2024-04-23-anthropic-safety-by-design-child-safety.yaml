title: 'Standing promise: Safety by Design principles against AI-generated child
  sexual abuse material'
date: 2024-04-23
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Thorn and All Tech Is Human, Safety by Design for Generative AI
quote: >-
  Alongside other leading AI companies, we are committed to implementing robust
  child safety measures in the development, deployment, and maintenance of
  generative AI technologies.
summary: >-
  Anthropic joined OpenAI, Google, Meta, Microsoft and others in committing to
  principles against AI-generated child sexual abuse material. It listed
  mitigations it was "working towards," including keeping such material out of
  training data, red-teaming models for it, detecting abusive content in inputs
  and outputs, and deploying in phases. The companies also agreed to publish
  documentation of their progress.
concreteness: directional
status: open
breaks_if: >-
  Credible reporting that Claude generated or distributed child sexual abuse
  material through a failure of these safeguards that Anthropic knew of and
  didn't fix; or Anthropic stops reporting progress.
patterns: []
