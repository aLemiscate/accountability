title: 'Standing promise: a sabotage risk report for every frontier model beyond
  Opus 4.5'
date: 2025-11-24
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Claude Opus 4.5 system card
quote: >-
  we’ve decided to commit to writing sabotage risk reports that meet this
  standard for all future … frontier AI models that clearly exceed Claude Opus
  4.5’s capabilities.
summary: >-
  Anthropic said Claude Opus 4.5 might not be far from the capability level at
  which its Responsible Scaling Policy requires an argument that a model is
  aligned or monitored well enough not to pose unacceptable risk from pursuing
  misaligned goals. Rather than rely on evaluations near that edge, it
  committed to publishing a sabotage risk report for every later frontier
  model that clearly exceeds Opus 4.5.
concreteness: measurable
status: kept
breaks_if: >-
  Anthropic releases a frontier model that clearly exceeds Opus 4.5 without a
  sabotage or alignment risk report of this kind.
patterns: []
related: [2026-02-10-opus-4-6-reasoning-not-trained, 2026-04-07-mythos-preview-not-general, 2026-08-14-risk-report-classifier-gap]
