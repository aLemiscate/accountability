response: >-
  Anthropic said Claude Code had "seen unprecedented demand," that some users
  ran it "continuously in the background, 24/7," that "one user consumed tens of
  thousands in model usage on a $200 plan," and that others were sharing and
  reselling accounts. A spokesperson told TechCrunch "most users won’t notice a
  difference."
note: >-
  The plan was sold as a multiple of Pro, never as a fixed amount, which is what
  let the absolute limits move under it. Anthropic announced the weekly caps a
  month ahead; the July tightening that preceded them reached users before any
  announcement.
