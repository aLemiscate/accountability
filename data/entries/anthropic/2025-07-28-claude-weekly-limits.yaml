title: Anthropic adds weekly caps to Claude Pro and Max, three months after
  selling Max on "5x or 20x more usage"
date: 2025-07-28
org: anthropic
type: did
kind: action
who: [anthropic]
quote: >-
  We’re rolling out new weekly rate limits for Claude Pro and Max in late
  August. We estimate they’ll apply to less than 5% of subscribers based on
  current usage.
summary: >-
  Anthropic launched its Max plan in April 2025 "with options for 5x or 20x more
  usage compared to our Pro plan," for $100 or $200 a month. In mid-July heavy
  Claude Code users began hitting unexpectedly restrictive limits; TechCrunch
  reported that there had been "no explicit announcement of a change in limits"
  and that Anthropic confirmed the issues but declined to elaborate. On July 28
  Anthropic announced two weekly caps for Pro and Max, one overall and one for
  its top model, on top of the existing five-hour limits, from Aug. 28. It said
  they would affect fewer than 5% of subscribers, and that Max users could buy
  more usage at API rates. When the caps rolled out on Sept. 29 it put the share
  at "fewer than 2%." In March 2026 it began draining five-hour sessions faster
  during weekday peak hours for Free, Pro and Max; staff member Thariq Shihipar
  said "I know this was frustrating." On May 6, 2026, after a compute deal with
  SpaceX, Anthropic doubled Claude Code's five-hour limits and removed the
  peak-hours reduction.
patterns: [shrinking-plan]
