title: 'Leaked memo: "No bad person should ever benefit from our success" is
  hard to run a business on'
date: 2025-07-20
org: anthropic
type: did
kind: disclosure
who: [dario-amodei]
venue: Internal Slack memo to staff, reported by Wired
quote: >-
  Unfortunately, I think 'No bad person should ever benefit from our success' is
  a pretty difficult principle to run a business on.
summary: >-
  Amodei told staff Anthropic would seek investment from the UAE and Qatar. He
  called the chance of enriching "dictators" "a real downside," and argued that
  there is "a truly giant amount of capital in the Middle East" and that
  "without it, it is substantially harder to stay on the frontier."
contradicts: [2024-10-machines-of-loving-grace]
patterns: [principles-with-a-price, race-clause]
sources:
