    date: 2025-07-22
    type: reporting
    archive: https://web.archive.org/web/20260303125520/https://www.datacenterdynamics.com/en/news/anthropic-to-seek-gulf-state-investments-according-to-ceos-leaked-memo/
    snapshot: snapshots/2026-10-03-datacenterdynamics.com-a46f8d2f
response: >-
  In the memo, Amodei limited the change to "narrowly scoped, purely financial"
  investment, to avoid giving outside investors "leverage" over the company, and
  said serving the region commercially was "actually pure positive as long as we
  don't build data centers there and as long as we enforce our [acceptable use
  policy]."
note: >-
  To be fair, the memo is candid about the trade-off. But the justification is
  the race: stay on the frontier. That's the same exit the RSP rewrite used
  seven months later.
