title: 'Anthropic: "We built a system that defends against universal jailbreaks";
  ten days later a public challenge finds one'
date: 2025-02-03
org: anthropic
type: said
kind: claim
who: [anthropic, jan-leike]
venue: Research announcement and posts on X
quote: >-
  We built a system that defends against universal jailbreaks!
summary: >-
  Anthropic announced Constitutional Classifiers, two classifiers that screen
  a model's inputs and outputs. It said that after "thousands of hours of red
  teaming" of a prototype, "not one participant found a reliable jailbreak"
  across ten harmful questions, and it opened a public eight-level challenge.
  On Feb. 5 it raised the prize, saying "Nobody has fully jailbroken our
  system yet." On Feb. 13 Jan Leike reported the result: "After 5 days, >300,000
  messages, and est. 3,700 collective hours our system got broken. In the end
  4 users passed all levels, 1 found a universal jailbreak." Anthropic paid
  $55,000 in prizes. Six months earlier, Anthropic researcher Sam Bowman had
  offered to bet at 25% odds that nobody would find a universal jailbreak
  against the system then being tested.
concreteness: measurable
status: contradicted
patterns: [claims-outrun-results]
related: [2025-05-22-asl-3-protections-activated]
