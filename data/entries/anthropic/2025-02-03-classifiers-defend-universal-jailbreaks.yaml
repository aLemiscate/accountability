response: >-
  Leike wrote that the demo "showed classifiers can help mitigate these risks,
  but need to be combined with other methods."
note: >-
  Anthropic ran the public test, published the result and paid out, which is how
  claims like this should be checked. The headline claim was still stronger than
  the evidence behind it, and the record notes it the same way it notes
  OpenAI's.
