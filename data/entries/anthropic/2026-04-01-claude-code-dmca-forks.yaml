title: 'After leaking Claude Code''s source, Anthropic says "No one at Anthropic
  dmca''d these forks"; GitHub''s record says its notice covered them'
date: 2026-04-01
org: anthropic
type: said
kind: denial
who: [boris-cherny, anthropic]
venue: Posts on X
quote: >-
  This was not intentional. We are debugging what happened on the GitHub side.
  No one at Anthropic dmca’d these forks
summary: >-
  On March 31, 2026 a Claude Code release on npm accidentally exposed the
  tool's full source code, which was quickly mirrored on GitHub; Claude Code
  head Boris Cherny called it "human error" in a manual deploy step. Anthropic
  filed a copyright takedown notice against one GitHub mirror. GitHub's
  published copy of the notice states that "the submitter alleged that all or
  most of the forks were infringing to the same extent as the parent
  repository," so GitHub processed it "against the entire network of 8.1K
  repositories," which included legitimate forks of Anthropic's own public
  Claude Code repository. After developers complained, Cherny wrote that no one
  at Anthropic had taken down the forks, and Anthropic retracted the notice for
  all but the one named repository and 96 forks containing the leaked code.
concreteness: measurable
status: contradicted
patterns: [sorry-after-caught]
sources:
