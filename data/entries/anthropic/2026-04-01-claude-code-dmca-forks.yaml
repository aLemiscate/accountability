    publisher: GitHub (github/dmca)
    url: https://github.com/github/dmca/blob/master/2026/03/2026-03-31-anthropic.md
    date: 2026-03-31
    type: primary
  - title: Anthropic took down thousands of GitHub repos trying to yank its leaked
      source code — a move the company says was an accident
    publisher: TechCrunch
    url: https://techcrunch.com/2026/04/01/anthropic-took-down-thousands-of-github-repos-trying-to-yank-its-leaked-source-code-a-move-the-company-says-was-an-accident/
    date: 2026-04-01
    type: reporting
response: >-
  An Anthropic spokesperson said: "The repo named in the notice was part of a
  fork network connected to our own public Claude Code repo, so the takedown
  reached more repositories than intended. We retracted the notice for
  everything except the one repo we named, and GitHub has restored access to
  the affected forks."
note: >-
  Probably a careless form rather than a deliberate sweep, and fixed within a
  day. But the notice Anthropic filed did make the claim about the forks, so
  "no one at Anthropic" did it is not accurate.
