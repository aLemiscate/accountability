title: 'Anthropic: "We never intentionally degrade model quality as a result of
  demand or other factors"'
date: 2025-09-09
org: anthropic
type: said
kind: denial
who: [anthropic, alex-albert]
venue: Claude account on X; postmortem on Anthropic's engineering blog
quote: >-
  We never intentionally degrade model quality as a result of demand or other
  factors.
summary: >-
  From early August 2025, Claude users reported worse answers, and some
  suspected Anthropic of quietly serving a weaker model when demand was high.
  On Sept. 9 Anthropic said it had found and fixed two bugs, and denied
  degrading quality on purpose. Its Sept. 17 postmortem traced the reports to
  three infrastructure bugs that ran from Aug. 5 into mid-September: requests
  routed to the wrong servers (16% of Sonnet 4 requests at the worst hour, and
  about 30% of Claude Code users had at least one such message), corrupted
  output on Opus and Sonnet, and a compiler bug that affected Haiku 3.5. It said
  its evaluations "simply didn't capture the degradation users were reporting,"
  and restated: "We never reduce model quality due to demand, time of day, or
  server load." Anthropic had answered the same suspicion in March 2024, when
  Alex Albert replied to claims that Claude had been "lobotomized": "When we
  make updates to our current models, we will make it very clear."
concreteness: measurable
status: open
breaks_if: >-
  Evidence (outside measurements, documents, or Anthropic's own disclosure)
  that Anthropic served a smaller, quantized or otherwise reduced model, or cut
  reasoning at the API or inference layer, in response to demand, time of day
  or server load; or a change to a released model that was not announced.
related: [2026-04-23-claude-code-quality-postmortem]
