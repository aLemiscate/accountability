updates:
  - date: 2026-04-23
    text: >-
      After six weeks of complaints that Claude Code had got worse, Anthropic
      traced them to three changes in Claude Code, the Agent SDK and Cowork,
      one of them a deliberate switch of the default reasoning effort from high
      to medium, and said the API was not affected. It repeated the denial: "We
      never intentionally degrade our models, and we were able to immediately
      confirm that our API and inference layer were unaffected." See the
      linked entry.
    sources:
      - title: An update on recent Claude Code quality reports
        publisher: Anthropic
        url: https://www.anthropic.com/engineering/april-23-postmortem
        date: 2026-04-23
        type: primary
note: >-
  Both investigations were Anthropic's own, and both found real degradation
  with causes other than the one denied: bugs in 2025, product changes and a
  bug in 2026. The denial covers the model and the servers. It doesn't cover
  the settings and prompts around them, which is where the 2026 problems were.
