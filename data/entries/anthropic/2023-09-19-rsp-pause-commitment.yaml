title: 'Responsible Scaling Policy: pause training if safety can''t keep up'
date: 2023-09-19
org: anthropic
type: said
kind: commitment
who: [anthropic]
venue: Responsible Scaling Policy v1.0 announcement
quote: >-
  the ASL system implicitly requires us to temporarily pause training of more
  powerful models if our AI scaling outstrips our ability to comply with the
  necessary safety procedures.
summary: >-
  The RSP set AI Safety Levels with if-then commitments: don't train or deploy
  past a capability threshold without the matching safeguards. It included "a
  commitment not to deploy ASL-3 models if they show any meaningful catastrophic
  misuse risk under adversarial testing by world-class red-teamers." Leaders
  often pointed to it as proof that Anthropic was a responsible company.
concreteness: conditional
status: reversed
patterns: [race-clause]
sources:
  - title: Anthropic's Responsible Scaling Policy
    publisher: Anthropic
    url: https://www.anthropic.com/news/anthropics-responsible-scaling-policy
    date: 2023-09-19
    type: primary
    snapshot: snapshots/2026-09-29-anthropic.com-394ea6d1
note: >-
  This was the most concrete safety commitment either company made. That's why
  its removal matters most.
