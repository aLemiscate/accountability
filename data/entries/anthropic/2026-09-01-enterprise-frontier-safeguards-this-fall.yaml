note: >-
  Recorded alongside OpenAI's Private Inference, promised for this fall.
  Anthropic has required 30-day retention for its most capable models since
  June; OpenAI reserved the right in April to drop zero retention for specific
  customers. Both now promise privacy that keeps misuse monitoring, and in both
  designs the data used for monitoring is still kept, in storage the customer
  controls. Retention for these models is graded in the commitments inventory
  (Anthropic privacy and data use). The "never will" on training is a standing
  promise this entry also holds Anthropic to. Fall ends Dec. 21; the due date
  allows to the end of December.
