title: $1.5B settlement over millions of pirated books used to build Claude's library
date: 2025-09-05
org: anthropic
type: did
kind: outcome
who: [ anthropic ]
quote: >-
  Anthropic had no entitlement to use pirated copies for a central library.
summary: >-
  In Bartz v. Anthropic, Judge William Alsup ruled in June 2025 that training on
  lawfully bought books was fair use, but that downloading pirated books from
  shadow libraries such as Library Genesis and Pirate Library Mirror to build a
  permanent library was not. Anthropic then agreed to pay $1.5B, about $3,000
  per book, and to destroy the pirated files. It's the largest copyright
  settlement on record. (The quote is from Judge Alsup's ruling.)
patterns: [ take-first ]
sources:
