response: >-
  Anthropic pointed to the court's finding that training on lawfully acquired
  books is fair use, and said the settlement resolves the remaining claims.
note: >-
  "Safety-first" didn't extend to the provenance of the training data. The
  company took first and paid when a court made it. In September 2024, with the
  authors' suit already filed, chief product officer Mike Krieger was asked on
  Decoder where Claude's training data comes from. He answered: "[It comes from]
  scraping the web. We respect robots.txt. We have a few other data sources
  that we license and work with folks separately for that. Let's say the
  majority of it is web crawl done in a web crawl respectful way." He didn't
  mention the shadow-library downloads.
