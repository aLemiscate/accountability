updates:
  - date: 2026-07
    text: The court gave final approval to the settlement.
    sources:
      - title: Judge approves record $1.5 billion AI copyright settlement involving
          Anthropic
        publisher: JURIST
        url: https://www.jurist.org/news/2026/07/judge-approves-record-1-5-billion-settlement-involving-anthropic/
        date: 2026-07
        type: reporting
        archive: https://web.archive.org/web/20260925045344/https://www.jurist.org/news/2026/07/judge-approves-record-1-5-billion-settlement-involving-anthropic/
        snapshot: snapshots/2026-09-29-jurist.org-a27e7b73
response: >-
  Anthropic pointed to the court's finding that training on lawfully acquired
  books is fair use, and said the settlement resolves the remaining claims.
note: >-
  "Safety-first" didn't extend to the provenance of the training data. The
  company took first and paid when a court made it.
