note: >-
  Anthropic already has pieces of this: embedded evaluators (Accenture, from
  Sept. 18) and a Long-Term Benefit Trust that appoints board members. The
  accord names no deadline, no auditor and no reporting. Watch for who the
  external auditor is, whether its findings are published, and whether a board
  committee receives reports on the incidents Anthropic has already disclosed.
