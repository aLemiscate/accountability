updates:
  - date: 2023-12-18
    text: >-
      OpenAI's first Preparedness Framework made it concrete: "Scorecard
      evaluations (and corresponding mitigations) will be audited by qualified,
      independent third-parties to ensure accurate reporting of results," and a
      "requested third-party audit (assuming qualified and effective auditors
      can be found)" would validate a model's risk level before deployment.
    sources:
      - title: Preparedness Framework (Beta) (PDF)
        publisher: OpenAI
        url: https://cdn.openai.com/openai-preparedness-framework-beta.pdf
        date: 2023-12-18
        type: primary
        snapshot: snapshots/2026-09-29-cdn.openai.com-45f5df09
  - date: 2025-04-15
    text: >-
      Version 2 of the framework replaced the audit commitment with discretion:
      "If we deem that a deployment warrants deeper testing … then when
      available and feasible, OpenAI will work with third-parties to
      independently evaluate models." OpenAI has worked with outside testers
      such as government AI safety institutes before some releases (see
      related), but no framework version since the first has committed to
      independent audits of its evaluations.
    sources:
      - title: Preparedness Framework, Version 2 (PDF), section 5.2
        publisher: OpenAI
        url: https://cdn.openai.com/pdf/18a02b5d-6b67-4cec-ab64-68cdfbddebcd/preparedness-framework-v2.pdf
        date: 2025-04-15
        type: primary
        snapshot: snapshots/2026-09-29-cdn.openai.com-ec5d8e7d
note: >-
  The idea wasn't dropped outright. In September 2026 Altman promised
  independent evaluators with "employee-like access." The written commitment,
  though, went from "will be audited" in 2023 to "if we deem" in 2025.
