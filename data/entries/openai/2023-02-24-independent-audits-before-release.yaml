title: 'OpenAI: efforts like ours should "submit to independent audits before
  releasing new systems"'
date: 2023-02-24
org: openai
type: said
kind: commitment
who: [openai, sam-altman]
venue: Blog post by Sam Altman, "Planning for AGI and beyond"
quote: >-
  We think it’s important that efforts like ours submit to independent audits
  before releasing new systems; we will talk about this in more detail later
  this year.
summary: >-
  In OpenAI's statement of its AGI strategy, Altman said labs like OpenAI should
  be independently audited before releasing new systems. He added that at some
  point it "may be important to get independent review before starting to train
  future systems," and to agree to limit the growth of training compute.
concreteness: directional
status: eroded
breaks_if: >-
  OpenAI releases frontier systems without independent audit, or drops audit
  language from its own framework.
patterns: []
related:
