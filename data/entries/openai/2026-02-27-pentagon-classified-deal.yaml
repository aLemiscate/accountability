  - date: 2026-09-08
    text: >-
      The Intercept published a contract modification it obtained through a
      Freedom of Information Act lawsuit. The document, labeled P00003, defined
      "OpenAI Mission Models" as models "designed for national security use
      cases" that "have minimal refusal rates"; a separate document signed by
      both sides on Feb. 6 indicated that OpenAI agreed that day to the contents
      of a version P00003. The Intercept reported that a Justice Department
      lawyer representing the Pentagon first confirmed the document was the
      signed and executed version and hours later told it to disregard that
      confirmation. OpenAI said it had never agreed to that language and that
      the document was an earlier Pentagon draft. A Pentagon spokesperson said
      the phrase "does not appear in any active Department of War contract with
      OpenAI." The final text has not been released.
    sources:
