updates:
  - date: 2026-02-28
    text: >-
      OpenAI's own thread on the deal listed its red lines and said: "Other AI
      labs have reduced or removed their safety guardrails and relied primarily
      on usage policies as their primary safeguards in national security
      deployments. We think our approach better protects against unacceptable
      use." It also said: "We do not think Anthropic should be designated as a
      supply chain risk and we've made our position on this clear to the
      Department of War."
