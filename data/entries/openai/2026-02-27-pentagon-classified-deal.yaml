title: 'OpenAI signs a classified Pentagon deal the day Anthropic is blacklisted; Altman later calls it "sloppy"'
date: 2026-02-27
org: openai
type: did
kind: action
who: [openai, sam-altman, caitlin-kalinowski]
summary: >-
  On the day the Pentagon designated Anthropic a supply-chain risk for
  refusing to drop limits on surveillance and autonomous-weapons use, OpenAI
  announced an agreement to deploy its models in classified environments.
  The contract let the Pentagon use the models "for all lawful purposes,"
  pointing to existing laws and policies that can change. OpenAI said it
  also contained red lines. After backlash, Altman said the deal "looked
  opportunistic and sloppy," and on March 2 OpenAI amended it to explicitly
  prohibit domestic surveillance of U.S. persons. On March 7, robotics and
  hardware lead Caitlin Kalinowski resigned, saying surveillance without
  judicial oversight and lethal autonomy without human authorization were
  "lines that deserved more deliberation than they got."
related: [2026-02-27-anthropic-pentagon-red-lines]
patterns: [ship-then-patch, sorry-after-caught, principles-with-a-price]
