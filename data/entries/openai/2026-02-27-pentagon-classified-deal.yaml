  - date: 2026-03-01
    text: >-
      Current OpenAI researchers disagreed in public. Leo Gao wrote that "the
      contract snippet from the openai dow blog post is so obviously just "all
      lawful use" followed by a bunch of stuff that is not really operative
      except as window dressing," and that "there are a ton of mass domestic
      surveillance loopholes not covered by the 4A, national security act, FISA,
      etc." His colleague Boaz Barak replied that Gao was "not a lawyer or a
      natsec expert" and that OpenAI "in terms of enabling employee pushback and
      discussion … is in fact still open." On March 2 Aidan McLaughlin, who
      works on model behavior, wrote: "i personally don’t think this deal was
      worth it." Platformer reported both posts.
