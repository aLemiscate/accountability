response: >-
  OpenAI said it retained "full discretion over our safety stack," with cloud
  deployment and cleared OpenAI staff in the loop. On the September 2026 FOIA
  document, OpenAI spokesperson Nate Evans told The Intercept: "OpenAI has never
  agreed to contract language requiring ‘minimal refusal rates.’ This language
  does not appear in our executed contract. The document you received appears to
  be an earlier draft proposed by the Department before we provided feedback. We
  rejected that language, the department agreed to remove it, and the final
  executed agreement does not include it."
updates:
  - date: 2026-02-10
    text: >-
      Two weeks before the classified deal, OpenAI said it would bring a custom
      ChatGPT to GenAI.mil, the Pentagon's platform for unclassified work by
      some 3 million personnel. Semafor reported that the Pentagon had asked to
      use the technology for "all lawful uses," meaning OpenAI could not impose
      its own restrictions, and that OpenAI was offering the same ChatGPT
      available to other users, with its standard guardrails in place. It
      reported that the clause had become a sticking point in the Pentagon's
      negotiations with Anthropic, whose Claude was not on the platform.
