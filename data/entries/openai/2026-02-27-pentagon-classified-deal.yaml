  - date: 2026-03-01
    text: >-
      In a public Q&A on X the next day, Altman described the red lines as
      provisional: "We currently have three redlines. I could see us changing
      them or adding more as the technology evolves, and there are new risks we
      don't yet understand." Asked whether OpenAI would switch the system off,
      he wrote that it would if a use were illegal, but: "What we won't do is
      turn it off because we disagree with a particular (legal military)
      decision. We trust their authority." On the timing: "The main reason for
      the rush was an attempt to de-escalate matters at a time when it felt like
      things could get extremely hot." Asked how the red lines survive a change
      in the law, OpenAI's chief strategy officer Jason Kwon said the contract
      "date stamps" the relevant policy directive or law: "That's what we did."
