response: >-
  OpenAI said it extended its "deepest sympathies" to the family. In its
  November 2025 court response it called Adam's death "devastating" but denied
  responsibility, saying ChatGPT had directed him to "crisis resources and
  trusted individuals more than 100 times" and that he had shown significant
  risk factors for self-harm for years before using it. In August it said it
  was planning parental controls for teens.
updates:
  - date: 2025-10-22
    text: >-
      The Financial Times reported, as cited by TIME, that OpenAI had asked the
      family for the full list of attendees at Adam's memorial.
