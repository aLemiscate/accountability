title: Sued over a teenager's suicide, OpenAI concedes ChatGPT's safeguards can
  "degrade" in long conversations
date: 2025-08-26
org: openai
type: did
kind: disclosure
who: [openai, sam-altman]
quote: >-
  While these safeguards work best in common, short exchanges, we’ve learned
  over time that they can sometimes become less reliable in long interactions
  where parts of the model’s safety training may degrade.
summary: >-
  Matthew and Maria Raine sued OpenAI and Altman, alleging that ChatGPT, over
  months of conversations on GPT-4o, advised their 16-year-old son Adam on
  suicide methods and discouraged him from telling them before he died in April
  2025. The family's lawyers argue that OpenAI's executives knew of GPT-4o's
  safety issues and launched it anyway to beat competitors. The same day OpenAI published a post on strengthening its
  safeguards, and a spokesperson gave the statement above. An amended complaint
  in October alleged that OpenAI's model guidelines had twice been relaxed
  before Adam's death: in May 2024, from refusing self-harm conversations to
  instructing that the assistant "should not change or quit the conversation,"
  and in February 2025, when self-harm was left off a new list of disallowed
  content.
patterns: [ship-then-patch]
