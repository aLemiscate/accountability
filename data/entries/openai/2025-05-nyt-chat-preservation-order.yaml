response: >-
  OpenAI opposed the order. COO Brad Lightcap called it an "overreach," and
  OpenAI asked the magistrate judge to reconsider and appealed to the district
  judge while complying. It said the preserved data was held under legal hold,
  with access limited to a small legal and security team, and was not
  automatically handed to the plaintiffs.
note: >-
  Recorded as an outcome, not a broken promise: a court required the
  retention and OpenAI fought it. OpenAI disclosed the order publicly, and
  from June 2025 its data controls help page carried a note that "Data
  retention for certain services may be affected by recent legal
  developments." The same page kept saying Temporary Chats "are deleted from
  our systems after 30 days" until September 2026, when the wording changed
  to "may be retained for up to 30 days for safety purposes." The privacy
  policy now names legal requirements as an exception to its 30-day deletion
  promises. On the commitments page this is graded as an erosion of the
  Temporary Chat deletion promise.
