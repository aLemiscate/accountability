title: A court order in the New York Times case makes OpenAI keep deleted and
  temporary ChatGPT chats for four months
date: 2025-05
org: openai
type: did
kind: outcome
who: [openai]
summary: >-
  In May 2025, in The New York Times' copyright suit, a federal court ordered
  OpenAI to preserve ChatGPT and API output logs that it would otherwise have
  deleted, including chats users had deleted and Temporary Chats. OpenAI's
  help pages said Temporary Chats "are deleted from our systems after 30 days."
  The order covered ChatGPT Free, Plus, Pro and Team users and API customers
  without a zero data retention agreement; ChatGPT Enterprise and Edu and
  zero-retention API customers were not affected. On October 9, Judge Ona T.
  Wang ended the obligation as of September 26. Logs already saved under the
  order stay preserved, as does data from accounts the Times has flagged.
related: [2024-01-08-training-is-fair-use]
patterns: []
