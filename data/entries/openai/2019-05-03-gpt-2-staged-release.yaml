note: >-
  Kept, on the schedule OpenAI set. In 2025 OpenAI described this caution as a
  product of an outdated view of AGI; see the related entry. Clark's 2022
  remarks support neither side fully: he tied the caution to misuse, as the 2019
  report did, but said the misuse came later than he had expected.
