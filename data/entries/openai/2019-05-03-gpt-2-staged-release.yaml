title: OpenAI commits to a staged release of GPT-2 and follows it through to the
  full model
date: 2019-05-03
org: openai
type: said
kind: commitment
who: [openai, miles-brundage]
venue: Posts on X and the GPT-2 release updates
quote: >-
  Two mechanisms for publishing GPT-2 (and hopefully future powerful models):
  staged release and partnership-based sharing.
summary: >-
  In February 2019 OpenAI withheld the full GPT-2 language model over misuse
  concerns, releasing a small version and promising to revisit the decision;
  its policy staff told researchers who wanted access "We're working on
  broadening access in a principled way - stay tuned!" In May it set out a
  staged release, publishing a 345-million-parameter model and sharing the
  1.5-billion-parameter one with partners working on countermeasures. In
  August it released the 774-million model with a six-month report and a legal
  template for model-sharing partnerships, and on Nov. 5 it released the full
  1.5-billion model with a final report, partner research on malicious uses and
  a detector for GPT-2 output.
concreteness: measurable
status: kept
related: [2025-03-05-gpt-2-history-recast]
