updates:
  - date: 2022-08-13
    text: >-
      Jack Clark, OpenAI's policy director during the release and by then a
      co-founder of Anthropic, said the misuse fear had come too soon: "I was
      very worried about disinfo from gpt2 and I think that was way too early.
      Had proof of concepts but not really reliable." In the same exchange he
      said that in 2018 and 2019 "I felt like it was imminent," and that
      language-model disinformation "is mostly a not-yet thing due to unit
      economics, complexity of disinfo kill chain, need to invest engineering to
      effectively integrate LM etc. This'll change eventually."
