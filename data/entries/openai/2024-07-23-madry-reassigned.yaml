title: OpenAI removes its head of Preparedness, days before senators ask about
  its safety commitments
date: 2024-07-23
org: openai
type: did
kind: action
who: [openai]
summary: >-
  OpenAI reassigned Aleksander Madry, head of the Preparedness team "tasked with
  tracking, evaluating, forecasting, and helping protect against catastrophic
  risks related to frontier AI models," to a role focused on AI reasoning,
  CNBC reported. Less than a week later, Democratic senators wrote to Altman
  seeking information on "the steps that the company is taking to meet its
  public commitments on safety." It came two months after the Superalignment
  team was dissolved; the AGI Readiness team followed in October.
