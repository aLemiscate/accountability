title: 'White House commitments: OpenAI will "publish reports for all new
  significant model public releases"'
date: 2023-07-21
org: openai
type: said
kind: commitment
who: [openai]
venue: Voluntary commitments announced at the White House
quote: >-
  They commit to publish reports for all new significant model public releases
  within scope.
summary: >-
  OpenAI was one of seven companies (with Anthropic, Amazon, Google, Inflection,
  Meta and Microsoft) to sign voluntary commitments on AI safety, security and
  transparency. One was to publish a report, covering safety evaluations,
  limitations and societal risks, for every significant public model release.
  The commitments covered models "overall more powerful than the current
  industry frontier (e.g. models that are overall more powerful than any
  currently released models, including GPT-4, Claude 2, PaLM 2, Titan…)", and
  the companies said they intended them "to remain in effect until regulations
  covering substantially the same issues come into force."
concreteness: conditional
status: eroded
patterns: [unfalsifiable]
related: [2023-07-21-anthropic-white-house-commitments]
