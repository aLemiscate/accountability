title: 'OpenAI promises "Media Manager," a tool for creators to opt out of
  training, "by 2025"'
date: 2024-05-07
org: openai
type: said
kind: commitment
who: [openai]
venue: Blog post, "Our approach to data and AI"
summary: >-
  Facing lawsuits from newspapers and authors, OpenAI said it was building Media
  Manager. The tool would let creators and content owners identify their works
  and say whether they may be used for training, and would "identify copyrighted
  text, images, audio, and video" across multiple sources. OpenAI said the goal
  was to have it in place by 2025 and hoped it would "set a standard across the
  AI industry."
concreteness: measurable
status: broken
breaks_if: >-
  No Media Manager, or equivalent tool that lets creators identify their works
  across sources and exclude them from training, launches by the end of 2025.
patterns: []
related: [2024-01-08-training-is-fair-use, 2025-09-30-sora-2-opt-out-and-likeness]
