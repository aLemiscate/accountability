updates:
  - date: 2025-01-01
    text: >-
      TechCrunch reported that OpenAI had given no update and that the tool "was
      rarely viewed as an important launch internally." One former employee
      said: "To be honest, I don't remember anyone working on it." A lawyer who
      had worked on it had moved to a part-time consulting role.
    sources:
      - title: OpenAI failed to deliver the opt-out tool it promised by 2025
        publisher: TechCrunch
        url: https://techcrunch.com/2025/01/01/openai-failed-to-deliver-the-opt-out-tool-it-promised-by-2025/
        date: 2025-01-01
        type: reporting
        snapshot: snapshots/2026-09-30-techcrunch.com-c435d6a9
note: >-
  Marked broken on the generous reading: even taking "by 2025" to mean by the
  end of 2025, this record found no launch as of September 2026. Creators can
  still use OpenAI's older opt-outs, a form for images and blocking its crawler.
