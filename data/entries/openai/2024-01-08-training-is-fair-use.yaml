title: 'OpenAI on the NYT lawsuit: "Training is fair use," and regurgitation is
  "a rare bug we''re driving to zero"'
date: 2024-01-08
org: openai
type: said
kind: claim
who: [openai]
venue: Post on X and blog post, "OpenAI and journalism"
quote: >-
  Training is fair use, but we provide an opt-out • "Regurgitation" is a rare
  bug we're driving to zero
summary: >-
  Responding to The New York Times' copyright suit, OpenAI said that training
  models on "publicly available internet materials" is fair use, that it offers
  publishers an opt-out, that reproducing articles verbatim is a rare bug, and
  that the Times was "not telling the full story."
concreteness: directional
status: open
breaks_if: >-
  Courts rule that OpenAI's training was not fair use, or evidence shows OpenAI
  trained on material it knew was pirated rather than publicly available.
patterns: [take-first]
related: [2025-11-26-openai-libgen-deletion, 2025-09-05-pirated-books-settlement]
