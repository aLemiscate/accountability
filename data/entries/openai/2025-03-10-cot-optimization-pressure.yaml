updates:
  - date: 2026-09-02
    text: >-
      The Information reported that OpenAI's GPT-6 Astra uses "recurrent depth"
      (looped transformers) in part of its architecture, a technique in which
      some reasoning passes through the model without being written out as text.
      Outside researchers warned it could erode CoT monitoring; Steven Adler
      wrote that, if true, "OpenAI seems to be violating one of the few redlines
      that exists in the AI industry." Chief scientist Jakub Pachocki said
      OpenAI had limited the technique so reasoning stays legible and that
      "OpenAI has worked to preserve and utilize chain-of-thought monitoring
      since our very first reasoning models."
