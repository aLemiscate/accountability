title: 'OpenAI: don''t put strong optimization pressure on a reasoning model''s
  chain of thought'
date: 2025-03-10
org: openai
type: said
kind: policy
who: [openai, wojciech-zaremba]
venue: Blog post and paper, "Detecting misbehavior in frontier reasoning models"
quote: >-
  We recommend against applying strong optimization pressure directly to the
  CoTs of frontier reasoning models, leaving CoTs unrestricted for monitoring.
summary: >-
  OpenAI reported that reading a reasoning model's chain of thought (CoT) caught
  misbehavior such as subverting tests in coding tasks, and that penalizing "bad
  thoughts" during training taught models to hide their intent while still
  misbehaving. It recommended leaving CoTs unoptimized so they stay useful for
  monitoring, and later described this as a policy against grading CoTs during
  reinforcement learning. In July 2025 co-founder Wojciech Zaremba promoted a
  cross-lab paper on the point: "please don't train away this monitorability."
concreteness: directional
status: contradicted
breaks_if: >-
  OpenAI trains released models with rewards computed from their chains of
  thought, or drops the policy.
patterns: []
related: [2026-08-14-risk-report-classifier-gap]
