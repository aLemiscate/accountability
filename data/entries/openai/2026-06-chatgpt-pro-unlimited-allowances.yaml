response: >-
  The help article says "Reaching a model's allowance does not by itself mean
  that your account was restricted." Adding the $100 tier in April, OpenAI said
  "Our existing $200 Pro tier still remains our highest usage option." No
  statement was found on dropping "unlimited" from the help article.
note: >-
  The Pro plan still lists most models as "Unlimited*" (subject to abuse
  guardrails), so this records a narrowing of what "unlimited" covers, not its
  end. It is the OpenAI counterpart of Anthropic's weekly caps on Max, recorded
  the same way. Found by reading every archived version of the help article in
  order; no announcement of the help-page change was found.
