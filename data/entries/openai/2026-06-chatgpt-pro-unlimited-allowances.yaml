updates:
  - date: 2026-09-10
    text: >-
      A week after GPT-6 Astra launched, OpenAI paused new sign-ups and upgrades
      to the $200 Pro plan. Thibault Sottiaux wrote: "To make sure our current
      users have an incredible experience and continued access to Astra, we are
      going to pause subscriptions to our $200 Pro plan," adding that these
      "put the most strain on our systems." Existing subscribers were not
      affected.
    sources:
      - title: OpenAI pauses $200 Pro tier as Astra demand strains capacity
        publisher: CIO
        url: https://www.cio.com/article/4221092/openai-pauses-200-pro-tier-as-astra-demand-strains-capacity.html
        date: 2026-09-11
        type: reporting
        snapshot: snapshots/2026-10-13-cio.com-851b158a
  - date: 2026-09-29
    text: >-
      Reopening the plan, Sottiaux wrote that OpenAI was "changing how we
      calculate the usage for it. In effect, if you do the math, it will net out
      at half the dollar in API spend compared to the old Pro $200 plan." In
      return OpenAI was "committing to not reintroducing the 5h limit," and he
      wrote that "you will still get more work done than if you were on the Pro
      $200 subscription one month ago" because of new models and API price cuts
      (see related).
    sources:
      - title: Thibault Sottiaux on Twitter/X ("Tomorrow we are re-opening the Pro $200
          subscriptions")
        publisher: Twitter/X
        url: https://x.com/thsottiaux/status/2104823812042940713
        date: 2026-09-29
        type: primary
        archive: https://web.archive.org/web/20261008122427/https://x.com/thsottiaux/status/2104823812042940713
        snapshot: snapshots/2026-10-13-x.com-47a0b923
  - date: 2026-09-29
    text: >-
      At DevDay the same day, OpenAI launched a $500-a-month Pro plan with 25
      times the Plus allowance, now its highest, and the only one with its new
      Ultrafast speed tier. It also set out the cut to the $200 plan: from Oct.
      30, its ChatGPT Work and Codex allowance falls from 20 times the Plus
      allowance to 10 times, and its GPT-6 Pro chat allowance from 200 messages
      a week to 100, at the same price. Eligible existing subscribers keep the
      old limits through Oct. 29; The New Stack reported they then get a
      one-time grant of 62,500 usage credits, which OpenAI valued at $2,500,
      expiring Dec. 31.
    sources:
