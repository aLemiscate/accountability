title: ChatGPT Pro, launched as "$200/month. unlimited usage," moves to
  per-model allowances and "expanded" access to GPT-6
date: 2026-06
org: openai
type: did
kind: action
who: [openai, sam-altman]
quote: >-
  On ChatGPT Pro, some models have separate usage allowances. When you reach a
  model's allowance, that model may be temporarily unavailable until the
  allowance resets.
summary: >-
  Altman launched ChatGPT Pro on Dec. 5, 2024 as "$200/month. unlimited usage
  and even-smarter mode for using o1," and OpenAI's post promised "unlimited
  access to OpenAI o1." From GPT-5's launch in August 2025, OpenAI's help
  article said the Team (later Business) and Pro plans offered "unlimited access
  to our GPT-5 models, subject to abuse guardrails." Between June 10 and June
  23, 2026, that sentence was replaced with the one quoted above, which points
  to an article titled "About ChatGPT Pro tiers." In April OpenAI had split Pro
  into a $100 and a $200 tier sold on 5 and 20 times Plus's usage. When the
  GPT-6 models launched in September, the pricing page listed Pro's access to
  them as "Expanded," while older GPT-5.6 models stayed "Unlimited*." The same
  help article stopped giving numbers for the Plus and Free limits in June: the
  Free limit "can be dynamic and may vary based on factors that include market,
  system conditions, abuse-prevention guardrails, and individual usage."
patterns: [shrinking-plan]
