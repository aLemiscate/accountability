title: OpenAI asks Washington to shield AI companies from state laws in exchange
  for voluntary cooperation
date: 2025-03-13
org: openai
type: did
kind: action
who: [openai, chris-lehane]
quote: >-
  provide participating companies with liability protections including
  preemption from state-based
summary: >-
  In its submission for the Trump administration's AI Action Plan, signed by
  global affairs chief Chris Lehane, OpenAI proposed a "purely voluntary and
  optional" partnership between AI companies and the federal government. In
  exchange, participating companies would get "relief" from state AI bills and
  "liability protections including preemption from state-based regulations
  that focus on frontier model security (e.g., CA SB 1047)." It said federal
  preemption would require an act of Congress. The same submission argued for
  preserving AI models' ability to learn from copyrighted material.
contradicts: [2023-05-16-altman-senate-licensing-agency]
