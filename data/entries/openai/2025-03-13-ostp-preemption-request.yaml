updates:
  - date: 2026-06-10
    text: >-
      Within a year OpenAI was endorsing state AI safety bills: New
      York's RAISE Act, signed in December 2025, and Illinois's S.B. 315, which
      requires frontier developers with more than $500 million in revenue to
      hire outside auditors every year. Lehane called it "reverse federalism":
      "You’re basically getting the states to replicate each other." He said
      OpenAI picked bills that acknowledge a federal standard could later
      overrule them, and that his ideal remained federal safety standards with
      "some type of very narrow preemption." Leading the Future, the super PAC
      co-funded by OpenAI president Greg Brockman, meanwhile set out to defeat
      the RAISE Act's Assembly sponsor, Alex Bores (see related).
