note: >-
  Two years after asking the Senate for a licensing agency, OpenAI asked for
  voluntary federal oversight that would also protect it from binding state
  rules. The rules it named as the example were frontier-model safety rules. In November 2023, asked at the Cambridge Union whether OpenAI would publish
  its own risk thresholds, Altman had said: "fundamentally, companies shouldn't
  regulate themselves here." (Quoted from the audio.)
