title: 'Altman after the GPT-5 launch: OpenAI will make it "more transparent
  about which model is answering"'
date: 2025-08-08
org: openai
type: said
kind: commitment
who: [sam-altman, openai]
venue: Posts on X during the GPT-5 rollout
quote: >-
  We will make it more transparent about which model is answering a given query.
summary: >-
  GPT-5 launched in ChatGPT on Aug. 7, 2025 as a system with a real-time router
  that picks which underlying model answers each prompt. The next day Altman
  wrote that the "autoswitcher" had broken for part of launch day, making GPT-5
  seem "way dumber," and listed fixes, including making it more transparent
  which model answers a query. Two days later he added: "we will also shortly
  make a UI change to indicate which model is working." In the same posts he
  said Plus users could keep using GPT-4o.
concreteness: directional
status: eroded
