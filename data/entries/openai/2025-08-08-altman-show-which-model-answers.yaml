updates:
  - date: 2025-09-27
    text: >-
      Users found ChatGPT switching some of their messages to an undocumented
      safety model without showing it (see related). Explaining the switch,
      ChatGPT head Nick Turley set a narrower standard: "ChatGPT will tell you
      which model is active when asked." OpenAI repeated it on Oct. 3: "ChatGPT
      will continue to tell users what model is active when asked."
