        type: primary
note: >-
  The promise was made about routing between GPT-5's own models. The first
  real test was the safety router, and there the standard became "when asked."
  Marked eroded rather than broken: this record could not confirm whether the
  promised UI label shipped for ordinary GPT-5 routing.
