title: OpenAI drops plan to end nonprofit control, after outside pressure
date: 2025-05-05
org: openai
type: did
kind: reversal
who: [ openai, bret-taylor, sam-altman ]
summary: >-
  After more than a year of pursuing a restructuring that would have loosened
  the nonprofit's control, OpenAI said the nonprofit would stay in control of a
  new public benefit corporation. Board chair Bret Taylor said the decision
  followed input from civic leaders and talks with the attorneys general of
  Delaware and California.
related: [ 2015-12-11-founded-as-nonprofit, 2019-03-11-capped-profit-lp ]
patterns: [ mission-to-market ]
