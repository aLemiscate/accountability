updates:
  - date: 2025-05-08
    text: >-
      Three days later, asked at a Senate hearing what went into the decision,
      Altman said: "We never planned to have the nonprofit convert into
      anything. The nonprofit was always going to be the nonprofit, and we also
      planned for a PBC from the very beginning." The question in dispute had
      been whether the nonprofit would keep control of the business, not whether
      it would continue to exist.
    sources:
      - title: 'S. Hrg. 119-143, Winning the AI Race: Strengthening U.S. Capabilities in
          Computing and Innovation'
        publisher: U.S. Government Publishing Office
        url: https://www.govinfo.gov/content/pkg/CHRG-119shrg61426/html/CHRG-119shrg61426.htm
        date: 2025-05-08
        type: primary
        archive: https://web.archive.org/web/20260731062002/https://www.govinfo.gov/content/pkg/CHRG-119shrg61426/html/CHRG-119shrg61426.htm
        snapshot: snapshots/2026-10-07-govinfo.gov-efb619ad
note: >-
  Credit where it's due: the plan changed. But look at what changed it: critics,
  former employees, and two state attorneys general, not the company's own
  principles.
