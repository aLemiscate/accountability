title: OpenAI drops plan to end nonprofit control, after outside pressure
date: 2025-05-05
org: openai
type: did
kind: reversal
who: [openai, bret-taylor, sam-altman]
summary: >-
  After more than a year of pursuing a restructuring that would have
  loosened the nonprofit's control, OpenAI said the nonprofit would stay in
  control of a new public benefit corporation. Board chair Bret Taylor said
  the decision followed input from civic leaders and talks with the
  attorneys general of Delaware and California.
related: [2015-12-11-founded-as-nonprofit, 2019-03-11-capped-profit-lp]
patterns: [mission-to-market]
sources:
  - title: OpenAI reverses course, says its nonprofit will remain in control of its business operations
    publisher: TechCrunch
    url: https://techcrunch.com/2025/05/05/openai-reverses-course-says-its-nonprofit-will-remain-in-control-of-its-business-operations/
    date: 2025-05-05
    type: reporting
  - title: OpenAI says nonprofit will retain control of company, bowing to outside pressure
    publisher: CNBC
    url: https://www.cnbc.com/2025/05/05/openai-says-nonprofit-retain-control-of-company-bowing-to-pressure.html
    date: 2025-05-05
    type: reporting
note: >-
  Credit where it's due: the plan changed. But look at what changed it:
  critics, former employees, and two state attorneys general, not the
  company's own principles.
