title: 'Altman''s GPT-5 roadmap: free users "will get unlimited chat access to
  GPT-5 at the standard intelligence setting"'
date: 2025-02-12
org: openai
type: said
kind: commitment
who: [sam-altman, openai]
venue: '"OpenAI roadmap update for GPT-4.5 and GPT-5," post on X'
quote: >-
  The free tier of ChatGPT will get unlimited chat access to GPT-5 at the
  standard intelligence setting (!!), subject to abuse thresholds.
summary: >-
  In February 2025 Altman set out a roadmap for GPT-5. OpenAI would "return to
  magic unified intelligence" in place of the model picker ("We hate the model
  picker as much as you do"), would "no longer ship o3 as a standalone model,"
  and would give free users unlimited GPT-5 chat. Each part changed. On April 4
  Altman announced a "change of plans": o3 and o4-mini would ship on their own,
  and GPT-5 would come "in a few months." GPT-5 launched on Aug. 7, 2025 as a
  system with a real-time router choosing between models, and free users got
  up to 10 GPT-5 messages every five hours before falling back to GPT-5 mini,
  BGR reported. Six days after launch the model picker was back, with "Auto,"
  "Fast" and "Thinking" settings and older models restored for paid users. In
  August 2026 OpenAI removed limits on text chats for free users, with its
  GPT-5.6 Luna model as the default.
concreteness: measurable
status: kept
patterns: [coming-weeks]
