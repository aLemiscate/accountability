response: >-
  Altman gave his reasons for the April change at the time: "we are going to
  be able to make GPT-5 much better than we originally though. we also found it
  harder than we thought it was going to be to smoothly integrate everything."
note: >-
  Kept, eighteen months after it was promised and a year after GPT-5 shipped
  with a ten-message cap for free users. The roadmap's other two promises, one
  model in place of the picker and no standalone o3, were dropped openly.
