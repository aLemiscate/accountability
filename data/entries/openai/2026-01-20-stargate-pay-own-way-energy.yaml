title: 'Standing promise: Stargate will "pay our own way on energy" so local
  power bills don''t rise'
date: 2026-01-20
org: openai
type: said
kind: commitment
who: [openai]
venue: Blog post, "Stargate Community"
quote: >-
  Across all of our Stargate Community plans, we commit to paying our own way on
  energy, so that our operations don’t increase your electricity prices.
summary: >-
  As public concern grew about data centers driving up electricity prices,
  OpenAI said each Stargate site would come with a community plan. It would fund
  the new generation, transmission and grid upgrades its campuses need, or build
  its own off-grid power, and run its data centers as flexible loads that cut
  grid use when the grid is stressed. It cited partner arrangements in
  Wisconsin, Michigan and Texas.
concreteness: measurable
status: open
breaks_if: >-
  A utility commission, utility filing or credible analysis finds that a
  Stargate site raised electricity rates for other customers, or that grid costs
  for a site were passed to ratepayers.
patterns: []
related: [2026-02-11-anthropic-cover-electricity-prices, 2025-05-22-stargate-uae]
