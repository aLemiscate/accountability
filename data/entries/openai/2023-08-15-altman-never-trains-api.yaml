title: 'Altman: "openai never trains on anything ever submitted to the api"'
date: 2023-08-15
org: openai
type: said
kind: claim
who: [sam-altman, openai]
venue: Post on X
quote: >-
  openai never trains on anything ever submitted to the api or uses that data to
  improve our models in any way.
summary: >-
  Five months earlier, on March 1, 2023, OpenAI had changed its API terms so
  that data sent through the API would not be used for "service improvements,"
  including model training, unless a customer opted in. Altman announced that
  change himself: "data submitted to the OpenAI API is not used for training."
  OpenAI's own documentation dates the protection: "As of March 1, 2023, data
  sent to the OpenAI API is not used to train or improve OpenAI models."
  OpenAI's own 2022 InstructGPT paper, the method behind ChatGPT, says its training data started from "prompts submitted through the OpenAI API," from people using earlier models in the API Playground, who "were informed that their data could be used to train further models"; the paper says it did not use data from customers using the API in production. TechCrunch reported that developers had "long taken issue" with the previous
  policy, and Maginative, reporting on OpenAI's clarifications, wrote that API
  data submitted before that date "could have been incorporated into model
  training." Altman's August statement, "never ... ever," covered only the
  policy from March 2023 on.
concreteness: measurable
status: contradicted
