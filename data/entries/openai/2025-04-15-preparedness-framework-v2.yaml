title: 'Preparedness Framework v2: persuasion dropped, a "competitor" clause added'
date: 2025-04-15
org: openai
type: did
kind: revision
who: [ openai ]
quote: >-
  If another frontier AI developer releases a high-risk system without
  comparable safeguards, we may adjust our requirements.
summary: >-
  The updated framework dropped persuasion as a tracked risk category (handling
  it instead through usage policies and the Model Spec), collapsed the risk
  levels to "High" and "Critical," and added language allowing OpenAI to lower
  its own requirements if a rival ships a high-risk system without comparable
  safeguards.
contradicts: [ 2018-04-09-charter-stop-competing-clause ]
patterns: [ race-clause ]
sources:
  - title: Our updated Preparedness Framework
    publisher: OpenAI
    url: https://openai.com/index/updating-our-preparedness-framework/
    date: 2025-04-15
