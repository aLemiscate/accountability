    date: 2025-04-15
    type: primary
    archive: https://web.archive.org/web/20260928222120/https://cdn.openai.com/pdf/18a02b5d-6b67-4cec-ab64-68cdfbddebcd/preparedness-framework-v2.pdf
    snapshot: snapshots/2026-09-29-cdn.openai.com-ec5d8e7d
  - title: OpenAI says it may adjust its safety requirements if a rival lab releases
      'high-risk' AI
    publisher: TechCrunch
    url: https://techcrunch.com/2025/04/15/openai-says-it-may-adjust-its-safety-requirements-if-a-rival-lab-releases-high-risk-ai/
    date: 2025-04-15
    type: reporting
    archive: https://web.archive.org/web/20260929215725/https://techcrunch.com/2025/04/15/openai-says-it-may-adjust-its-safety-requirements-if-a-rival-lab-releases-high-risk-ai/
    snapshot: snapshots/2026-09-29-techcrunch.com-e44878a8
response: >-
  OpenAI said any adjustment would require first confirming the risk landscape
  had actually changed, acknowledging the change publicly, assessing that it
  doesn't meaningfully raise overall risk of severe harm, and keeping safeguards
  more protective than the rival's.
note: >-
  In 2018 the answer to a reckless competitor was to stop and help. By 2025 it
  was to match them, with conditions OpenAI grades for itself.
