response: >-
  An OpenAI spokesperson told the Journal: "We have parted ways with three
  individuals for violating our policies on accessing and handling sensitive
  company information. Our investigation confirmed that these individuals
  mishandled sensitive information outside established company procedures,
  violating our policies and breaking the trust essential to our work."
note: >-
  Too new to judge. In 2024 OpenAI said its whistleblower policy "protects
  employees' rights to make protected disclosures." Whether this was a leak or
  a protected disclosure depends on facts not yet public: what was shared, with
  whom, and whether internal channels were tried first.
