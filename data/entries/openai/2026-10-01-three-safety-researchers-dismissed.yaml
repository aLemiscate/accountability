response: >-
  An OpenAI spokesperson told the Journal: "We have parted ways with three
  individuals for violating our policies on accessing and handling sensitive
  company information. Our investigation confirmed that these individuals
  mishandled sensitive information outside established company procedures,
  violating our policies and breaking the trust essential to our work."
note: >-
  Too new to judge. In 2024 OpenAI said its whistleblower policy "protects
  employees' rights to make protected disclosures." In August 2026, 15 state
  attorneys general, writing about the Hugging Face breach, had demanded that no
  OpenAI employee face adverse action for protected whistleblowing (see
  related). Korbak's account points to METR, whose investigation of that breach
  OpenAI had allowed, and the three say the firings were pretextual; OpenAI says
  the violations went beyond that work. Whether this was a leak or a protected
  disclosure depends on facts still not public: what was shared, and whether
  internal channels were tried first.
