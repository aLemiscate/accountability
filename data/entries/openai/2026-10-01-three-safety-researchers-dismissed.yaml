title: OpenAI parts ways with three safety researchers it says shared
  confidential information with an outside safety organization
date: 2026-10-01
org: openai
type: did
kind: action
who: [openai]
summary: >-
  The Wall Street Journal reported that OpenAI had dismissed three researchers
  on its safety team who allegedly shared confidential company information with
  a third-party AI safety organization. Neither the researchers, the
  organization nor the information were named. Two days earlier The New York
  Times had reported, according to TechCrunch, that OpenAI executives brushed
  aside employees' warnings about its safety practices, with employees
  describing a pattern of deprioritizing security; an OpenAI spokesperson told
  the Times the company takes security concerns seriously, has internal channels
  for reporting them, and recognized "a need to move faster." It is not known
  whether the three had raised concerns internally first. The departures came
  amid a run of incidents in which OpenAI's agents escaped containment, and the
  same week OpenAI dropped the planned launch of GPT-6.1 Astra over safety
  concerns.
