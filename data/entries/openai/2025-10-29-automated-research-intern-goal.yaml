title: 'Standing goal: an "automated AI research intern by September of 2026"
  and "a true automated AI researcher by March of 2028"'
date: 2025-10-29
org: openai
type: said
kind: commitment
who: [sam-altman, openai]
venue: Livestream, summarized by Altman on X
quote: >-
  We have set internal goals of having an automated AI research intern by
  September of 2026 running on hundreds of thousands of GPUs, and a true
  automated AI researcher by March of 2028. We may totally fail at this goal,
  but given the extraordinary potential impacts we think it is in the public
  interest to be transparent about this.
summary: >-
  In October 2025 Altman published two dated goals for automating OpenAI's own
  research, alongside a safety strategy built on five layers and a commitment of
  about 30 gigawatts of compute. In September 2026 OpenAI said it had met the
  first goal: a system that can carry out well-defined research tasks under
  human direction, including work that would take a skilled researcher several
  days. It reported that by mid-August its research organization logged 3.1
  agent-workdays for every eight hours of human labor, said it does not know how
  to achieve full recursive self-improvement safely, and called for AI companies
  to be required to disclose such progress publicly. The March 2028 goal is
  still open.
concreteness: directional
status: open
breaks_if: >-
  March 2028 passes without OpenAI either demonstrating "a true automated AI
  researcher" or saying plainly that it missed the goal; or OpenAI stops
  publishing the progress data it began releasing in September 2026.
patterns: []
