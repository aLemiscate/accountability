updates:
  - date: 2026-10-12
    text: >-
      Two weeks after the promise, Sottiaux polled Pro users ("Pro users, would
      you rather have"; the options are not in the archived copy) and then wrote
      of the result: "I definitely thought it would sway much more favorably in
      the 2X direction across Pro 100/200/500 at the cost of bringing back 5h
      limits in order to smoothen the demand curve." The five-hour limit has not
      come back, but bringing it back was put to users as one side of a trade.
    sources:
      - title: Thibault Sottiaux on Twitter/X ("The results of this poll has gotten me
          confused")
