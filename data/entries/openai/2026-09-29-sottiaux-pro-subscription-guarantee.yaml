note: >-
  The five-hour promise is checkable; the "more work done" guarantee is harder,
  since OpenAI publishes no dollar figure for the allowance and measures value
  in its own API prices. Sottiaux's post was a trade stated openly: a smaller
  allowance in exchange for no five-hour cap and cheaper models.
