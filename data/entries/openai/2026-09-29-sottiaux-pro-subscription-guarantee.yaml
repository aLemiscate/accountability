title: 'OpenAI halves the $200 Pro allowance and promises: "we guarantee that
  over time you always get more work done"'
date: 2026-09-29
org: openai
type: said
kind: commitment
who: [openai]
venue: Post on Twitter/X by Thibault Sottiaux
quote: >-
  We didn't want to compromise in other ways and are committing to not
  reintroducing the 5h limit, so that you can fully use the weekly usage when
  you want.
summary: >-
  Reopening the $200 Pro plan to new subscribers after a three-week pause,
  OpenAI's Thibault Sottiaux said usage would now "net out at half the dollar in
  API spend compared to the old Pro $200 plan." He made two promises in the same
  post: no return of the five-hour limit, and "On the subscription, we guarantee
  that over time you always get more work done and with an increasing level of
  quality," because models get more efficient and OpenAI passes savings on "in
  the form of API price reductions." A week earlier OpenAI had released GPT-6
  Sol and Luna at "half of the previous generation’s API prices."
concreteness: measurable
status: open
last_checked: 2026-10-13
breaks_if: >-
  OpenAI brings back a five-hour usage limit on the $200 Pro plan, or a Pro
  subscriber gets less work for the same price in a later change without a
  matching price cut or model improvement.
patterns: [shrinking-plan]
related: [2026-06-chatgpt-pro-unlimited-allowances, 2025-07-28-claude-weekly-limits]
