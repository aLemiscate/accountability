title: 'Superalignment team dissolved; its leader says safety took "a backseat
  to shiny products"'
date: 2024-05-17
org: openai
type: did
kind: outcome
who: [jan-leike, ilya-sutskever, openai]
quote: >-
  But over the past years, safety culture and processes have taken a backseat to
  shiny products.
summary: >-
  Days after Sutskever left, Jan Leike resigned and posted that he had been
  disagreeing with leadership about the company's core priorities "for quite
  some time." OpenAI dissolved the team and folded its work into other research
  groups, Bloomberg reported. Fortune then reported that the promised 20% of
  compute never arrived: the team's requests for extra GPUs were repeatedly
  turned down, and there were no clear terms for how the 20% would be counted.
contradicts: [2023-07-05-superalignment-20-percent-compute]
patterns: [pledged-not-resourced]
