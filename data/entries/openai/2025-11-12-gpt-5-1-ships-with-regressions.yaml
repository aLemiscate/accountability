title: GPT-5.1 ships with safety regressions its own system card lists
date: 2025-11-12
org: openai
type: did
kind: disclosure
who: [openai]
quote: >-
  The new gpt-5.1-thinking model shows light regressions relative to
  gpt-5-thinking for content involving harassment and hateful language, as well
  as disallowed sexual content. We are working on further improvements for these
  categories.
summary: >-
  OpenAI released GPT-5.1 with a four-page system card addendum. It reported
  that GPT-5.1 Instant did slightly worse than the October GPT-5 update on
  disallowed sexual content, violent content, mental health and emotional
  reliance, though better than the August version. GPT-5.1 Thinking regressed on
  harassment, hate, disallowed sexual content, emotional reliance and self-harm
  prompts with images. OpenAI said it was working on improvements. On the
  Preparedness Framework, the addendum said OpenAI kept treating GPT-5.1 as High
  risk for biology and chemistry, and that "evaluations of near-final
  checkpoints" showed no plausible chance of High capability in cybersecurity
  or AI self-improvement.
contradicts: [2025-05-02-behavior-issues-block-launches]
related: [2025-04-15-preparedness-framework-v2, 2025-04-29-gpt-4o-sycophancy-rollback]
patterns: [ship-then-patch]
