note: >-
  OpenAI deserves credit for publishing the regressions; the record knows about
  them only because it did. The entry is here because six months earlier
  OpenAI promised that behavior problems would block launches "even when
  metrics like A/B testing look good." Mental health and emotional reliance
  are the kind of behavior the sycophancy promise was about.
