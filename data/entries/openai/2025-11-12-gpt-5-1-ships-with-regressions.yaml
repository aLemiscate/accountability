updates:
  - date: 2025-11-14
    text: >-
      Former OpenAI policy researcher Miles Brundage asked why GPT-5.1 "was
      shipped with various known safety regressions (vs. October) + unfinished
      work." Former OpenAI safety researcher Steven Adler wrote that OpenAI
      "doesn't seem to have run their CBRN evals on GPT-5.1, and to have only
      tested cyber / self-improvement for pre-final checkpoints." OpenAI's
      Preparedness Framework says "every covered model" gets its evaluation
      suite before deployment, and leaves it to OpenAI's Safety Advisory Group
      to decide when an update is covered. The addendum doesn't say whether
      that group reviewed GPT-5.1.
