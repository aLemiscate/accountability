title: Leaked exit documents carry the signatures of Altman and Kwon
date: 2024-05-22
org: openai
type: did
kind: disclosure
who: [sam-altman, jason-kwon, openai]
summary: >-
  Vox published leaked documents showing high-pressure tactics toward departing
  employees: short deadlines to sign broad non-disparagement and non-disclosure
  terms, backed by threats to vested equity. Company documents bearing the
  signatures of Altman and Chief Strategy Officer Jason Kwon undercut the claim
  that leadership hadn't known.
contradicts: [2024-05-18-altman-did-not-know]
patterns: [pressure-on-critics, sorry-after-caught]
sources:
  - title: Leaked OpenAI documents reveal aggressive tactics toward former employees
      (Vox, via X)
    publisher: Vox
    url: https://x.com/voxdotcom/status/1793402141433901192
    date: 2024-05-22
    type: reporting
    snapshot: snapshots/2026-09-29-x.com-3b1f9f69
  - title: How OpenAI Used Equity to Silence Dissent
    publisher: Gizmodo
    url: https://gizmodo.com/openai-sam-altman-chatgpt-employee-dissent-ndas-1851496211
    type: reporting
    archive: https://web.archive.org/web/20260804001440/https://gizmodo.com/openai-sam-altman-chatgpt-employee-dissent-ndas-1851496211
response: >-
  An OpenAI spokesperson said: "We're incredibly sorry that we're only changing
  this language now; it doesn't reflect our values or the company we want to
  be."
updates:
  - date: 2024-05-24
    text: >-
      OpenAI released former employees from the agreements: "OpenAI has not
      canceled, and will not cancel, any Vested Units," and it would not enforce
      other non-disparagement terms.
    sources:
      - title: OpenAI sends internal memo releasing former employees from controversial
          exit agreements
        publisher: CNBC
        url: https://www.cnbc.com/2024/05/24/openai-sends-internal-memo-releasing-former-employees-from-non-disparagement-agreements-sam-altman.html
        date: 2024-05-24
        type: reporting
        archive: https://web.archive.org/web/20260929215144/https://www.cnbc.com/2024/05/24/openai-sends-internal-memo-releasing-former-employees-from-non-disparagement-agreements-sam-altman.html
        snapshot: snapshots/2026-09-29-cnbc.com-a6fde255
  - date: 2024-06-04
    text: >-
      Thirteen current and former AI lab employees, eleven of them from OpenAI
      and six anonymous, published "A Right to Warn about Advanced Artificial
      Intelligence," asking companies not to enter into or enforce
      non-disparagement agreements over risk-related concerns and to create
      anonymous channels for raising them. An OpenAI spokeswoman said: "We're
      proud of our track record providing the most capable and safest A.I.
      systems and believe in our scientific approach to addressing risk."
    sources:
      - title: A Right to Warn about Advanced Artificial Intelligence
        publisher: righttowarn.ai
        url: https://righttowarn.ai/
        date: 2024-06-04
        type: primary
        snapshot: snapshots/2026-09-30-righttowarn.ai-f1494f4b
      - title: Employees Say OpenAI and Google DeepMind Are Hiding Dangers From the
          Public
        publisher: TIME
        url: https://time.com/6985504/openai-google-deepmind-employees-letter/
        date: 2024-06-04
        type: reporting
        snapshot: snapshots/2026-09-30-time.com-2ce3a2d7
  - date: 2024-06-24
    text: >-
      Former employees had warned that OpenAI could still limit their ability to
      sell shares; Jacob Hilton asked it to promise "equal access to liquidity,
      in a legally enforceable way." CNBC reported earlier documents showing
      former employees sold months after current staff and in at least two
      tender offers were capped at $2 million against $10 million, and that
      ex-employees at competitors were excluded. In June OpenAI changed the
      rules: "all sellers (current and former service providers) will have the
      same sales limit," and it "will not enforce any provision in employee
      equity documents that forces equity redemption at fair market value."
      Former employees at competitors were no longer excluded.
    sources:
      - title: Jacob Hilton on X ("equal access to liquidity, in a legally enforceable
          way")
        publisher: X
        url: https://x.com/JacobHHilton/status/1794090561294467074
        date: 2024-05-24
        type: primary
        snapshot: snapshots/2026-10-03-x.com-d25baa1e
      - title: OpenAI walks back controversial stock sale policies, will treat current
          and former employees the same
        publisher: CNBC (via NBC Chicago)
        url: https://www.nbcchicago.com/news/business/money-report/openai-walks-back-controversial-stock-sale-policies-will-treat-current-and-former-employees-the-same/3471318/
        date: 2024-06-24
        type: reporting
        archive: https://web.archive.org/web/20261003134550/https://www.nbcchicago.com/news/business/money-report/openai-walks-back-controversial-stock-sale-policies-will-treat-current-and-former-employees-the-same/3471318/
        snapshot: snapshots/2026-10-03-nbcchicago.com-e118834a
  - date: 2024-07-23
    text: >-
      In a public summary of its safety practices, OpenAI said: "Our
      whistleblower policy protects employees' rights to make protected
      disclosures. We also believe rigorous debate about this technology is
      important and have made changes to our departure process to remove
      non-disparagement terms."
    sources:
      - title: OpenAI on X
        publisher: X
        url: https://x.com/OpenAI/status/1815708160818356334
        date: 2024-07-23
        type: primary
        snapshot: snapshots/2026-09-30-x.com-0d896691
note: >-
  The fix was real, and it came six days after the story broke. That timing is
  the pattern.
