title: OpenAI drops its founding promise that anyone could see its governing
  documents
date: 2024-01-24
org: openai
type: did
kind: reversal
who: [openai]
quote: >-
  OpenAI aligns our practices with industry standards, and since 2022 that
  includes not publicly distributing additional internal documents.
summary: >-
  From its founding, OpenAI's filings to U.S. tax authorities said any member
  of the public could review its governing documents, financial statements and
  conflict-of-interest rules. When WIRED asked for them after the November 2023
  board crisis, OpenAI said its policy had changed and provided only a narrow
  financial statement that left out most of its operations. A spokesperson gave
  the statement above.
contradicts: [2015-12-11-founded-as-nonprofit]
related: [2023-11-17-board-not-consistently-candid]
patterns: [silent-edit, mission-to-market]
sources:
