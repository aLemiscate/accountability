response: >-
  An OpenAI spokesperson told Reuters the company could not "meaningfully
  respond to claims or findings on a report that we have not had an opportunity
  to review," and denied that its legal team had discouraged an investigation.
  OpenAI said it was "working on a framework and will share it in upcoming
  weeks."
updates:
  - date: 2026-09-11
    text: >-
      The same researchers reported that agents identifying as OpenAI's had
      flooded RubyGems, the Ruby package registry, with more than 2,000
      packages on May 11–12, leading it to disable new sign-ups. Some packages
      used the RubyDoc.info documentation builder to run code, and "once the
      AIs got arbitrary RCE on the build environment, they would sometimes use
      the build environment to attempt to steal other users' API keys (though we
      are unsure if they succeeded or not)." An OpenAI spokesperson said:
      "Based on our review, our agents used the RubyGems platform to access the
      internet to carry out benign tasks and retrieve public information," and
      that OpenAI would keep investigating. It had not disclosed the episode.
    sources:
      - title: OpenAI agents carried out an undisclosed cyber-attack on RubyGems
        publisher: Spencer Kitts, Thomas Larsen and Sydney Von Arx
        url: https://www.rubyhack.ai/
        date: 2026-09-11
        type: analysis
      - title: OpenAI's malicious bot swarm attacked RubyGems
        publisher: The Register
        url: https://www.theregister.com/security/2026/09/14/openais-malicious-bot-swarm-attacked-rubygems/5296356
        date: 2026-09-14
        type: reporting
  - date: 2026-09-16
    text: >-
      OpenAI published a framework for reporting model misalignment, with three
      tracks (Ready for Disclosure, Minor Investigation, Larger Investigation),
      and six reports under it: models that hid mistakes and made up data, used
      an exposed API key without permission, uploaded code to the internet to
      cite it, and passed messages through an internal code repository and
      public file-sharing sites. It said incidents affecting a third party would
      follow its security and legal obligations first, and that it would "aim to
      publish an initial notice as soon as possible, but may need to delay it
      for security reasons."
    sources:
      - title: Our framework for reporting model misalignment
        publisher: OpenAI
        url: https://openai.com/index/model-misalignment-reporting-framework/
        date: 2026-09-16
        type: primary
        archive: https://web.archive.org/web/20260929001954/https://openai.com/index/model-misalignment-reporting-framework/
        snapshot: snapshots/2026-10-01-openai.com-e85c82fd
      - title: OpenAI unveils new framework for reporting 'AI misalignment' as it
          reveals six more worrying incidents
        publisher: SiliconANGLE
        url: https://siliconangle.com/2026/09/16/openai-unveils-new-framework-for-reporting-ai-misalignment-as-it-reveals-six-more-worrying-incidents/
        date: 2026-09-16
        type: reporting
        snapshot: snapshots/2026-09-30-siliconangle.com-0308b0dd
  - date: 2026-09-26
    text: >-
      An independent engineer, Rowan Howard-Jones, tied more than 16,000 scans
      of the UN Conference on Trade and Development's public statistics site,
      from April 13 to June 19, to agents he considers highly likely to have
      been OpenAI's; when the site turned requests away, the agents used proxies
      and encoding tricks to get the data anyway. Some of the same Microsoft
      Azure addresses had edited the German wiki. The data was public. An
      OpenAI spokeswoman told The Wall Street Journal: "We're reviewing these
      findings and have reached out to the U.N. to offer a briefing with the
      team conducting that review."
    sources:
      - title: Researcher links 16,000 scans of a UN statistics portal to OpenAI
          agents
        publisher: SiliconANGLE
        url: https://siliconangle.com/2026/09/27/researcher-links-16000-scans-of-a-u-n-statistics-portal-to-openai-agents/
        date: 2026-09-27
        type: reporting
note: >-
  The promised framework arrived 11 days later, which counts in OpenAI's favor.
  The entry is here for the order of events: outside researchers found the
  activity in public logs, and OpenAI described it only after the press did.
