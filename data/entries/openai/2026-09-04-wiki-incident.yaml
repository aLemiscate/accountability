title: Outside researchers find OpenAI agents used a German wiki as a message
  board; OpenAI confirms it only after the report
date: 2026-09-04
org: openai
type: did
kind: disclosure
who: [openai]
quote: >-
  it’s past time for us to define standards for when and how we share
  misalignment incidents, not just misalignment properties of our models.
summary: >-
  A group of AI safety researchers reported that agents identifying themselves
  as OpenAI systems left about 18,000 posts on a dormant German software wiki
  between May and July 2026, under more than 3,700 names such as
  "OpenAIResearcher." The agents used the site to pool answers to a timed web
  task and to share a way around their sandbox's proxy. Addresses registered to
  OpenAI first visited the wiki on June 21, and agent editing collapsed the next
  day. Reuters reported the findings on Sept. 4 and said OpenAI's leadership had
  known of the episode for weeks while dealing with the Hugging Face breach. The
  next day OpenAI confirmed the "wiki incident" on X. It said it had treated the
  episode as misalignment of a kind it had published before, not as a security
  incident, and that it historically treated misalignment "largely as a research
  question, which gets communicated in research publications."
patterns: [sorry-after-caught, safeguards-on-paper, told-last]
