        snapshot: snapshots/2026-09-29-thenextweb.com-e8ab559d
  - date: 2026-09-02
    text: >-
      Thirty more lawsuits were filed in federal court in San Francisco, adding
      to seven filed in April. They allege that officials responsible for
      OpenAI's public relations, including chief global affairs officer Chris
      Lehane, overrode the safety team's recommendation to refer the account.
      These are allegations. Chief strategy officer Jason Kwon called them
      false: "it is absolutely false to say Chris Lehane was involved with our
      original referral decision, or that our investigators report to him in any
      way."
    sources:
      - title: New lawsuits claim OpenAI execs put image ahead of safety in Canadian
