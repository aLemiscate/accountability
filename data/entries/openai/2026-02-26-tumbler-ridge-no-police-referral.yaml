response: >-
  OpenAI's vice president for global policy, Ann O'Leary, wrote that "under our
  enhanced law enforcement referral protocol, we would refer the account banned
  in June 2025 to law enforcement if it were discovered today," and said OpenAI
  would set up a direct point of contact with Canadian law enforcement.
updates:
  - date: 2026-04-23
    text: >-
      Altman wrote an open letter to the Tumbler Ridge community: "I am deeply
      sorry that we did not alert law enforcement to the account that was banned
      in June."
    sources:
      - title: OpenAI knew. It chose not to call the police. Now Sam Altman is sorry.
        publisher: The Next Web
        url: https://thenextweb.com/news/sam-altman-openai-apology-tumbler-ridge-shooting
