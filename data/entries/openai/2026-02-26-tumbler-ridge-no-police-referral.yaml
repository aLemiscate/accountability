title: 'Tumbler Ridge: OpenAI banned the shooter''s ChatGPT account months
  earlier but did not alert police'
date: 2026-02-26
org: openai
type: did
kind: disclosure
who: [openai, sam-altman]
quote: >-
  Based on what we could see at that time the account was banned in June 2025,
  we did not identify credible and imminent planning that met our threshold to
  refer the matter to law enforcement
summary: >-
  In June 2025, OpenAI's automated systems flagged a ChatGPT account for
  conversations describing gun violence, and after human review the company
  banned it. According to reporting first by The Wall Street Journal, some of
  the roughly dozen employees who reviewed the account recommended telling
  Canadian police, and company leaders decided it did not meet OpenAI's
  threshold. On Feb. 10, 2026, the account's owner killed eight people in
  Tumbler Ridge, British Columbia. In a letter to Canada's AI minister, OpenAI
  confirmed the ban and said the shooter had evaded it with a second account,
  which it found only after police released her name. OpenAI's published policy,
  from August 2025, was that "if human reviewers determine that a case involves
  an imminent threat of serious physical harm to others, we may refer it to law
  enforcement."
patterns: [sorry-after-caught]
