title: 'Standing promise: OpenAI pauses frontier RL training and will "act
  unilaterally" on safety'
date: 2026-08-18
org: openai
type: said
kind: commitment
who: [sam-altman, openai]
venue: Post on X and OpenAI blog post
quote: >-
  We have paused some frontier RL training to ensure that we can meet the
  appropriate alignment, security and monitoring standards for the new level of
  capabilities in front of us.
summary: >-
  Four weeks after the Hugging Face incident, OpenAI said it had "temporarily
  slowed the pace of scaling," including a two-week pause in reinforcement
  learning training, and that its largest planned RL run remained on hold. It
  also pointed to a finding that its next model, Astra, may have "critical"
  cyber capabilities under its Preparedness Framework. Altman added, as quoted
  by The Hill: "We believe the entire field will have to coordinate on shared
  safety standards, but will act unilaterally in the meantime." Three weeks
  earlier OpenAI had written that "at some point in the future, AI acceleration
  for frontier model development may be so high that the world will need to pace
  the rate of AI advancement."
concreteness: conditional
status: open
breaks_if: >-
  The held-back frontier RL run resumes at scale without the published safety
  case or evidence of alignment OpenAI said it would first establish; OpenAI
  cites a competitor's pace to lift a pause or skip a safeguard; or the
  "unilateral" commitment is made conditional on others acting first.
patterns: []
