  - date: 2026-09-29
    text: >-
      CNBC reported that OpenAI had postponed the release of its GPT-6.1 Astra
      model over safety concerns. The same day, OpenAI president Greg Brockman
      signed a voluntary "White House Accord on Super Intelligence" with other
      AI CEOs; the White House posted its text that evening (see
      2026-09-29-white-house-accord).
