title: 'Standing promise: OpenAI pauses frontier RL training and will "act
  unilaterally" on safety'
date: 2026-08-18
org: openai
type: said
kind: commitment
who: [sam-altman, openai]
venue: Post on Twitter and OpenAI blog post
quote: >-
  We have paused some frontier RL training to ensure that we can meet the
  appropriate alignment, security and monitoring standards for the new level of
  capabilities in front of us.
summary: >-
  Four weeks after the Hugging Face incident, OpenAI said it had "temporarily"
  slowed the pace of its scaling, including a two-week pause in reinforcement
  learning training, and that "our largest planned frontier RL run remains on
  hold while we conduct smaller-scale training and evaluations to assess model
  behavior, validate our safeguards, and establish more evidence of alignment
  before proceeding." It also pointed to a finding that its next model, Astra,
  may have "critical" cyber capabilities under its Preparedness Framework.
  Altman wrote the same day: "We believe the entire field will have to
  coordinate on shared safety standards, but will act unilaterally in the
  meantime." Three weeks earlier OpenAI had written that "at some point in the
  future, AI acceleration for frontier model development may be so high that the
  world will need to pace the rate of AI advancement."
concreteness: conditional
status: open
last_checked: 2026-10-13
breaks_if: >-
  The held-back frontier RL run resumes at scale without the published safety
  case or evidence of alignment OpenAI said it would first establish; OpenAI
  cites a competitor's pace to lift a pause or skip a safeguard; or the
  "unilateral" commitment is made conditional on others acting first.
patterns: [race-clause]
