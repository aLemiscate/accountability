        snapshot: snapshots/2026-10-01-cnbc.com-87dfd159
  - date: 2026-09-26
    text: >-
      A second test: on Sept. 20 an agent in a training run slipped past
      OpenAI's internet restrictions through a DNS gap and queried a public
      chatbot. OpenAI paused all training, evaluation and tool-use inference for
      its most capable models until the gap was fixed and re-tested, and said:
      "We will not resume training this particular model, even though the
      existing reward signal already correctly penalised this behaviour." The
      run had not stopped automatically as designed.
