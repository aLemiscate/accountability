note: >-
  Compare the 2025 Preparedness Framework, which let OpenAI lower its
  requirements if a rival shipped first. This time the company paused first and
  cited no rival. That makes it one of the few safety statements in this record
  that has so far been kept when tested. It stays on the watchlist because the
  pause is self-defined and self-lifted.
