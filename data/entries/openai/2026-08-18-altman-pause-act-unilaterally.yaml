updates:
  - date: 2026-09-14
    text: >-
      After Dario Amodei's essay calling for the industry to "pace the
      frontier," Altman wrote that "Committing to having independent evaluators
      with employee-like access is a great idea, and we will do the same." Two
      days later he wrote: "We welcome a federal framework that sets consistent
      safety requirements for frontier AI … no amount of American competitive
      pressure should justify recklessness." He added that "pacing" does not
      mean "stopping."
