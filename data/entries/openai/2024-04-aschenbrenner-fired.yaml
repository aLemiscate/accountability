    snapshot: snapshots/2026-09-30-x.com-2060001d
response: >-
  An OpenAI spokesperson said the concerns he raised internally and to the
  board "did not lead to his separation," and: "While we share his commitment
  to building safe AGI, we disagree with many of the claims he has since made
  about our work."
note: >-
  Only Aschenbrenner's account and OpenAI's denial are public. A year earlier
  he had argued publicly that AGI needed "'nuclear secrets' rather than
  'random startup'-level security."
