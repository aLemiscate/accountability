title: 'Safety researcher who warned the board about security is fired;
  he says the memo was "a major reason"'
date: 2024-04
org: openai
type: did
kind: action
who: [openai]
summary: >-
  OpenAI fired Leopold Aschenbrenner, a researcher on its Superalignment team,
  in April 2024, alleging he had leaked information. In a June 2024 interview,
  Aschenbrenner said he had written a memo calling OpenAI's security
  "egregiously insufficient" to stop foreign actors stealing model weights or
  algorithmic secrets. After what he called "a major security incident," he
  shared it with a couple of board members and received an official HR warning. He said
  that when he was fired, "it was made very explicit that the security memo was
  a major reason." He said the alleged leak was a brainstorming document on
  safety and security measures, checked for sensitive material and shared with
  three outside researchers, which he said was normal at OpenAI at the time.
  He also said a company lawyer had asked him about his views on AGI and
  security, and whether he and the Superalignment team "were loyal to the
  company."
related: [2023-04-breach-kept-private, 2024-05-17-superalignment-team-disbanded, 2024-05-22-exit-documents-signed]
patterns: [pressure-on-critics]
