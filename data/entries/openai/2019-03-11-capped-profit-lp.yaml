title: OpenAI creates a for-profit arm with investor returns "capped" at 100x
date: 2019-03-11
org: openai
type: did
kind: revision
who: [ openai ]
summary: >-
  OpenAI created OpenAI LP, a "capped-profit" company controlled by the
  nonprofit. First-round investors' returns were capped at 100x their
  investment, and anything above the cap would go to the nonprofit. OpenAI said
  it needed the structure to raise capital for compute and to recruit.
contradicts: [ 2015-12-11-founded-as-nonprofit ]
patterns: [ mission-to-market ]
