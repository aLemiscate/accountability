title: 'Altman restores GPT-4o after the GPT-5 backlash: "If we ever do
  deprecate it, we will give plenty of notice"'
date: 2025-08-13
org: openai
type: said
kind: commitment
who: [sam-altman, openai]
venue: '"Updates to ChatGPT," post on X'
quote: >-
  4o is back in the model picker for all paid users by default. If we ever do
  deprecate it, we will give plenty of notice.
summary: >-
  OpenAI removed GPT-4o and other older models from ChatGPT when GPT-5 launched
  on Aug. 7, 2025, without advance notice to subscribers. After users objected,
  Altman said Plus users could keep using GPT-4o and that OpenAI would "watch
  usage as we think about how long to offer legacy models for." Six days after
  launch he restored it for all paid users by default and promised plenty of
  notice before any future removal. On Jan. 29, 2026 OpenAI announced that
  GPT-4o, GPT-4.1, GPT-4.1 mini, o4-mini and GPT-5 would be retired from ChatGPT
  on Feb. 13, fifteen days later, saying only 0.1% of users chose GPT-4o each
  day. The models stayed available in the API.
concreteness: directional
status: eroded
related: [2025-02-12-gpt-5-free-unlimited, 2025-11-04-model-weight-preservation]
