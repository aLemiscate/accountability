title: Altman asks the Senate for a licensing agency for powerful AI
date: 2023-05-16
org: openai
type: said
kind: claim
who: [sam-altman]
venue: Testimony, U.S. Senate Judiciary Subcommittee on Privacy, Technology, and the Law
quote: >-
  I would form a new agency that licenses any effort above a certain scale of
  capabilities and can take that license away and ensure compliance with
  safety standards.
summary: >-
  Altman named licensing as his top recommendation for AI safety, along with
  pre-deployment testing and independent audits. It was widely covered as a
  tech CEO asking to be regulated.
concreteness: directional
status: reversed
patterns: [regulate-us-not-like-that]
