title: 'GPT Store: "people can feature and make money from their GPTs"; payment
  stayed a closed pilot, and GPTs are being retired'
date: 2023-11-06
org: openai
type: said
kind: commitment
who: [openai]
venue: DevDay launch of GPTs, post on X
quote: >-
  Later this month, we’ll launch the GPT Store, so people can feature and make
  money from their GPTs.
summary: >-
  At its first developer conference OpenAI introduced GPTs, custom versions of
  ChatGPT, and promised a store within weeks where builders could earn money. On
  Dec. 1 it told builders the store would come early in 2024 instead: "While we
  had expected to release it this month, a few unexpected things have been
  keeping us busy!" The store opened on Jan. 10, 2024, with more than 3 million
  GPTs created, and a revenue program promised for the first quarter: "As a
  first step, US builders will be paid based on user engagement with their
  GPTs." By June, OpenAI's help-center FAQ, as quoted on its developer forum,
  said it was "partnering with a small group of builders to test GPT earnings
  based on usage" and was "not currently accepting additional builders." This
  record found no announcement of a wider program. On Sept. 11, 2026, OpenAI
  announced it would retire custom GPTs on Dec. 11, moving them to a plugin
  system shared with Codex.
concreteness: measurable
status: broken
patterns: [coming-weeks]
