title: 'OpenAI''s new chair, Bret Taylor: once the board''s transitional work is
  done, "I intend to step away"'
date: 2023-11-29
org: openai
type: said
kind: commitment
who: [bret-taylor, openai]
venue: Letter to the OpenAI community as board chair, posted on X
quote: >-
  The Board's focus is stabilizing the company, building out a qualified and
  diverse board, and enhancing governance procedures consistent with the
  importance and complexity of OpenAI’s mission. … when these transitional
  tasks have been completed, I intend to step away and leave the oversight of
  OpenAI in the good hands of board colleagues.
summary: >-
  Bret Taylor became chair of the three-member "initial board" formed when Sam
  Altman returned as CEO in November 2023, alongside Adam D'Angelo and Larry
  Summers. Posting the board's letter to staff, he named its tasks: stabilizing
  the company, building out the board and enhancing governance. Once those
  were done, he said, he intended to step away. On March 8, 2024, OpenAI
  announced that the WilmerHale review was complete, named three new directors
  and listed new governance measures: corporate governance guidelines, a
  stronger conflict-of-interest policy, a whistleblower hotline and new board
  committees. Two weeks later Fortune reported Taylor as saying there was no
  end date for his role other than when OpenAI is in a "stable state." He
  stayed on as chair through the October 2025 recapitalization. In September
  2026 OpenAI described him as "Chair of the OpenAI Foundation and OpenAI Group
  PBC Boards," the nonprofit and the for-profit company it controls.
concreteness: conditional
