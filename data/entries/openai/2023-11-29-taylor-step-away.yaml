response: >-
  Taylor told a Fortune event in March 2024 that his role was meant to be
  temporary, with no end date other than when OpenAI reaches a "stable state."
  This record found no later statement from him or OpenAI on why he stayed.
note: >-
  Staying on may well be what the rest of the board wanted, and a company that
  went through a recapitalization was arguably never "stable." That is the
  point of grading this one: the condition was Taylor's to judge, so the pledge
  could not be broken on a date. Nearly three years on, the chair of the
  "initial board" chairs both boards of the restructured company.
