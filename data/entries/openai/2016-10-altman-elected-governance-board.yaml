title: 'Altman: the world will "elect representatives to a new governance board"'
date: 2016-10
org: openai
type: said
kind: commitment
who: [sam-altman]
venue: The New Yorker, "Sam Altman's Manifest Destiny"
quote: >-
  We’re planning a way to allow wide swaths of the world to elect
  representatives to a new governance board.
summary: >-
  In a 2016 profile, Altman, then OpenAI's co-chair, said OpenAI was planning a
  way for people around the world to elect representatives to govern it. No such
  election was ever held. New directors have been picked by the sitting board,
  and under the 2025 restructuring the Foundation's board appoints the directors
  of the for-profit company.
concreteness: directional
status: eroded
