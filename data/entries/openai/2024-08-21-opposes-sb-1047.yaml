title: OpenAI opposes California's SB 1047, saying frontier AI should be
  regulated federally
date: 2024-08-21
org: openai
type: did
kind: action
who: [openai, jason-kwon, peter-welinder]
quote: >-
  the broad and significant implications of AI for U.S. competitiveness and
  national security require that regulation of frontier models be shaped and
  implemented at the federal level.
summary: >-
  In a letter signed by chief strategy officer Jason Kwon, OpenAI formally
  opposed SB 1047, which would have required developers of the largest models to
  test for catastrophic harms, keep a shutdown capability and submit to
  third-party audits. It said it supported "the intent behind some of its
  provisions" but that frontier regulation belonged to Congress, and warned the
  bill could drive companies out of California. The bill's author, Sen. Scott
  Wiener, said the letter "doesn't criticize a single provision of the bill."
  Former OpenAI employees William Saunders and Daniel Kokotajlo wrote that they
  were "disappointed but not surprised." Newsom vetoed the bill on Sept. 29;
  OpenAI vice president Peter Welinder posted: "Glad SB 1047 was vetoed."
contradicts: [2023-05-16-altman-senate-licensing-agency]
patterns: [regulate-us-not-like-that]
related: [2024-08-21-anthropic-sb-1047-sb-53]
