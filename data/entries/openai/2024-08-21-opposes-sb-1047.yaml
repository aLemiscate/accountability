  supported efforts in Congress and the White House executive order.
updates:
  - date: 2025-08-11
    text: >-
      On the successor bill, SB 53, OpenAI published an open letter to Newsom
      urging that companies meeting federal or EU standards be treated as
      compliant. TechCrunch reported that OpenAI and Meta lobbied against SB 53,
      and that OpenAI's letter discouraged Newsom from signing it. Newsom signed
      it on Sept. 29, 2025.
    sources:
