title: 'Altman: "we do not have or want government guarantees for OpenAI datacenters"'
date: 2025-11-06
org: openai
type: said
kind: commitment
who: [sam-altman]
venue: Post on X
quote: >-
  we do not have or want government guarantees for OpenAI datacenters. We
  believe that governments should not pick winners or losers, and that taxpayers
  should not bail out companies that make bad business decisions or otherwise
  lose in the market.
summary: >-
  A day after CFO Sarah Friar suggested at a Wall Street Journal event that a
  government "backstop" could lower the cost of financing AI infrastructure,
  Altman posted that OpenAI neither had nor wanted such guarantees. Friar had
  already walked back her comment. Altman left room for government involvement
  of other kinds: governments building and owning their own AI infrastructure,
  and loan guarantees for new U.S. chip fabrication plants.
concreteness: measurable
status: open
breaks_if: >-
  OpenAI seeks or accepts a federal loan guarantee, backstop or bailout for its
  own data centers or compute commitments, directly or through a special-purpose
  vehicle it controls.
patterns: [mission-to-market]
