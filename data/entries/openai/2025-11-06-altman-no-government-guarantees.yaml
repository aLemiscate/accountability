updates:
  - date: 2025-11-07
    text: >-
      Decrypt reported that an OpenAI letter to the White House science office,
      dated Oct. 27 and signed by Chris Lehane, contradicted Altman's denial.
      The letter asked Congress to extend a manufacturing tax credit to "AI data
      centers," and asked the government to "deploy grants, cost-sharing
      agreements, loans, or loan guarantees to expand industrial base capacity
      and resilience" in materials such as copper, aluminum and electrical steel
      and in grid components. It did not ask for guarantees for OpenAI's own
      data centers, which is what Altman ruled out.
