title: ChatGPT switches users' messages to an undisclosed safety model without
  showing it; OpenAI explains after users find it
date: 2025-09-27
org: openai
type: did
kind: action
who: [openai, nick-turley]
quote: >-
  We’ve started testing a new safety routing system in ChatGPT. As we previously
  mentioned, when conversations touch on sensitive and emotional topics the
  system may switch mid-chat to a reasoning model or GPT-5 designed to handle
  these contexts with extra care.
summary: >-
  In September 2025 ChatGPT users noticed that some messages they sent to GPT-4o
  or GPT-5 were being answered by other models, including one named
  "gpt-5-chat-safety" that OpenAI had not documented. The Decoder reported that
  users were not notified, and that, according to Turley, the switch happened
  message by message and "only becomes obvious if users specifically ask the
  model about it." A user's technical review it cited found that ordinary
  emotional or personal prompts, and questions about the model's own persona,
  also triggered the switch. On Sept. 27 ChatGPT head Nick Turley said OpenAI
  had started testing a safety routing system. OpenAI had announced in a
  September blog post that it would route moments of "acute distress" to other
  models; what users had not been told was that the switch would cover wider
  topics and happen without being shown. Turley said: "ChatGPT will tell you
  which model is active when asked."
patterns: [told-last]
contradicts: [2025-08-08-altman-show-which-model-answers]
