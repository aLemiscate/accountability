response: >-
  Turley said routing "happens on a per-message basis; switching from the
  default model happens on a temporary basis," and that it was "part of a
  broader effort to strengthen safeguards and learn from real-world use before a
  wider rollout." OpenAI said it had given itself 120 days to iterate on the
  system, TechCrunch reported.
note: >-
  The routing itself had been announced, and its purpose, steering people in
  distress to a more careful model, is one this record's other entries ask for.
  The gap is narrower: seven weeks after Altman promised to make it "more
  transparent about which model is answering," the answer was available only to
  users who thought to ask.
