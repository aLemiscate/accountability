updates:
  - date: 2024-05-17
    text: >-
      Leaving OpenAI, the team's co-lead Jan Leike wrote: "Over the past few
      months my team has been sailing against the wind. Sometimes we were
      struggling for compute and it was getting harder and harder to get this
      crucial research done."
    sources:
      - title: Jan Leike on X
        publisher: X
        url: https://x.com/janleike/status/1791498182125584843
        date: 2024-05-17
        type: primary
        snapshot: snapshots/2026-09-30-x.com-5b927f08
  - date: 2024-08-01
    text: >-
      Eleven weeks after the Superalignment team was dissolved, Altman restated
      the pledge in a different form: "as we said last july, we’re committed to
      allocating at least 20% of the computing resources to safety efforts
      across the entire company." The 2023 pledge had put a share of the compute
      secured at that point toward one team's four-year effort.
    sources:
