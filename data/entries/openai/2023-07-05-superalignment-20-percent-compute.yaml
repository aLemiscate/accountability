title: OpenAI pledges 20% of its compute to superalignment
date: 2023-07-05
org: openai
type: said
kind: commitment
who: [openai, ilya-sutskever, jan-leike]
venue: Blog post, "Introducing Superalignment"
quote: >-
  …20% of the compute we've secured to date over the next four years…
summary: >-
  OpenAI announced a Superalignment team co-led by Ilya Sutskever and Jan Leike
  to solve superintelligence alignment within four years, backed by a specific
  share of the company's compute.
concreteness: measurable
status: broken
patterns: [pledged-not-resourced]
