updates:
  - date: 2025-04-15
    text: >-
      Version 2 of the Preparedness Framework said OpenAI "may adjust our
      requirements" if another developer released a high-risk system without
      comparable safeguards. See 2025-04-15-preparedness-framework-v2.
  - date: 2026-08-18
    text: >-
      After the Hugging Face incident OpenAI paused some frontier RL training
      and cited no rival. See 2026-08-18-altman-pause-act-unilaterally.
note: >-
  "Eroded," not "broken": the 2025 framework made room to raise risk tolerance
  when a rival does, but OpenAI hasn't been shown to use that clause, and in
  2026 it paused without waiting for anyone.
