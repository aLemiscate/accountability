response: >-
  An OpenAI spokesperson told TechCrunch: "The text watermarking method we’re
  developing is technically promising, but has important risks we’re weighing
  while we research alternatives, including susceptibility to circumvention by
  bad actors and the potential to disproportionately impact groups like
  non-English speakers."
note: >-
  "Hope to share" is not a promise, and the reasons OpenAI gave for waiting are
  real limits of text watermarking. The Journal's reporting is what moves this
  from a slow research effort to a choice: the tool existed, and the survey of
  users was part of the internal case against shipping it. EU rules may now
  settle the question.
