title: 'AI-text classifier launch: OpenAI "hope[s] to share improved methods";
  it later built a text watermark and held it back'
date: 2023-01-31
org: openai
type: said
kind: commitment
who: [openai, jan-leike]
venue: Launch post for the AI text classifier and posts on X
quote: >-
  We’re developing a new tool to help distinguish between AI-written and
  human-written text. We’re releasing an initial version to collect feedback and
  hope to share improved methods in the future.
summary: >-
  OpenAI released a classifier for spotting AI-written text two months after
  ChatGPT launched. "Everyone has a right to know whether they are interacting
  with a human or AI," Jan Leike wrote, adding that it was "not fully reliable."
  OpenAI withdrew it in July 2023 for its "low rate of accuracy," in an addendum
  to the launch post saying it was "currently researching more effective
  provenance techniques for text." In August 2024 The Wall Street Journal
  reported that OpenAI had had a system for watermarking ChatGPT's text, and a
  tool to detect it, ready for about a year, but was divided over releasing it;
  in a survey the company commissioned, almost 30 percent of ChatGPT users said
  they would use it less if watermarking were implemented. OpenAI confirmed it
  was developing a watermarking method but said it was taking a "deliberate
  approach," citing circumvention and the potential to stigmatize non-native
  English speakers. When EU rules requiring AI-generated text to be marked took
  effect in August 2026, Anthropic announced a text watermark for new Claude
  models; OpenAI said its "goal is to expand provenance signals to all
  modalities including text" but had not said how it would mark text.
concreteness: aspirational
status: eroded
patterns: [principles-with-a-price]
