updates:
  - date: 2024-12-18
    text: >-
      The US and UK AI Safety Institutes published a joint pre-deployment
      evaluation of OpenAI's o1, covering biological, cyber and software
      capabilities.
    sources:
      - title: Pre-Deployment Evaluation of OpenAI's o1 Model
        publisher: NIST
        url: https://www.nist.gov/news-events/news/2024/12/pre-deployment-evaluation-openais-o1-model
        date: 2024-12-18
        type: primary
        snapshot: snapshots/2026-09-30-nist.gov-be88ea80
  - date: 2026-06-26
    text: >-
      OpenAI's GPT-5.6 models launched to a limited group after a government
      review requested by the administration. See
      2026-06-12-fable-5-export-control-suspension.
  - date: 2026-07-09
    text: >-
      On the day GPT-5.6 Sol became generally available, Altman described the
      government review as "a very productive process" and said testers "would
      test and find things," adding: "it was a collaborative back and forth but
      we made many changes through the process." (Quoted from the audio of
      Squawk on the Street, about 8:51 to 9:50.)
    sources:
      - title: '10AM Hour: OpenAI CEO Sam Altman on New Model, Palo Alto Networks CEO on
          AI Spending, Match Group CEO on AI & Dating 7/9/26'
        publisher: CNBC Squawk on the Street
        url: https://podcasts.apple.com/us/podcast/10am-hour-openai-ceo-sam-altman-on-new-model-palo-alto/id1475116211?i=1000776140567
        date: 2026-07-09
        type: primary
        snapshot: snapshots/2026-10-07-podcasts.apple.com-e8d61e0e
note: >-
  Marked kept on the published evidence: government testers did get
  pre-deployment access to at least one major model, and in 2026 government
  review came before release. The agreement's terms aren't public, so whether
  every major model was tested can't be checked.
