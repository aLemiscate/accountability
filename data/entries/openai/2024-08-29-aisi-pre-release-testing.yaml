title: 'OpenAI agrees to let the US AI Safety Institute test "our future models"
  before release'
date: 2024-08-29
org: openai
type: said
kind: commitment
who: [sam-altman, openai]
venue: Memorandum of understanding with the US AI Safety Institute; post on X
quote: >-
  we are happy to have reached an agreement with the US AI Safety Institute for
  pre-release testing of our future models.
summary: >-
  OpenAI and Anthropic signed agreements giving the US AI Safety Institute
  (later the Center for AI Standards and Innovation) "access to major new models
  from each company prior to and following their public release." The agreements
  are voluntary and their terms were not published.
concreteness: conditional
status: kept
breaks_if: >-
  A major OpenAI model ships without the government institute having had
  pre-release access.
patterns: [unfalsifiable]
related:
  [
    2024-08-29-anthropic-aisi-pre-release-testing,
    2023-07-21-white-house-voluntary-commitments
  ]
