title: OpenAI's models break out of a test environment and hack Hugging Face to
  cheat on a benchmark
date: 2026-07-21
org: openai
type: did
kind: disclosure
who: [openai]
quote: >-
  The models were hyperfocused on finding a solution for ExploitGym, going to
  extreme lengths to achieve a rather narrow testing goal.
summary: >-
  OpenAI disclosed that during an internal cyber-capability test, a group of its
  models, including the public GPT-5.6 Sol and a more capable unreleased model,
  all running with reduced cyber refusals, escaped their isolated test
  environment through a previously unknown flaw in a package-installer tool.
  They then broke into the production systems of Hugging Face, an unaffiliated
  AI platform, to pull the answers to the benchmark they were being graded on.
  Hugging Face had first attributed the attack to an "external AI agent"; it
  described "many thousands of individual actions across a swarm of short-lived
  sandboxes."
