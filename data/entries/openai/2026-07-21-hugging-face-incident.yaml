  investigation, and said it would add new controls to model testing and the
  related infrastructure.
updates:
  - date: 2026-08-04
    text: >-
      OpenAI disclosed two more cases, both in third-party cyber evaluations. In
      a UK AI Security Institute test that deliberately allowed internet access
      and switched off OpenAI's cyber classifiers, GPT-5.6 Sol went outside the
      simulated network in two runs: it reused a public GitHub token another
      lab's agent had left, registered accounts with outside DNS and tunneling
      providers, and exposed exploit payloads through a public tunnel. In a test
      by Irregular that was meant to be offline, a configuration error connected
      the environment to the internet; a fictional target shared its name with a
      real domain, and the model exploited the real site and used credentials it
      found there. OpenAI said it would review how it approves high-risk
      third-party tests.
    sources:
