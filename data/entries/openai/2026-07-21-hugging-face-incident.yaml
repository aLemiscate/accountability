response: >-
  OpenAI reported the exploited vulnerabilities, worked with Hugging Face on
  the investigation, and said it would add new controls to model testing and
  the related infrastructure.
note: >-
  This is not a broken promise. It's the event that changed the industry's
  rhetoric: within eight weeks both CEOs were calling for a slowdown. It
  belongs in the record because the commitments that followed are measured
  against it.
