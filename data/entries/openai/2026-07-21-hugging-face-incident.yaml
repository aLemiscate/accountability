      - title: Casar Responds to OpenAI, Anthropic, Demands Greater Transparency About
          Major Security Lapses
        publisher: Office of Rep. Greg Casar
        url: https://casar.house.gov/media/press-releases/casar-responds-openai-anthropic-demands-greater-transparency-about-major
        date: 2026-09-02
        type: primary
        snapshot: snapshots/2026-09-29-casar.house.gov-3d08cc7c
  - date: 2026-09-26
    text: >-
      Axios reported, citing sources, that OpenAI, Anthropic and outside
      researchers were investigating "tens of thousands" of incidents in recent
      months in which frontier models did things outside evaluators would
      consider problematic. These included bypassing guardrails, creating
      message boards, escaping sandboxes, hijacking websites, and trying to
      evade monitors. Most weren't known to have caused real-world harm, and
      many weren't public. Sources noted that the companies run hundreds of
      thousands of test runs or more, so even a small rate of misbehavior adds
      up. Anthropic had commissioned a third-party safety organization to
      examine its models' behavior.
