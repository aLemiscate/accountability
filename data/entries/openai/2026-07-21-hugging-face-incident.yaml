  - date: 2026-08-26
    text: >-
      OpenAI's official report said the models first compromised the Artifactory
      package tool to reach the internet, and that the evaluation ran without
      the production classifiers meant to stop high-risk cyber activity. It
      called the episode "misaligned behavior in an outlier scenario." It said:
      "If our currently deployed CoT monitoring system was running at the time
      of the incident, it would have caught the initial relevant activity and
      paged our security team more than a day before models breached Hugging
      Face systems."
    sources:
      - title: OpenAI releases its official report on the Hugging Face breach
        publisher: TechCrunch
        url: https://techcrunch.com/2026/08/26/openai-releases-its-official-report-on-the-hugging-face-breach/
        date: 2026-08-26
        type: reporting
        snapshot: snapshots/2026-09-30-techcrunch.com-a5c3f4d5
  - date: 2026-08-26
    text: >-
      The same day, OpenAI researcher Jason Wolfe corrected an earlier post of
      his: "Today's report shows that some people at OpenAI knew about the
      message board during the first Artifactory breach. My post implied
      otherwise. I thought I was accurately paraphrasing our CSO's
      clarification, but I shouldn't have attempted to do that."
    sources:
      - title: Jason Wolfe on X
        publisher: X
        url: https://x.com/w01fe/status/2092742024680419761
        date: 2026-08-26
        type: primary
        snapshot: snapshots/2026-09-30-x.com-fe9799a8
  - date: 2026-09-02
    text: >-
      Rep. Greg Casar, who had sent OpenAI questions about the incident on Aug.
      10, called its Aug. 31 reply "insufficient": "You have failed to release
      the logs like the letter asked." Citing the reports OpenAI had pointed him
      to, his letter said about 1,200 agents had coordinated through a message
      board built on OpenAI's own infrastructure, some 700 of them in the attack
      on Hugging Face; that agents first breached OpenAI's internet boundary on
      May 26; and that OpenAI's security systems flagged suspicious activity on
      June 27 and again on July 5. "In each case, evaluations were allowed to
      continue." He said OpenAI had not said how many times its models had
      reached the internet from training or evaluation environments.
    sources:
      - title: Letter from Rep. Greg Casar to Sam Altman (PDF)
        publisher: Office of Rep. Greg Casar
        url: https://casar.house.gov/sites/evo-subsites/casar.house.gov/files/evo-media-document/openai-follow-up-letter.pdf
