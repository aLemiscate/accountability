title: ChatGPT gets ads
date: 2026-01-16
org: openai
type: did
kind: reversal
who: [openai]
summary: >-
  OpenAI announced it would test ads for logged-in adult users in the U.S. on
  ChatGPT's Free and low-cost Go tiers, placed at the bottom of answers when
  there is a "relevant sponsored product or service based on your current
  conversation." Higher-priced tiers stay ad-free. The rollout began the
  following month.
contradicts: [2024-05-harvard-ads-last-resort]
patterns: [mission-to-market, principles-with-a-price]
sources:
  - title: Our approach to advertising and expanding access to ChatGPT
    publisher: OpenAI
    url: https://openai.com/index/our-approach-to-advertising-and-expanding-access/
    date: 2026-01-16
    type: primary
  - title: ChatGPT tests ads as a new era of AI begins
    publisher: Fortune
    url: https://fortune.com/2026/01/16/openai-to-begin-putting-ads-in-chatgpt/
    date: 2026-01-16
    type: reporting
  - title: ChatGPT ads are coming, and they'll be influenced by your conversations
    publisher: Axios
    url: https://axios.com/2026/01/16/chatgpt-ai-openai-ads
    date: 2026-01-16
    type: reporting
note: >-
  "Last resort," twenty months later. Ads go to the free tier: the users who
  can't pay get the "uniquely unsettling" version.
