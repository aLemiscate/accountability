title: ChatGPT gets ads
date: 2026-01-16
org: openai
type: did
kind: reversal
who: [ openai ]
summary: >-
  OpenAI announced it would test ads for logged-in adult users in the U.S. on
  ChatGPT's Free and low-cost Go tiers, placed at the bottom of answers when
  there is a "relevant sponsored product or service based on your current
  conversation." Higher-priced tiers stay ad-free. The rollout began the
  following month.
contradicts: [ 2024-05-harvard-ads-last-resort ]
patterns: [ mission-to-market, principles-with-a-price ]
