title: 'Standing promise: OpenAI signs the EU code for general-purpose AI,
  including serious-incident reporting'
date: 2025-07-11
org: openai
type: said
kind: commitment
who: [openai]
venue: EU General-Purpose AI Code of Practice
summary: >-
  OpenAI said it would sign the EU's voluntary Code of Practice for
  general-purpose AI, the Commission's route for complying with the AI Act. For
  the most capable models, the code's Safety and Security chapter commits
  signatories to a published safety framework, model reports to the EU AI
  Office, and reporting serious incidents "without undue delay," with deadlines
  that depend on severity. For a serious cybersecurity breach the deadline is
  five days.
concreteness: measurable
status: open
breaks_if: >-
  The AI Office finds OpenAI in breach of the code; OpenAI withdraws; or it
  emerges that a serious incident involving an OpenAI model, such as a
  cyberattack by its agents, wasn't reported within the code's deadlines.
