response: >-
  OpenAI said it had addressed the Garante's concerns promptly after the 2023
  ban and was "committed to offering beneficial artificial intelligence that
  abides by users' privacy rights."
note: >-
  The findings were never tested on the merits, so read them as the
  regulator's allegations. The March 2023 bug itself was announced publicly by
  OpenAI within days; the regulator's complaint was that it wasn't formally
  notified.
