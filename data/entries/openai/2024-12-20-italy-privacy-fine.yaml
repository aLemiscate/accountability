title: Italy's privacy regulator fines OpenAI €15M, including for not reporting a
  2023 data breach; a court later voids it on jurisdiction
date: 2024-12-20
org: openai
type: did
kind: outcome
who: [openai]
summary: >-
  After a year-long investigation, Italy's data protection authority, the
  Garante, fined OpenAI €15 million. It found that OpenAI had not notified it of
  the March 2023 ChatGPT bug that showed some users other users' chat titles
  and exposed personal data of up to 1.2% of ChatGPT Plus subscribers, had trained on personal data without an adequate legal basis, had
  fallen short on transparency, and had no age verification to keep children
  under 13 away from inappropriate responses. It also ordered a six-month
  public information campaign. OpenAI called the fine "disproportionate,"
  nearly 20 times its Italian revenue for the period, and appealed. On March 18,
  2026, a Rome court annulled the decision. It held that the Garante lacked
  jurisdiction once OpenAI had set up its EU base in Ireland in 2024, and did
  not rule on whether the violations occurred.
related: [2023-04-breach-kept-private]
