title: Two years later, Altman calls pre-approval of AI "disastrous"
date: 2025-05-08
org: openai
type: did
kind: reversal
who: [ sam-altman ]
venue: Testimony, U.S. Senate Commerce Committee hearing on AI competitiveness
summary: >-
  Altman repeatedly pushed back on specific calls for regulation and said that
  requiring government approval before releasing AI systems would be
  "disastrous" for America's lead in AI. The Washington Post called it a
  striking reversal of his 2023 testimony.
contradicts: [ 2023-05-16-altman-senate-licensing-agency ]
patterns: [ regulate-us-not-like-that ]
