response: >-
  An OpenAI spokesperson said the company had "moved from a form-based upfront
  vetting system, where developers wait in a queue to be approved on their app
  idea in concept, to a post-hoc detection system where we identify and
  investigate problematic apps by monitoring their traffic," because its
  monitoring had "significantly improved."
note: >-
  Reversed openly, with a stated reason. The review was part of OpenAI's
  argument for releasing GPT-3 through an API instead of openly; by the time it
  went, so had much of that argument's audience.
