title: 'GPT-3 API: OpenAI is "starting off with a beta and have safety review
  before apps can go live"'
date: 2020-07-22
org: openai
type: said
kind: policy
who: [sam-altman, openai, jack-clark]
venue: Posts on X during the GPT-3 API private beta
quote: >-
  We share your concern about bias and safety in language models, and it's a big
  part of why we're starting off with a beta and have safety review before apps
  can go live.
summary: >-
  OpenAI released GPT-3 in 2020 only through a paid API in private beta, rather
  than as an open model, and said this let it control use. Altman answered a
  critic of GPT-3's toxic outputs that OpenAI could "turn off applications that
  are misusing the API" and had introduced a toxicity filter on by default,
  which "we don't think we could do this if we just open-sourced the model."
  OpenAI said: "Before applications go live, they're also subject to a review
  with the OpenAI team," and its then policy director Jack Clark said it would
  "terminate access for harassment, spam, radicalization, or astroturfing." The
  waitlist was dropped in November 2021. On March 1, 2023, launching the ChatGPT
  API, OpenAI removed the pre-launch review in favor of automated monitoring,
  saying "the overwhelming majority of apps were approved during the vetting
  process."
concreteness: measurable
status: reversed
related: [2023-08-15-altman-never-trains-api]
