response: >-
  The post presented the principles as "an expansion of our long-held strategy
  of iterative deployment." According to Euronews, it also said OpenAI expects
  to work with governments, international agencies and other AGI efforts to
  "sufficiently solve serious alignment, safety or societal problems before
  proceeding further." Earlier that month Altman had written that AGI has a
  "ring of power" to it that "makes people do crazy things," and that the answer
  was to "orient towards sharing the technology with people broadly, and for no
  one to have the ring." No statement was found on why the assist-a-rival clause
  and the fiduciary duty to humanity were dropped.
note: >-
  The Charter's one concrete mechanism against racing, stepping aside to help a
  rival, is gone. What replaces it is a general expectation to work with others
  before "proceeding further," as Euronews reported it. Racing wasn't made
  safer; the pledge was retired.
