title: OpenAI's new principles drop the 2018 "stop competing" pledge
date: 2026-04-26
org: openai
type: did
kind: revision
who: [ openai ]
summary: >-
  OpenAI published five operating principles (democratization, empowerment,
  universal prosperity, resilience and adaptability), its first rewrite of its
  founding commitments in eight years. The new text mentions AGI twice, against
  twelve times in 2018. It shifts from first-person pledges ("we commit") to
  broader recommendations for the ecosystem, and it drops both the
  assist-a-rival clause and "Our primary fiduciary duty is to humanity." Reports
  noted that the 2018 Charter page itself remained online.
revision:
  before: >-
    "…if a value-aligned, safety-conscious project comes close to building AGI
    before we do, we commit to stop competing with and start assisting this
    project." / "Our primary fiduciary duty is to humanity."
  after: >-
    Five principles, with no assist-a-rival clause and no statement of fiduciary
    duty to humanity.
contradicts: [ 2018-04-09-charter-stop-competing-clause ]
patterns: [ race-clause, unfalsifiable ]
