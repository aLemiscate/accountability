title: OpenAI backs an Illinois bill shielding AI labs from liability for mass
  casualties; Anthropic opposes it
date: 2026-04-14
org: openai
type: did
kind: action
who: [openai]
quote: >-
  In the absence of federal action, we will continue to work with
  states—including Illinois—to work toward a consistent safety framework
summary: >-
  Illinois S.B. 3444 would have protected a frontier AI developer from liability
  for "critical harms," defined as the death or serious injury of 100 or more
  people or more than $1 billion in property damage, including harms from
  chemical, biological, radiological or nuclear weapons its model helped make,
  provided the developer did not cause them intentionally or recklessly and had
  published a safety protocol. OpenAI backed the bill; WIRED reported that
  Anthropic was lobbying to change or kill it and instead supported S.B. 3261,
  which would require published safety and child protection plans, third-party
  audits and incident reporting. Anthropic's head of state government relations,
  Cesar Fernandez, said: "Good transparency legislation needs to ensure public
  safety and accountability for the companies developing this powerful
  technology, not provide a get-out-of-jail-free card against all liability." A
  spokesperson for Governor JB Pritzker said he "does not believe big tech
  companies should ever be given a full shield." Legal scholars told Fortune the
  standard was "very low" and "pretty indefensible."
patterns: [regulate-us-not-like-that]
