response: >-
  OpenAI said the bill reduces the risk of serious harm from frontier AI "while
  still allowing this technology to get into the hands of the people and
  businesses—small and big—of Illinois," and spokesperson Liz Bourgeois said:
  "We hope these state laws will inform a national framework that will help
  ensure the US continues to lead."
note: >-
  By June OpenAI was endorsing a different Illinois bill, S.B. 315, which
  requires annual outside audits (see the related OSTP entry). Experts gave S.B.
  3444 little chance of passing; its significance is what OpenAI asked for.
