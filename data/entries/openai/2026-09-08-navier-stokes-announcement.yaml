title: OpenAI announces a Navier-Stokes Millennium Prize proof a week after
  hearing of rival mathematicians' work; they question how it got there
date: 2026-09-08
org: openai
type: did
kind: action
who: [openai, sam-altman, sebastien-bubeck]
quote: >-
  We’re sharing a solution to the Navier-Stokes Millennium Prize Problem, one
  of the deepest problems at the frontier of mathematics.
summary: >-
  OpenAI said about 10,000 agents running an unreleased model "significantly
  more capable than GPT-6 Astra" had produced a proof, checked in the Lean
  proof assistant, that smooth three-dimensional fluid motion described by
  the Navier-Stokes equations can break down. It said the effort began on
  Sept. 1, the day it heard rumors of other Millennium Prize resolutions. NYU
  mathematician Tristan Buckmaster and Levent Alpöge, a mathematician at
  Anthropic, had reached related results on the Euler equations using what
  Buckmaster said was the same uncommon technique. Buckmaster said he had put drafts of their work
  into OpenAI's Codex and asked whether its models had been trained on them;
  OpenAI said its researchers and agents "did not see any of their work
  through any means until they released it publicly," but added: "While
  unlikely, we cannot rule out that de-identified data derived from their
  usage of our products helped improve our models." Buckmaster also alleged
  that at a Sept. 6 meeting OpenAI's math research lead Sébastien Bubeck
  pressed to drop Alpöge from authorship and asked, "Why would you ruin your
  career?" Bubeck called the allegations "false and inflammatory," said he
  never asked to remove Alpöge from his own work, and apologized for "this
  extremely poor choice of words." Altman wrote: "It is true that we tried
  this because there were rumors on the internet last week that Anthropic's
  models had solved a millennium problem and we were curious if ours could do
  it too." As of mid-September the proof awaited peer review and a verdict
  from the Clay Mathematics Institute.
related: [2025-10-gpt-5-erdos-claim, 2026-09-23-claude-enzyme-discovery-claim]
