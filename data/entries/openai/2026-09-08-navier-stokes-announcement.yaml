response: >-
  OpenAI congratulated Buckmaster and Alpöge and said its proofs "differ
  significantly" from theirs. Altman said OpenAI had wanted a joint release,
  had offered to let them go first and to let Buckmaster lead a rewrite of
  its proof, and "did not rush to publish." Bubeck said Alpöge declined to
  join the meetings and that internal Anthropic models had been used in the
  pair's Euler proof.
note: >-
  The proof may well stand; no one quoted here has said it is wrong, and this
  record will follow the review. What the episode records is conduct: a
  company that holds its users' unpublished work racing them to a result, and
  saying it cannot rule out that their own usage helped. Terence Tao warned
  that the incentives "may now be pointing in the direction of no longer
  sharing any promising research directions."
