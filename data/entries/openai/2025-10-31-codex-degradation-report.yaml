title: OpenAI publishes the Codex degradation investigation it promised, finding
  no single cause but several real problems
date: 2025-10-31
org: openai
type: did
kind: disclosure
who: [thibault-sottiaux, openai]
quote: >-
  We promised unprecedented transparency for Codex and to take the reports of
  degradation seriously, despite seeing incredible growth week over week.
summary: >-
  After weeks of public reports that Codex had got worse around the Sept. 15,
  2025 launch of gpt-5-codex, OpenAI announced an investigation with a stated
  plan: better in-product feedback, putting all internal staff on the same
  setup as external users, and extra evaluations across its hardware. A week
  later it published the results: "We have not found a conclusive large issue
  that would explain a consistent degradation of Codex over time." It
  documented smaller ones: older hardware that performed slightly worse, which it removed
  from the fleet; compaction of long sessions that degraded results as it was
  used more; and over 60 feature flags it removed to simplify the stack.
