title: Pentagon awards OpenAI $200M for "warfighting and enterprise" AI prototypes
date: 2025-06-16
org: openai
type: did
kind: action
who: [openai]
summary: >-
  The Defense Department awarded OpenAI a one-year, $200M contract to develop
  "prototype frontier AI capabilities" for national-security challenges "in
  both warfighting and enterprise domains." It was the first deal under the
  new OpenAI for Government initiative.
related: [2024-01-10-military-ban-removed]
patterns: [principles-with-a-price]
