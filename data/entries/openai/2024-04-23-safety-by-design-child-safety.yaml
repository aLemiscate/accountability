title: 'Standing promise: Safety by Design principles against AI-generated child
  sexual abuse material'
date: 2024-04-23
org: openai
type: said
kind: commitment
who: [openai]
venue: Thorn and All Tech Is Human, Safety by Design for Generative AI
quote: >-
  We commit to @thorn and @AllTechIsHuman's Safety by Design principles to
  ensure child safety is prioritized in the development and deployment of AI
  tools.
summary: >-
  OpenAI joined Anthropic, Google, Meta, Microsoft and others in committing to
  principles against AI-generated child sexual abuse material. These include
  keeping such material out of training data, red-teaming models for it,
  detecting and reporting it in inputs and outputs, and deploying in phases.
  The companies also agreed to publish documentation of their progress.
concreteness: directional
status: open
breaks_if: >-
  Credible reporting that OpenAI models or products generated or distributed
  child sexual abuse material through a failure of these safeguards that OpenAI
  knew of and didn't fix; or OpenAI stops reporting progress.
patterns: []
related: [2024-04-23-anthropic-safety-by-design-child-safety, 2025-10-14-chatgpt-erotica-announced]
