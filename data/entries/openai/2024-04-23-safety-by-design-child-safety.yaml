updates:
  - date: 2025-10-21
    text: >-
      Thorn's first annual progress report, covering April 2024 to April 2025,
      included OpenAI's account of its measures. OpenAI said it takes steps to
      remove such material from training data, scans image and video uploads
      with Thorn's classifiers, has people review every flagged image and
      video, and keeps known abuse sites out of ChatGPT search. Unlike
      Anthropic, it reported no figures. The report relays what companies said;
      it doesn't audit them.
    sources:
      - title: 'Safety by Design for Generative AI: Annual Progress Report (April
          2024 to April 2025)'
        publisher: Thorn
        url: https://info.thorn.org/hubfs/Thorn_SafetyByDesign_AnnualProgressReport_April2024-April2025.pdf
        date: 2025-10-21
        type: primary
        snapshot: snapshots/2026-09-30-info.thorn.org-9fd81e30
note: >-
  Progress has been reported, as promised, but only through self-reports. In
  February 2026 the Wall Street Journal reported that OpenAI's fired product
  policy head had told colleagues its safeguards against child-exploitation
  content weren't strong enough (see related).
