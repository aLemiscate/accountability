title: 'NYT: OpenAI transcribed over a million hours of YouTube to train GPT-4,
  knowing it might break YouTube''s rules'
date: 2024-04-06
org: openai
type: did
kind: action
who: [openai, greg-brockman]
summary: >-
  The New York Times reported that OpenAI built its speech-recognition model,
  Whisper, partly to turn audio from videos into training text, and that a team
  including president Greg Brockman transcribed more than a million hours of
  YouTube videos to train GPT-4. According to the Times, some OpenAI staff
  discussed that this might go against YouTube's rules, which bar automated
  access and use of its content for "independent" applications. In August 2024 a
  YouTube creator filed a proposed class action on the same grounds.
related: [2024-01-08-training-is-fair-use, 2024-05-07-media-manager-opt-out]
patterns: [take-first]
