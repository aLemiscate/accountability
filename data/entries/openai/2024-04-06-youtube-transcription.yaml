note: >-
  The account comes from the Times' unnamed sources and a lawsuit, and hasn't
  been tested in court. It belongs next to OpenAI's promise the next month of
  a tool to let creators opt out. Three weeks before the Times report, the Wall
  Street Journal asked chief technology officer Mira Murati whether OpenAI's
  video model, Sora, was trained on YouTube videos; she said she wasn't sure,
  and afterwards confirmed only that some licensed data came from Shutterstock.
