  In a February 2026 memo to staff, chief global affairs officer Chris Lehane
  said OpenAI itself was not contributing to PACs or 501(c)(4)s.
updates:
  - date: 2026-02-13
    text: >-
      Reporting in early 2026 showed the Brockmans had also given $25M to MAGA
      Inc., President Trump's super PAC, in September 2025, making them its
      largest donors in its year-end filing. Brockman told Wired he had stepped
      up his political spending because public opinion was turning against AI,
      and framed it in terms of OpenAI's mission: "Getting that right and making
      that benefit everyone, that's the most important thing."
