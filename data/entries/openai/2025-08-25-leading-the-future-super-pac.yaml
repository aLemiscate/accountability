  - date: 2026-06-23
    text: >-
      Alex Bores lost the Democratic primary for New York's 12th congressional
      district to Micah Lasher. Leading the Future spent $8 million against him.
      Groups on the other side, most of the money from an Anthropic-backed
      organization, spent roughly $20 million supporting him.
