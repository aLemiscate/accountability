  - date: 2026-06-02
    text: >-
      Days apart, Brockman and OpenAI both drew the line between his money and
      the company. Brockman on X: "Funded by my wife & me personally, not funded
      by OpenAI! No PAC speaks on behalf of OpenAI." OpenAI's global affairs
      team then published a statement that the Brockmans' engagement with
      Leading the Future "has been in a personal capacity," that "OpenAI does
      not direct the activities of LTF, or have visibility into their
      operations," and that "No outside political group speaks for OpenAI or
      represents our company's views."
