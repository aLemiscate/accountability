title: OpenAI's president helps bankroll a $100M+ super PAC against strict AI rules
date: 2025-08-25
org: openai
type: did
kind: action
who: [greg-brockman]
summary: >-
  Andreessen Horowitz and OpenAI president Greg Brockman were among the backers
  of Leading the Future, a pro-AI super PAC network modeled on the crypto
  industry's Fairshake. It aims to defeat candidates who back the strictest AI
  rules and to push a national framework that would preempt state laws. Greg and
  Anna Brockman gave it $25M ($12.5M each), among the largest contributions on
  file. By one compilation of filings, the network spent about $8M against New
  York Assemblymember Alex Bores, sponsor of the state's RAISE Act.
contradicts: [2023-05-16-altman-senate-licensing-agency]
related: [2026-02-12-public-first-action-donation]
patterns: [regulate-us-not-like-that]
