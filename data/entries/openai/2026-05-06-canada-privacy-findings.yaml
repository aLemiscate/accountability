title: Canada's privacy regulators find OpenAI trained ChatGPT in breach of
  privacy law; OpenAI had retired the early models and commits to fixes
date: 2026-05-06
org: openai
type: did
kind: outcome
who: [openai]
summary: >-
  The Office of the Privacy Commissioner of Canada and the privacy regulators of
  Quebec, British Columbia and Alberta closed a joint investigation, begun in
  April 2023, into the GPT-3.5 and GPT-4 models behind ChatGPT. They concluded
  that the way OpenAI initially trained ChatGPT did not comply with federal and
  provincial privacy laws. OpenAI collected vast amounts of personal
  information, which could include health conditions, political views and
  information about children, without valid consent; gave insufficient notice
  that answers about people could be inaccurate; did not give everyone an easy
  way to access, correct and delete their information; and released ChatGPT
  "without having fully addressed known privacy risks, and without establishing
  data-deletion rules." By then OpenAI had retired the earlier models and
  started masking personal information in training data with a filtering tool.
  The federal office found the complaint well-founded and "conditionally
  resolved" on the strength of OpenAI's commitments (see related). British
  Columbia and Alberta found it well-founded and unresolved, holding that models
  trained on scraped data still breach their consent rules; Quebec found it
  unresolved on consent.
patterns: [take-first]
