response: >-
  The regulators wrote that OpenAI "generally disagreed with our findings –
  asserting that it was compliant with the Acts in most respects." A
  spokesperson, Shane Bauer, said the company had published a blog post for
  Canadian users "following a collaborative process with the commissioners," and
  wrote: "We care very deeply about protecting our users' privacy."
note: >-
  Found through a search of reporting in other languages (Korean and German
  outlets covered it). The findings concern models OpenAI no longer offers, and
  no penalty was imposed. Asked the same day about the Tumbler Ridge shooting,
  Commissioner Philippe Dufresne said it raised the question of "what should be
  the duty of organizations in terms of disclosing risks to authorities." No
  comparable regulator's finding on Anthropic's training data was found.
