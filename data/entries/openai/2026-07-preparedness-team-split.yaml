sources:
  - title: OpenAI split up the team that assessed catastrophic model risks
    publisher: The Next Web
    url: https://thenextweb.com/news/openai-preparedness-team-disbanded-ipo-streamlining
    date: 2026-08-17
    type: reporting
  - title: OpenAI Denies Disbanding Its AI Risk Team
    publisher: ETV Bharat
    url: https://etvbharat.com/en/technology/openai-preparedness-team-dissolved-hugging-face-incident-openai-openai-ipo-2026-enn26081703211
    date: 2026-08-17
    type: reporting
response: >-
  An OpenAI spokesperson told The Next Web and ETV Bharat: "We have not
  disbanded the Preparedness team. We have strong research leaders across
  cybersecurity, biological and chemical, and AI self-improvement
  capabilities, all reporting to Saachi Jain, our head of safety." The Next
  Web added that the Financial Times had not withdrawn its report.
note: >-
  The underlying Financial Times article is paywalled and wasn't read
  directly; this entry relies on the two reports above. Both sides agree the
  risk areas now have separate leads reporting to the head of safety. What
  they dispute is whether that ends the Preparedness team as a team.
