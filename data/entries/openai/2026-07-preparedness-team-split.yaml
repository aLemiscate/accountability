title: >-
  Financial Times: OpenAI splits up its Preparedness team; OpenAI says "We
  have not disbanded the Preparedness team"
date: 2026-07
org: openai
type: did
kind: action
who: [openai]
summary: >-
  The Financial Times reported in August 2026 that OpenAI had disbanded its
  Preparedness team, which assessed whether its models posed catastrophic
  risks, at the end of July. According to the report, the work was split by
  subject among senior staff in existing teams, with separate owners for
  biological risk and for cyber, and Dylan Scandinaro, who had led the team
  since February, moved to work on recursive self-improvement. It came weeks
  after the Hugging Face incident and amid other departures, including safety
  leader Johannes Heidecke. OpenAI denies that the team was disbanded. The Next
  Web, which corrected its own story, said the split of bio and cyber work
  among existing teams "is not in dispute."
