title: 'OpenAI: ChatGPT agent is the first launch treated as "High" biological
  risk, with safeguards switched on'
date: 2025-07-17
org: openai
type: said
kind: claim
who: [openai]
venue: ChatGPT agent system card and post on X
quote: >-
  We have decided to treat this launch as High capability in the Biological and
  Chemical domain, activating the associated Preparedness safeguards.
summary: >-
  OpenAI said it had no definitive evidence that ChatGPT agent could
  meaningfully help a novice create severe biological harm, its threshold for
  "High" capability, but treated it as High as a precaution because its previous
  models were "already on the cusp." The safeguards it described included
  refusal training and an "always-on" two-tier system: a fast classifier that
  flags biology-related content and a reasoning-model monitor that reviews what
  it flags.
concreteness: measurable
status: open
breaks_if: >-
  Evidence that the High safeguards were not running on some route to the
  model, or that OpenAI lowered them for a High model without the process its
  Preparedness Framework requires.
patterns: []
related: [2025-04-15-preparedness-framework-v2, 2025-05-22-asl-3-protections-activated]
