note: >-
  Kept by OpenAI's own account: it says the safeguards came before internal use
  and release, and it paused training to add them. Outsiders can't check the
  internal controls, and whether the safeguards were enough is OpenAI's own
  call. OpenAI had said it expected to update the framework before reaching
  Critical; this record found no new version of it.
