updates:
  - date: 2026-09-03
    text: >-
      GPT-6 Astra became the first OpenAI model rated Critical for
      cybersecurity. OpenAI said it had paused some training, delayed parts of
      Astra's development and release by several weeks, and before internal use
      added checkpoint encryption, stricter isolation, monitoring of full
      trajectories including chains of thought, and blocking alignment
      evaluations. The public release refuses advanced offensive tasks, such as
      writing proof-of-concept exploits, and runs misalignment monitoring on all
      tool use. It reached all paying ChatGPT tiers within five days. A month
      earlier Altman had written: "we do not think it is a good strategy to
      keep powerful models to a chosen few."
