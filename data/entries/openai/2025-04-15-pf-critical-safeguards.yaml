title: 'Standing promise: at "Critical" capability, safeguards come first, even
  during development'
date: 2025-04-15
org: openai
type: said
kind: commitment
who: [openai]
venue: Preparedness Framework, version 2
quote: >-
  Such models require additional safeguards (safety and security controls)
  during development, regardless of whether or when they are externally
  deployed.
summary: >-
  OpenAI's 2025 Preparedness Framework set a "Critical" level for its tracked
  risks. For cybersecurity, that meant a model that can find and exploit
  zero-day vulnerabilities in hardened real-world systems without human help.
  For such a model, the framework said: "Until we have specified safeguards and
  security controls standards that would meet a Critical standard, halt
  further development." OpenAI said it had no Critical model and expected to
  update the framework before it had one.
concreteness: conditional
status: kept
breaks_if: >-
  OpenAI continues developing or deploys a model it has rated Critical without
  first putting Critical-level safeguards and security controls in place, or
  lowers the Critical requirements because a rival shipped first.
patterns: []
related: [2025-04-15-preparedness-framework-v2, 2026-08-18-altman-pause-act-unilaterally]
sources:
