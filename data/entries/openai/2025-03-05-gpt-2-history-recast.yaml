note: >-
  This is a claim about OpenAI's own past, and its own 2019 report gives the
  reason: misuse risk from the larger models, not a view of AGI as one sudden
  leap. It matters because the new framing treats past caution as a mistake
  of worldview, which lowers the bar for caution next time. The quote is as
  reproduced by TechCrunch; openai.com blocks automated capture.
