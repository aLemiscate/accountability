title: OpenAI recasts its GPT-2 caution as an outdated view of AGI; the report's
  co-author says that rewrites history
date: 2025-03-05
org: openai
type: said
kind: claim
who: [openai]
venue: Safety page, "How we think about safety and alignment"
quote: >-
  safety lessons come from treating the systems of today with outsized caution
  relative to their apparent power … is the approach we took for … GPT‑2
summary: >-
  In a March 2025 statement of its safety philosophy, OpenAI said it used to see
  AGI as a "discontinuous" leap. In that view, lessons came from treating
  today's systems with outsized caution, and OpenAI said that was the approach
  it took for GPT-2 in 2019. It said it now sees "the first AGI as just one point
  along a series of systems of increasing usefulness," where the way to make
  the next system safe is to learn from deploying the current one.
concreteness: measurable
status: contradicted
patterns: []
