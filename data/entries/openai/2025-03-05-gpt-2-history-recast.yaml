    date: 2025-03-06
    type: reporting
    snapshot: snapshots/2026-09-30-techcrunch.com-fadc53b3
updates:
  - date: 2025-03-05
    text: >-
      Miles Brundage, OpenAI's former head of policy research and a co-author
      of the 2019 GPT-2 release report, said the section "rewrites the history
      of GPT-2 in a concerning way." He wrote that the release "was 100%
      consistent + foreshadowed OpenAI's current philosophy of iterative
      deployment," and asked: "What part of that was motivated by or premised on
      thinking of AGI as discontinuous? None of it." He added that the post
      seemed to set up a burden of proof "where concerns are alarmist + you need
      overwhelming evidence of imminent dangers to act on them." OpenAI's own
      November 2019 report explains the staged release as a way to "allow time
      for risk analyses and use findings from smaller models to inform the
      actions taken with larger ones," because of "concerns about the larger
      models being misused."
