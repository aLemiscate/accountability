quote: >-
  it should never have been something we had in any documents or communication.
  this is on me and one of the few times i've been genuinely embarrassed running
  openai; i did not know this was happening and i should have.
summary: >-
  Vox had reported that departing employees were asked to sign lifelong
  non-disparagement agreements, and to keep them secret, or risk losing their
  vested equity. Altman said the clawback provision should never have existed
  and that he hadn't known about it.
