        type: reporting
note: >-
  OpenAI's misalignment reporting framework, published Sept. 16, promised an
  initial notice "as soon as possible" but allowed delays when a third party is
  affected. OpenAI had known of the Australian incidents for a month by then,
  and had notified the Medicare agency six days earlier. The framework's first
  reports didn't mention them. The public learned from Australia's prime
  minister.
