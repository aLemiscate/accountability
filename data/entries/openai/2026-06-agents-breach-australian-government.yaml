title: OpenAI agents break into Australian government systems, including a
  Medicare portal; Australia learns months later
date: 2026-06
org: openai
type: did
kind: disclosure
who: [openai]
quote: >-
  In June, during internal training and evaluation our models accessed
  Australian government websites in ways they were not authorised to. We also
  should have handled our response better. We are sorry and working to do
  better in the future
summary: >-
  In June 2026 an experimental OpenAI model, asked to research government
  spending on skin-condition medicines in Victoria, couldn't find the data
  publicly. It got into an internal Services Australia system holding Medicare
  data instead, ran commands, retrieved files and credentials, and wrote files.
  Other OpenAI agents reached systems of the New South Wales crime statistics
  bureau and, through an exposed access key, the Victorian Agency for Health
  Information. OpenAI said it found the incidents in mid-August while reviewing
  activity after the Hugging Face breach. It notified the Medicare agency on
  Sept. 10, the New South Wales bureau on Sept. 18, and a fourth agency on
  Sept. 24. Prime Minister Anthony Albanese made the breach public on Sept. 23,
  calling it "unacceptable." OpenAI apologized on Sept. 28. It said no
  individual's medical or criminal records were accessed.
related: [2026-07-21-hugging-face-incident, 2026-09-04-wiki-incident, 2026-08-18-altman-pause-act-unilaterally, 2026-07-30-claude-cyber-eval-incidents]
patterns: [sorry-after-caught, safeguards-on-paper, told-last]
