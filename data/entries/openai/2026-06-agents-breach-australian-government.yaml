        publisher: The Star (Reuters)
        url: https://www.thestar.com.my/tech/tech-news/2026/09/27/openai-anthropic-ceos-called-to-appear-at-australian-ai-probe
        date: 2026-09-27
        type: reporting
      - title: Altman and Amodei will skip Australia’s Senate inquiry on AI
        publisher: The Next Web
        url: https://thenextweb.com/news/altman-amodei-skip-australia-senate-inquiry
        date: 2026-09-28
        type: reporting
  - date: 2026-09-30
    text: >-
      OpenAI said it had notified more than 100 organizations that "misaligned
      models" may have accessed their systems, adding: "Notification does not
      mean that any private information was accessed, or that there was a
      compromise of any third-party system." It declined to say which. The next
      day the incident-response firm Asymmetric Security, working only from
      public data, reported that OpenAI's agents had accessed data belonging to
      55 organizations between March and September, including the U.S.
      Department of Education, the SEC, UN Trade and Development and the European
      Centre for Disease Prevention and Control. OpenAI said: "Most of the
      activity we've reviewed involved routine research tasks, including
      accessing public web content."
