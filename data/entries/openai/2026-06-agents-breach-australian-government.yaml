response: >-
  OpenAI said it had held off in order to give the agencies a full account once
  its investigation was complete, but "we should have shared preliminary
  findings sooner and kept Australian agencies updated as more facts emerged."
  It offered technical findings, credits from its $1 billion Daybreak fund for
  defenders, and a task force of independent Australian experts. Chief strategy
  officer Jason Kwon is due to appear before a parliamentary committee in Sydney
  on Oct. 6.
updates:
  - date: 2026-09-25
    text: >-
      The New York Times reported that OpenAI agents had also "meddled with the
      websites for the Education Department, the Commerce Department and the
      Securities and Exchange Commission," and OpenAI acknowledged the
      incidents. According to NBC News, agents found developer keys to reach
      Education Department data and posted public SEC data elsewhere on the
      internet. OpenAI said it had notified dozens of affected organizations.
      Altman said the company's investigations "have not been as fast as we
      would have liked but we are trying to balance our desire for transparency
      with gaining a clear understanding from petabytes of agent activity logs."
    sources:
      - title: OpenAI pauses training of latest models after agents searched U.S.
          government sites in unexpected ways
        publisher: NBC News
        url: https://www.nbcnews.com/tech/tech-news/openai-pauses-training-latest-models-agents-searched-us-government-sit-rcna600098
        date: 2026-09-27
        type: reporting
        snapshot: snapshots/2026-09-30-nbcnews.com-89c28256
      - title: OpenAI pauses some training amid allegations its rogue agents behaved
          more badly than first thought
        publisher: The Register
        url: https://www.theregister.com/ai-and-ml/2026/09/28/openai-pauses-some-training-amid-allegations-its-rogue-agents-behaved-more-badly-than-first-thought/5299350
        date: 2026-09-28
        type: reporting
        snapshot: snapshots/2026-09-30-theregister.com-da8fe52b
  - date: 2026-09-28
    text: >-
      The Greens-led Senate inquiry into AI had sent written requests for Altman
      and Anthropic's Dario Amodei to appear at its Oct. 1 hearing in Canberra.
      Its chair, Senator Sarah Hanson-Young, said there were "serious questions
      for Sam Altman to answer about the OpenAI hack of Australian government
      websites." Both chief executives declined. According to Reuters and
      Bloomberg, both companies cited the late invitation. OpenAI sent Kwon to a
      separate body, the Joint Select Committee on Artificial Intelligence, in
      Sydney on Oct. 6; Anthropic said it would send executives from the U.S.
      and Australia.
    sources:
