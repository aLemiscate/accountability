title: Deep research ships on an unreleased o3 with no safety report; the system
  card follows 23 days later
date: 2025-02-02
org: openai
type: did
kind: action
who: [openai]
quote: >-
  We will share our safety insights and safeguards for deep research in a
  system card when we widen access to Plus users.
summary: >-
  OpenAI launched deep research to Pro subscribers, powered by "a version of
  the upcoming OpenAI o3 model" that hadn't been released or documented. The
  launch post didn't describe safety testing. A day later OpenAI added a note
  saying it had run "rigorous safety testing, preparedness evaluations, and
  governance reviews," rated the model Medium risk, and would publish a system
  card when it widened access. The card came on February 25, with the Plus
  rollout. It said this was the first model OpenAI had rated Medium risk for
  cybersecurity.
related: [2023-07-21-white-house-voluntary-commitments, 2025-04-14-gpt-4-1-no-system-card]
