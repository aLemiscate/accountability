updates:
  - date: 2025-02-03
    text: >-
      Miles Brundage, OpenAI's former head of policy research, wrote that with
      a doubling on Humanity's Last Exam and o3-mini "already getting into
      potentially dangerous territory on some capabilities," he was "sad there
      wasn't a system card or even any brief discussion of red teaming."
    sources:
      - title: Miles Brundage on X
        publisher: X
        url: https://x.com/Miles_Brundage/status/1886347097571774875
        date: 2025-02-03
        type: primary
        snapshot: snapshots/2026-09-30-x.com-572db6a3
  - date: 2025-06-10
    text: >-
      OpenAI launched o3-pro without a separate system card: "As o3-pro uses
      the same underlying model as o3, full safety details can be found in the
      o3 system card." Brundage said that if OpenAI
      "didn't do a full Preparedness Framework assessment," it "should just say
      that," adding that "lax processes/corner-cutting/groupthink get more
      dangerous each day."
    sources:
