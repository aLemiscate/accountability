title: 'OpenAI''s board removes Altman: "not consistently candid in his
  communications"'
date: 2023-11-17
org: openai
type: did
kind: disclosure
who: [openai-board-2023, sam-altman]
quote: >-
  not consistently candid in his communications with the board, hindering its
  ability to exercise its responsibilities
summary: >-
  The nonprofit board, the body meant to keep the mission above commercial
  pressure, removed Altman as CEO. Within days, after most staff threatened to
  quit and Microsoft offered to hire them, Altman was reinstated and most of the
  directors who removed him left the board.
patterns: [mission-to-market]
related: [2015-12-11-founded-as-nonprofit]
