    snapshot: snapshots/2026-09-29-openai.com-133307ab
response: >-
  A review by WilmerHale, commissioned by the reconstituted board, found that
  the prior board acted within its broad discretion to remove Altman, but that
  his conduct did not mandate removal. The full report was not published.
updates:
  - date: 2024-05
    text: >-
      Former board member Helen Toner gave her account on the TED AI Show
      podcast: "We learned about ChatGPT on Twitter." She said Altman had not
      told the board he owned the OpenAI Startup Fund, and that "on multiple
      occasions, he gave us inaccurate information about the small number of
      formal safety processes that the company did have in place." Board chair
      Bret Taylor said the board was "disappointed that Ms Toner continues to
      revisit these issues," and that the prior board's decision was not based
      on concerns about safety or finances.
    sources:
      - title: Ex-OpenAI board member accuses Sam Altman of 'outright' lies
        publisher: The Register
        url: https://www.theregister.com/2024/05/29/ex_openai_board_member_accuses_altman_lying/
        date: 2024-05-29
        type: reporting
        archive: https://web.archive.org/web/20260123183734/https://www.theregister.com/2024/05/29/ex_openai_board_member_accuses_altman_lying/
        snapshot: snapshots/2026-10-01-theregister.com-6d11b30d
  - date: 2025-11-04
    text: >-
      A deposition transcript from Musk's lawsuit showed that co-founder and
      chief scientist Ilya Sutskever had written a 52-page memo for the
      independent directors, at their request, making the case for removing
      Altman. It said: "Sam exhibits a consistent pattern of lying, undermining
      his execs, and pitting his execs against one another." Sutskever said much
      of it rested on screenshots supplied by then-CTO Mira Murati. He also
      testified that within 48 hours of the firing the board discussed a merger
      with Anthropic, which he opposed. Former director Helen Toner disputed
      part of his account: "I wasn't the one who made the board<>Anthropic call
      happen, and I disagree with his recollection that board members other than
      him were supportive of a merge."
    sources:
      - title: Inside the Deposition That Showed How OpenAI Nearly Destroyed Itself
        publisher: Decrypt
        url: https://decrypt.co/347349/inside-deposition-showed-openai-nearly-destroyed-itself
        date: 2025-11-04
