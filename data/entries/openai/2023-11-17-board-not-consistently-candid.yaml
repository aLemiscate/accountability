  - date: 2026-04-06
    text: >-
      The New Yorker (Ronan Farrow and Andrew Marantz) reported that the
      WilmerHale review produced no written report and that its findings were
      given in oral briefings. Farrow wrote: "no report about what was found was
      ever released. That’s because none was written." On the Lawfare podcast he
      described "an extremely limited, deliberately undocumented briefing
      process," and said Bret Taylor had told the magazine there was no need for
      a written report. The article drew on memos compiled by Ilya Sutskever and
      more than 200 pages of notes Dario Amodei took at OpenAI, Tech Brew
      reported. Altman called it "an incendiary article" and said he was "not
      proud of handling myself badly in a conflict with our previous board that
      led to a huge mess for the company."
