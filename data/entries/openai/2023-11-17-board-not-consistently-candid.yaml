      - title: Helen Toner on X
        publisher: X
        url: https://x.com/hlntnr/status/1985535076352901365
        date: 2025-11-04
        type: primary
        snapshot: snapshots/2026-09-30-x.com-dc92a529
  - date: 2026-05-06
    text: >-
      In a video deposition played at the Musk v. Altman trial, former CTO Mira
      Murati testified that Altman had told her OpenAI's legal department, then
      headed by Jason Kwon, said a new model (GPT-4 Turbo, according to the New
      Yorker) did not need review by the company's deployment safety board.
      Asked whether Altman was telling the truth, she said "No," and added: "I
      confirmed that what Jason was saying and what Sam was saying were not the
      same thing." The article did not include a response from OpenAI.
    sources:
