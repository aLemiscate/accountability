response: >-
  A review by WilmerHale, commissioned by the reconstituted board, found that
  the prior board acted within its broad discretion to remove Altman, but that
  his conduct did not mandate removal. OpenAI published a summary of the
  findings, not a report.
updates:
  - date: 2024-03-08
    text: >-
      Announcing the review's conclusion, OpenAI said Altman would rejoin the
      board, named three new directors, and adopted new corporate governance
      guidelines, a stronger conflict-of-interest policy, a whistleblower
      hotline and new board committees. Former directors Helen Toner and Tasha
      McCauley said in a joint statement: "We hope the new board does its job
      in governing OpenAI and holding it accountable to the mission," adding
      that "deception, manipulation, and resistance to thorough oversight should
      be unacceptable." The Associated Press noted that OpenAI did not release
      the full report.
