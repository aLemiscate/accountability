        type: reporting
  - date: 2024-05
    text: >-
      Former board member Helen Toner gave her account on the TED AI Show
      podcast: "We learned about ChatGPT on Twitter." She said Altman had not
      told the board he owned the OpenAI Startup Fund, and that "on multiple
      occasions, he gave us inaccurate information about the small number of
      formal safety processes that the company did have in place." Board chair
      Bret Taylor said the board was "disappointed that Ms Toner continues to
      revisit these issues," and that the prior board's decision was not based
      on concerns about safety or finances.
