title: 'GPT-4 launch: it passes a simulated bar exam "with a score around the
  top 10% of test takers"'
date: 2023-03-14
org: openai
type: said
kind: claim
who: [openai, nick-turley, mira-murati, sam-altman]
venue: GPT-4 technical report and launch posts
quote: >-
  GPT-4 exhibits human-level performance on various professional and academic
  benchmarks, including passing a simulated bar exam with a score around the top
  10% of test takers.
summary: >-
  OpenAI launched GPT-4 with a technical report whose abstract put its score on
  a simulated Uniform Bar Exam "around the top 10% of test takers." Staff
  repeated it ("Top 10% on the Bar," Nick Turley wrote), and it became one of
  the most widely cited facts about the model. In 2024 the journal Artificial
  Intelligence and Law published a re-analysis by Eric Martínez finding that the
  near-90th-percentile figure came from conversions based on February
  administrations of the Illinois bar exam, which are heavily weighted toward
  repeat takers who failed in July. Data from a July administration put GPT-4
  below the 69th percentile overall; against first-time takers, about the 62nd;
  and against those who passed, about the 48th overall and 15th on the essays.
concreteness: measurable
status: contradicted
patterns: [claims-outrun-results]
related: [2025-10-gpt-5-erdos-claim]
