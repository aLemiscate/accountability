title: 'Superalignment Fast Grants: "$1e7 in grants" for research on aligning
  superhuman models, paid out'
date: 2023-12-14
org: openai
type: said
kind: commitment
who: [jan-leike, openai]
venue: Superalignment Fast Grants announcement, posts on X
quote: >-
  We're distributing $1e7 in grants for research on making superhuman models
  safer and more aligned.
summary: >-
  OpenAI and Eric Schmidt announced $10 million in grants for technical research
  on aligning superhuman AI systems, run by the Superalignment team, with
  applications due Feb. 18, 2024. On April 10, 2024, team co-lead Jan Leike
  reported the results: 50 of about 2,700 applications funded, for a total of
  $9,895,000, with grants from $50,000 to $500,000, mostly to universities and
  graduate students. A month later Leike resigned and the Superalignment team
  was dissolved.
