        snapshot: snapshots/2026-10-01-pymnts.com-68e76f8a
note: >-
  Altman made this line specific enough to check, so it's on the watchlist.
  Sponsored Agents stay on the right side of it as described: the advertiser
  talks in its own labeled window, not in ChatGPT's answer.
