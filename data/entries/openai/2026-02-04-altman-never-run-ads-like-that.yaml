title: 'Altman on ads in answers: "we would obviously never run ads in the way
  Anthropic depicts them"'
date: 2026-02-04
org: openai
type: said
kind: commitment
who: [sam-altman]
venue: Post on X, replying to Anthropic's Super Bowl campaign
quote: >-
  We would obviously never run ads in the way Anthropic depicts them. We are not
  stupid and we know our users would reject that.
summary: >-
  Anthropic's Super Bowl spots showed a chatbot, clearly meant to be an
  ad-supported ChatGPT, weaving a product pitch into its answer. Altman called
  the ads funny but "clearly dishonest," saying OpenAI's most important
  principle for ads rules out exactly that. He also called the campaign
  "Anthropic doublespeak."
concreteness: measurable
status: open
breaks_if: >-
  A paid placement appears inside ChatGPT's own answer text, or ChatGPT
  recommends a product in its answer because of an advertiser relationship,
  instead of in a separate, labeled ad unit.
patterns: []
related: [2026-01-16-ad-principles, 2026-02-04-claude-ad-free]
