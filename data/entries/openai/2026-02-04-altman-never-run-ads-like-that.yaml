updates:
  - date: 2026-09-16
    text: >-
      OpenAI began testing "Sponsored Agents": after seeing an ad, a user can
      open a separate, labeled conversation with a business's agent. OpenAI said
      these conversations are "separate from the original conversation in
      ChatGPT and from ChatGPT's independent answers." By Aug. 31 it said
      ChatGPT ads had reached a $1 billion annualized revenue run rate.
    sources:
      - title: OpenAI Tests Sponsored AI Agents in ChatGPT Ads
        publisher: PYMNTS
