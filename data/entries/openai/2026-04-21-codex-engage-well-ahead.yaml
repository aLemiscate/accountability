updates:
  - date: 2026-08-25
    text: >-
      On July 12 Sottiaux had announced it was "temporarily removing the 5 hour
      usage limit restriction for all Plus, Business and Pro plans." In
      August, as users reported limits draining faster, he wrote that changing
      limits was "not something we change without engaging the community and
      being transparent"; two days later OpenAI found several inefficiencies,
      including worse cache hit rates, fixed them and reset usage for all paid
      subscribers. On Aug. 25 he announced: "Tomorrow we will bring back the 5h
      limit for Plus accounts across ChatGPT Work and Codex. I had mentioned
      this a while ago, but then postponed it." Pro plans kept no five-hour
      limit "for the upcoming months."
