title: 'Standing promise: Codex stays in Free and Plus, and "for important changes,
  we will engage with the community well ahead of making them"'
date: 2026-04-21
org: openai
type: said
kind: commitment
who: [thibault-sottiaux, openai]
venue: Post on X by the head of Codex, reposted by Sam Altman
quote: >-
  Codex will continue to be available both in the FREE and PLUS ($20) plans. We
  have the compute and efficient models to support it. For important changes,
  we will engage with the community well ahead of making them.
summary: >-
  Codex usage limits moved often after it was bundled into ChatGPT plans in
  August 2025, when its product lead said "Pro users should basically not hit
  limits." Cloud tasks began counting toward limits that October, and a
  billing bug overcharged cloud-task usage "by ~2-5x" before OpenAI reset
  limits and refunded credits. Days later Sottiaux said optimizations meant
  users would "get the same usage throughout the day irrespective of the load
  or how traffic is routed," where before "you could get unlucky and hit a few
  cache misses in a row." On April 9, 2026 OpenAI ended a Plus promotion
  and "rebalanced" Plus Codex usage toward shorter sessions, alongside a new
  $100 Pro tier. On April 21, the day Anthropic was found testing Pro plans
  without Claude Code, Codex head Thibault Sottiaux promised Codex would stay
  in Free and Plus and that users would hear about important changes well in
  advance: "Transparency and trust are two principles we will not break, even
  if it means momentarily earning less." Altman reposted it.
concreteness: directional
status: open
breaks_if: >-
  Codex removed from the Free or Plus plan, or a material cut to Plus or Free
  Codex usage announced less than a few days before it takes effect.
related: [2026-04-03-claude-subscriptions-third-party-tools]
