title: OpenAI previews "Private Inference," confidential computing for its
  models, and says it is coming this fall
date: 2026-09-29
org: openai
type: said
kind: commitment
who: [openai, sam-altman]
venue: DevDay 2026 keynote
quote: >-
  [Zero Data Retention] with private safety processing delivers frontier model
  safety without storing your content on our servers at all, and with private
  inference, we can even provide privacy at the time of inference … Together, we
  think these set a new standard for privacy and frontier AI.
summary: >-
  Altman announced "Private Intelligence," an umbrella for two things. Zero Data
  Retention with Private Safety Processing, available now, runs OpenAI's safety
  review without its staff seeing customer content: content picked out by a
  safety classifier or a sampling policy is encrypted and kept for 30 days in
  storage the customer controls, and OpenAI keeps an index pointing to it.
  Private Inference, marked "in preview" on the keynote slide, is to apply
  confidential computing with verifiable controls to the model's processing
  itself; OpenAI said it was coming this fall and disclosed little else about
  it. Since April, OpenAI's data-controls page has reserved the right to make
  models ineligible for zero data retention for specific customers.
concreteness: measurable
status: open
last_checked: 2026-10-14
due: '2026-12'
breaks_if: >-
  Private Inference is not available to customers beyond a preview by the end of
  December 2026, or launches without the verifiable controls OpenAI described.
patterns: [coming-weeks]
related: [2026-09-01-enterprise-frontier-safeguards-this-fall]
