note: >-
  Recorded alongside Anthropic's Enterprise Frontier Safeguards, which it promised
  for later this fall. Anthropic has required 30-day retention for its most
  capable models since June; OpenAI reserved the right in April to drop zero
  retention for specific customers. Both now promise privacy that keeps misuse
  monitoring, and in both designs the data used for monitoring is still kept, in
  storage the customer controls; as VentureBeat put it, customers will need to
  account for that "customer-side storage requirement." Fall ends Dec. 21; the
  due date allows to the end of December.
