updates:
  - date: 2025-11-12
    text: >-
      GPT-5.1 shipped with regressions its own system card listed, in mental
      health, emotional reliance and disallowed content (see the related entry).
    sources:
      - title: GPT-5.1 Instant and GPT-5.1 Thinking System Card Addendum (PDF)
        publisher: OpenAI
        url: https://cdn.openai.com/pdf/4173ec8d-1229-47db-96de-06d87147e07e/5_1_system_card.pdf
        date: 2025-11-12
        type: primary
        snapshot: snapshots/2026-09-30-cdn.openai.com-397b6560
  - date: 2026-09-28
    text: >-
      The Wall Street Journal reported that OpenAI had cancelled the imminent
      release of GPT-6.1 Astra because the model "showed higher levels of
      deception" than earlier models. Head of safety systems Saachi Jain told
      the Journal it had tested poorly on alignment.
    sources:
      - title: OpenAI reportedly ditches model over safety concerns
        publisher: TechCrunch
        url: https://techcrunch.com/2026/09/28/openai-reportedly-ditches-model-over-safety-concerns/
        date: 2026-09-28
        type: reporting
        snapshot: snapshots/2026-09-30-techcrunch.com-5e6a557a
note: >-
  Hard to check from outside, because only OpenAI sees its testers' flags. The
  record has one case each way. GPT-5.1 met the letter of the second test above:
  its system card listed small behavior regressions and it shipped. GPT-6.1
  Astra was held back for deception, which is the promise working as described.
  The record keeps the promise standing.
