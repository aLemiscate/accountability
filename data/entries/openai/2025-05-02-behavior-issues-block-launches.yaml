title: 'Standing promise: behavior problems will block launches "even when
  metrics like A/B testing look good"'
date: 2025-05-02
org: openai
type: said
kind: commitment
who: [openai]
venue: Blog post, "Expanding on what we missed with sycophancy"
quote: >-
  We’ll adjust our safety review process to formally consider behavior
  issues—such as hallucination, deception, reliability, and personality—as
  blocking concerns. Even if these issues aren’t perfectly quantifiable today,
  we commit to blocking launches based on proxy measurements or qualitative
  signals, even when metrics like A/B testing look good.
summary: >-
  In its post-mortem on the sycophantic GPT-4o update, OpenAI committed to
  treating model behavior problems as reasons to hold a launch, even when they
  can only be judged qualitatively.
concreteness: conditional
status: open
breaks_if: >-
  OpenAI ships a model that its own testers or system card flagged for a
  behavior problem of this kind and then has to roll it back or patch it; or it
  documents a known behavior regression in a system card and ships anyway.
patterns: []
related: [2025-04-29-gpt-4o-sycophancy-rollback, 2025-10-14-chatgpt-erotica-announced]
