updates:
  - date: 2026-09-09
    text: >-
      OpenAI added alignment researcher Paul Christiano to the Foundation board
      and its Safety and Security Committee, which TechCrunch reported has the
      final say on model releases. He also became a non-voting observer on the
      PBC board. Christiano wrote that he did not think the industry, "including
      OpenAI, is currently on track to reduce this risk to an acceptable level."
