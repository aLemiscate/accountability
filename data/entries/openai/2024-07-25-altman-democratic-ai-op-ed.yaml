title: 'Altman op-ed: AI''s future must be democratic, not authoritarian'
date: 2024-07-25
org: openai
type: said
kind: principle
who: [sam-altman]
venue: Washington Post op-ed, "Who will control the future of AI?"
quote: >-
  Will it be one in which the United States and allied nations advance a global
  AI that spreads the technology's benefits and opens access to it, or an
  authoritarian one, in which nations or movements that don't share our values
  use AI to cement and expand their power?
summary: >-
  Altman framed AI development as a contest between democracies and
  authoritarian states. He argued that "infrastructure is destiny" and that
  compute should be built with allies.
concreteness: aspirational
status: eroded
patterns: [principles-with-a-price, unfalsifiable]
