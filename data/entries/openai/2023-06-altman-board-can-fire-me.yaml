note: >-
  The board's power to fire him was real, and it was used. What the episode
  showed is that the power didn't hold once employees and investors pushed back.
  TIME's summary: "this accountability was a mirage." In 2020, on Azeem Azhar's
  Exponential View, Altman had put the point more broadly: "our board of
  directors, which is also not publicly accountable, can fire me and say, let's
  try somebody else. But it feels to me like at that point, at some level of
  power, the world as a whole should be able to say like, hey, maybe we need a
  new leader of this company." (Quoted from the audio; the interview was
  rebroadcast in May 2023.)
