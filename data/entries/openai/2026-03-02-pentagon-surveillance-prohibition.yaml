title: 'Standing promise: no domestic surveillance of U.S. persons under the
  Pentagon contract'
date: 2026-03-02
org: openai
type: said
kind: commitment
who: [openai, sam-altman]
venue: Amended Department of War contract, as described by OpenAI
quote: >-
  the AI system shall not be intentionally used for domestic surveillance of
  U.S. persons and nationals.
summary: >-
  After backlash, OpenAI said its amended Pentagon contract explicitly bars
  using its technology for domestic surveillance of U.S. persons, and that it
  keeps red lines against its models independently directing autonomous weapons.
concreteness: conditional
status: open
breaks_if: >-
  Credible reporting of OpenAI models used in domestic surveillance of U.S.
  persons; a later amendment that narrows the prohibition; or a change in law or
  Pentagon policy that makes a prohibited use "lawful" while OpenAI keeps the
  contract.
patterns: [unfalsifiable]
sources:
  - title: Sam Altman on X (re-post of an internal memo on the amendments)
    publisher: X
    url: https://x.com/sama/status/2028640354912923739
    date: 2026-03-02
    type: primary
    snapshot: snapshots/2026-09-29-x.com-5113866d
  - title: OpenAI's Altman admits defense deal 'looked opportunistic and sloppy'
      amid backlash
    publisher: CNBC
    url: https://www.cnbc.com/2026/03/03/openai-sam-altman-pentagon-deal-amended-surveillance-limits.html
    date: 2026-03-03
    type: reporting
    archive: https://web.archive.org/web/20260929223118/https://www.cnbc.com/2026/03/03/openai-sam-altman-pentagon-deal-amended-surveillance-limits.html
    snapshot: snapshots/2026-09-29-cnbc.com-8ac92d09
  - title: Jason Kwon on X ("date stamps")
    publisher: X
    url: https://x.com/jasonkwon/status/2027948755467833366
    date: 2026-03-01
    type: primary
    snapshot: snapshots/2026-09-30-x.com-bd1da095
response: >-
  Asked on March 1 how the red lines would survive a later change in the law,
  OpenAI's chief strategy officer Jason Kwon said the contract "date stamps" the
  relevant policy directive or law: "That's what we did." The contract text has
  not been published, so this can't be checked.
updates:
  - date: 2026-03-03
    text: >-
      Katrina Mulligan, OpenAI's head of national security, had pledged a
      "clear and more comprehensive explanation" of the relevant contract terms,
      including how the NSA is excluded. Days later, with no explanation
      published, she told a user on X: "I do not agree that I'm obligated to
      share contract language with you." Asked whether the contract allowed the
      Pentagon to collect and analyze commercially available data at scale, she
      replied that "the Pentagon has no legal authority to do this." The
      Intercept pointed to a declassified 2022 report from the Office of the
      Director of National Intelligence describing exactly that kind of
      collection by the Defense Department. This record found no fuller
      explanation published later.
    sources:
      - title: 'OpenAI on Surveillance and Autonomous Killings: You''re Going to Have to
          Trust Us'
        publisher: The Intercept
        url: https://theintercept.com/2026/03/08/openai-anthropic-military-contract-ethics-surveillance/
        date: 2026-03-08
        type: reporting
        snapshot: snapshots/2026-09-29-theintercept.com-1e0ad3e1
      - title: Steven Adler on X ("promised … of how the NSA is excluded")
        publisher: X
        url: https://x.com/sjgadler/status/2028899096283758732
        date: 2026-03-03
        type: primary
        snapshot: snapshots/2026-09-30-x.com-6bd9fe32
note: >-
  The contract isn't public, so outsiders can't check compliance. The promise
  works on trust, which is exactly what this record is testing. Note the word
  "intentionally," and that buying commercially available data about Americans
  doesn't require a warrant.
