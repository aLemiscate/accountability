  - date: 2026-03-03
    text: >-
      OpenAI researcher Noam Brown, who had earlier relayed that "The contract
      does not allow NSA Title 50 work," wrote that "the original language in
      the OpenAI / DoW agreement left legitimate questions unanswered,
      especially around some novel ways that AI could potentially enable legal
      surveillance," and that deployment "to the NSA and all other DoW
      intelligence agencies will be withheld so that there is time to address
      these loopholes through the democratic process before deployment."
