  - date: 2026-03-01
    text: >-
      In the same Q&A, asked what would make OpenAI walk away from a government
      partnership, Altman wrote: "If we were asked to do something
      unconstitutional or illegal, we will walk away. Please come visit me in
      jail if necessary." Asked whether OpenAI would "commit to publishing every
      future red line change with a public explanation and a mandatory notice
      period before it takes effect," he replied: "Yes, this seems like a very
      good idea. I will talk to the team." By October 2026 this record had found
      no such policy published, and the contract text remains withheld.
    sources:
