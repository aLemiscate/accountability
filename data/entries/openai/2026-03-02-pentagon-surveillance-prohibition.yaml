response: >-
  Asked on March 1 how the red lines would survive a later change in the law,
  OpenAI's chief strategy officer Jason Kwon said the contract "date stamps" the
  relevant policy directive or law: "That's what we did." The contract text has
  not been published, so this can't be checked.
updates:
  - date: 2026-03-01
    text: >-
      The day before the amendment, OpenAI researcher Boaz Barak answered
      questions about the original agreement. Asked whether it barred the
      Pentagon from using OpenAI models to analyze commercially purchased data
      on Americans, he wrote that the Pentagon had not asked for "collection or
      analysis of bulk data on Americans, such as geolocation data, web browsing
      data and personal financial information purchased from data brokers, and
      our agreement does not permit it." Asked where the agreement said so, he
      wrote that OpenAI's legal and policy teams "will provide more details on
      the the issue of commercially acquired datasets in the coming days." He
      also wrote: "When we say that domestic mass surveillance and autonomous
      lethal weapons are red lines for us, we mean what we say, and are not
      looking for loopholes." The next day OpenAI added language that, "for the
      avoidance of doubt," extends the prohibition to "the procurement or use of
      commercially acquired personal or identifiable information."
