  - date: 2026-03-03
    text: >-
      Katrina Mulligan, OpenAI's head of national security, had pledged a "clear
      and more comprehensive explanation" of the relevant contract terms,
      including how the NSA is excluded. Days later, with no explanation
      published, she told a user on X: "I do not agree that I'm obligated to
      share contract language with you." Asked whether the contract allowed the
      Pentagon to collect and analyze commercially available data at scale, she
      replied that "the Pentagon has no legal authority to do this." The
      Intercept pointed to a declassified 2022 report from the Office of the
      Director of National Intelligence describing exactly that kind of
      collection by the Defense Department. This record found no fuller
      explanation published later.
    sources:
