title: 'GPT-4o launch: "the new voice mode will be live in the coming weeks for
  plus users"'
date: 2024-05-13
org: openai
type: said
kind: commitment
who: [sam-altman, openai]
venue: GPT-4o launch event and posts on X
quote: >-
  the new voice mode will be live in the coming weeks for plus users.
summary: >-
  OpenAI's GPT-4o launch demonstrated a real-time voice assistant that could see
  through the phone's camera, and image generation from the same model. Altman
  said the voice mode would reach Plus subscribers "in the coming weeks." On
  June 25 OpenAI said it had planned an alpha "in late June, but need one more
  month to reach our bar to launch." A small group of Plus users got it on July
  30, with "all Plus users in fall," Mira Murati wrote; it reached all Plus and
  Team users on Sept. 24, about nineteen weeks after the demo. Video and screen
  sharing in voice followed on Dec. 12. GPT-4o's image generation, which Greg
  Brockman said in May the team was "working hard to bring" to users, shipped on
  March 25, 2025, ten months after it was shown.
concreteness: directional
status: kept
patterns: [coming-weeks]
related: [2024-05-13-her-sky-voice]
