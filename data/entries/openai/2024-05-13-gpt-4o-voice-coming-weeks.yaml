response: >-
  OpenAI said the delay was to "reach our bar to launch," including safety work
  on the voice model. When the rollout finished it said: "While you’ve been
  patiently waiting, we’ve added Custom Instructions, Memory, five new voices,
  and improved accents."
note: >-
  Kept, and the delay was announced rather than left to lapse. "Coming weeks"
  turned out to mean about four months for voice and ten for images.
