title: 'OpenAI''s Kevin Weil: GPT-5 "found solutions to 10 (!) previously
  unsolved Erdős problems"; the solutions were already published'
date: 2025-10
org: openai
type: said
kind: claim
who: [kevin-weil, openai]
venue: Post on X, since deleted
quote: >-
  GPT-5 found solutions to 10 (!) previously unsolved Erdős problems and made
  progress on 11 others.
summary: >-
  In October 2025 OpenAI's vice president for science, Kevin Weil, posted that
  GPT-5 had solved ten open Erdős problems, which The Decoder reported he
  described as "open for decades"; other OpenAI researchers repeated the claim.
  Thomas Bloom, the mathematician who maintains the Erdős problems website the
  list came from, called it "a dramatic misrepresentation": a problem listed as
  open there meant only that he was unaware of a paper solving it, and "GPT-5
  found references, which solved these problems, that I personally was unaware
  of." Google DeepMind's chief executive Demis Hassabis called it
  "embarrassing." Weil deleted the post, and OpenAI researcher Sébastien Bubeck
  acknowledged that "only solutions in the literature were found."
concreteness: measurable
status: contradicted
patterns: [claims-outrun-results]
related: [2026-05-08-blackmail-completely-eliminated]
sources:
  - title: Leading OpenAI researcher announced a GPT-5 math breakthrough that never
      happened
    publisher: The Decoder
    url: https://the-decoder.com/leading-openai-researcher-announced-a-gpt-5-math-breakthrough-that-never-happened/
    date: 2025-10-18
    type: reporting
    snapshot: snapshots/2026-10-03-the-decoder.com-43c24417
  - title: OpenAI's 'embarrassing' math
    publisher: TechCrunch
    url: https://techcrunch.com/2025/10/19/openais-embarrassing-math/
    date: 2025-10-19
    type: reporting
    archive: https://web.archive.org/web/20261003095306/https://techcrunch.com/2025/10/19/openais-embarrassing-math/
    snapshot: snapshots/2026-10-03-techcrunch.com-2de87462
response: >-
  Bubeck said the episode still showed something real: "I know how hard it is to
  search the literature." GPT-5's use as a literature-search tool for
  mathematicians was the part outside experts agreed on.
updates:
  - date: 2026-05-20
    text: >-
      OpenAI announced that a new general-purpose reasoning model had disproved
      a 1946 Erdős conjecture on the planar unit distance problem, and this time
      published supporting remarks from mathematicians including Noga Alon,
      Melanie Wood and Bloom himself, who said: "AI is helping us to more fully
      explore the cathedral of mathematics we have built over the centuries."
    sources:
      - title: OpenAI claims it solved an 80-year-old math problem — for real this time
        publisher: TechCrunch
        url: https://techcrunch.com/2026/05/20/openai-claims-it-solved-an-80-year-old-math-problem-for-real-this-time/
        date: 2026-05-20
        type: reporting
        archive: https://web.archive.org/web/20261003095421/https://techcrunch.com/2026/05/20/openai-claims-it-solved-an-80-year-old-math-problem-for-real-this-time/
        snapshot: snapshots/2026-10-03-techcrunch.com-79327958
note: >-
  The record pairs this with Anthropic's "completely eliminated" claim: in both,
  a real result was announced in bigger words than it supported, and outsiders
  or the company's own researchers corrected it. OpenAI's later result came with
  outside mathematicians' endorsement.
