response: >-
  OpenAI said "Learning from real-world use has allowed us to improve our safety
  systems, making wider availability possible today," and that it had "built new
  detection and response techniques to stop misuse" before allowing face
  editing.
note: >-
  A staged rollout, widened step by step and each step announced, which is how
  the record treats it: reversed openly, not broken. Stable Diffusion, released
  openly that August, offered similar capabilities without such controls.
