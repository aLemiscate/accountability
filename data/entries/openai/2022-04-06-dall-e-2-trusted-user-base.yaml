title: 'DALL-E 2 launch: its signature is "not robust against serious misuse ...
  so now we lean more on small/trusted user base"'
date: 2022-04-06
org: openai
type: said
kind: policy
who: [miles-brundage, steven-adler, openai]
venue: Posts on X by OpenAI policy staff at the DALL-E 2 launch
quote: >-
  Obviously not robust against serious misuse (we call it a signature, v
  watermark), so now we lean more on small/trusted user base.
summary: >-
  OpenAI released DALL-E 2 in April 2022 to a waitlisted preview, for
  non-commercial use only, rejecting uploads of realistic faces and making the
  model "less-capable of repeating public figures' faces," as staff member
  Steven Adler put it. Asked about the colored squares stamped on each image,
  policy research lead Miles Brundage said they were not a robust safeguard,
  which is why OpenAI was relying on a small, trusted group of users. By July 20
  the preview had passed 100,000 users and OpenAI moved to reach about a million
  within weeks, began charging, and granted full commercial rights. On Sept. 19
  it let users upload and edit real people's faces, and on Sept. 28 it removed
  the waitlist so anyone could sign up, with more than 1.5 million active users.
  It said improved safety systems made each step possible.
concreteness: directional
status: reversed
related: [2020-07-22-gpt-3-api-safety-review]
