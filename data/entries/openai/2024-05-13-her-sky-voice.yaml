response: >-
  OpenAI said Sky was voiced by a different professional actress and was not
  meant to imitate Johansson. "Out of respect for Ms. Johansson, we have paused
  using Sky's voice in our products. We are sorry to Ms. Johansson that we
  didn't communicate better."
note: >-
  In October 2023, weeks after the first request to Johansson by her account,
  Altman told the Wall Street Journal's Tech Live conference that he had "deep
  misgivings about this vision of the future where everyone is like super close
  to AI friends." He said ChatGPT was given that name "and not a person's name
  very intentionally," and that "we do a bunch of subtle things in the way you
  use it to like make it clear that you're not talking to a person." (Quoted
  from the audio.)
