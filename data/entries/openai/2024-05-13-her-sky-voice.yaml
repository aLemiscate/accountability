title: '"her": the Sky voice and Scarlett Johansson'
date: 2024-05-13
org: openai
type: did
kind: action
who: [sam-altman, openai]
venue: Post on X, GPT-4o launch day
quote: her
summary: >-
  On GPT-4o launch day, Altman posted one word, "her," the film in which
  Scarlett Johansson voices an AI. Johansson said Altman had asked her to voice
  ChatGPT the previous September and again two days before launch, and that she
  declined. "Nine months later, my friends, family and the general public all
  noted how much the newest system named 'Sky' sounded like me." OpenAI paused
  the Sky voice.
patterns: [take-first, sorry-after-caught]
