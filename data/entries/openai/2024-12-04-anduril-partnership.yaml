title: OpenAI partners with defense contractor Anduril on counter-drone systems
date: 2024-12-04
org: openai
type: did
kind: action
who: [openai]
summary: >-
  Eleven months after dropping "military and warfare" from its usage policy,
  OpenAI announced a partnership with Anduril to "develop and responsibly
  deploy advanced artificial intelligence (AI) solutions for national security
  missions," starting with systems that "detect, assess and respond to
  potentially lethal aerial threats in real-time." Anduril did not
  answer CNBC's question about whether reducing the burden on human operators
  would mean fewer humans in the loop. COO Brad Lightcap posted: "anduril 🤝
  openai."
related: [2024-01-10-military-ban-removed, 2025-06-16-defense-contract-200m, 2024-11-07-palantir-aws-defense]
