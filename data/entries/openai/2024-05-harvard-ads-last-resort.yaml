updates:
  - date: 2024-05-30
    text: >-
      When OpenAI made its top model free to use, Nick Turley, who leads
      ChatGPT, wrote that he was "proud to work at a place where giving the
      benefits of AI away for free (& no ads) is the obvious call."
    sources:
      - title: Nick Turley on X
        publisher: X
        url: https://x.com/nickaturley/status/1796062176588828946
        date: 2024-05-30
        type: primary
        snapshot: snapshots/2026-09-29-x.com-5a34089a
  - date: 2025-10-17
    text: >-
      Asked by Tyler Cowen how important ads would be, Altman said: "I expect
      it's something we'll try at some point. I do not think it is our biggest
      revenue opportunity." He drew the line at paid ranking: "If ChatGPT were
      accepting payment to put a worse hotel above a better hotel, that's
      probably catastrophic for your relationship with ChatGPT."
    sources:
      - title: Sam Altman on Trust, Persuasion, and the Future of Intelligence -
          Live at the Progress Conference (Ep. 259)
        publisher: Conversations with Tyler
        url: https://conversationswithtyler.com/episodes/sam-altman-2/
        date: 2025-11-05
        type: primary
  - date: 2025-12-06
    text: >-
      Six weeks before the ads announcement, Turley answered rumors: "There are
      no live tests for ads – any screenshots you’ve seen are either not real or
      not ads. If we do pursue ads, we’ll take a thoughtful approach."
    sources:
      - title: Nick Turley on X
        publisher: X
        url: https://x.com/nickaturley/status/1997120491589349440
        date: 2025-12-06
        type: primary
        archive: https://web.archive.org/web/20260131191110/https://x.com/nickaturley/status/1997120491589349440
        snapshot: snapshots/2026-09-29-x.com-72641130
note: >-
  Altman never ruled ads out. Asked at his May 2023 Senate hearing whether
  OpenAI would ever run ads, he said: "I wouldn't say never," adding, "I really
  like having a subscription-based model." The same day he told the committee
  OpenAI was "not an advertising-based model." In March 2024 he told Lex
  Fridman, "We don't run ads on our free version," and that OpenAI could have "a
  great business that pays for our compute needs without ads." When Fridman said
  he didn't want to rule ads out entirely, Altman replied: "I'm not saying that.
  I guess I'm saying I have a bias against them."
