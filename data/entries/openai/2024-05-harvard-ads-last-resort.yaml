title: 'Altman: ads plus AI is "uniquely unsettling," a "last resort"'
date: 2024-05
org: openai
type: said
kind: principle
who: [sam-altman]
venue: Fireside chat, Harvard University
quote: ads-plus-AI is sort of uniquely unsettling to me
summary: >-
  Altman called advertising a "last resort" for OpenAI's business model. He said
  he liked that paying users knew their answers weren't shaped by advertisers.
concreteness: directional
status: reversed
patterns: [mission-to-market, principles-with-a-price]
