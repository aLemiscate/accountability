title: OpenAI lowers the GPT-4 cap for ChatGPT Plus from 50 to 40 messages every
  3 hours, six months after announcing the increase to 50
date: 2024-01-05
org: openai
type: did
kind: action
who: [openai]
quote: >-
  As of January 5th 2024, GPT-4 has a limit of 40 messages every 3 hours.
summary: >-
  When GPT-4 came to ChatGPT Plus in March 2023, OpenAI's help article said
  "We’re initially providing subscribers with 100 messages every 4 hours" and
  that it would "dynamically adjust the exact usage cap depending on demand and
  system performance in practice." By June the article said 25 messages every 3
  hours. On July 19, 2023 OpenAI announced on Twitter that it was "doubling the
  number of messages ChatGPT Plus customers can send to GPT-4" to 50 every 3
  hours. Between January 5 and January 6, 2024, the article's sentence changed
  to "As of January 5th 2024, GPT-4 has a limit of 40 messages every 3 hours," a
  fifth fewer. The dated sentence was the only notice found: no post on OpenAI's
  Twitter accounts announced it. Later in January the article added that OpenAI
  "may dynamically adjust the message limit in order to prioritize making GPT-4
  accessible to the widest number of people." The 40-message cap stayed until
  GPT-4o arrived in May 2024 with 80 messages every 3 hours.
patterns: [shrinking-plan]
related: [2024-04-claude-pro-allowance-lowered]
