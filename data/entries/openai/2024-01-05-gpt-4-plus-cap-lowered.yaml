response: >-
  No statement from OpenAI about the change was found beyond the dated sentence
  on the help page.
note: >-
  Like Anthropic's Claude Pro page, this describes a cap that OpenAI always said
  could move with demand, so it records a change in what OpenAI told
  subscribers, not a measured cut. Unlike Anthropic's page, OpenAI's put a date
  on the new figure. Found by reading every archived version of the page in
  order.
