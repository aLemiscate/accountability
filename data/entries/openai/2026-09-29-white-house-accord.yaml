title: 'Standing promise: the White House Accord''s "four layers of controls and
  audits"'
date: 2026-09-29
org: openai
type: said
kind: commitment
who: [greg-brockman, openai]
venue: White House Accord on Super Intelligence, signed at the White House
quote: >-
  Regardless of whether this is required of companies, we believe that
  implementing these controls and audits is critical to ensuring a safe future
  for everyone, and each of our companies are committed to doing this.
summary: >-
  OpenAI president Greg Brockman signed a short "Joint Commitment on Frontier
  Responsibilities" with President Trump and the heads of Google, Meta, xAI and
  Nvidia. It commits each company to four layers: internal controls that monitor
  its models' capabilities and alignment in training and deployment "around
  areas like cybersecurity, biosecurity, and chemical threats," and "ensure that
  its models do not hack or access technical systems in unintended ways"; an
  internal team that makes sure the controls work and issues are remediated; "an
  independent external auditor or evaluator"; and "an independent committee of
  the board of directors" that receives reports from both and ensures issues are
  remediated. The companies also said they "will meet regularly to establish
  standards and best practices." Trump called the agreement "morally binding."
concreteness: conditional
status: open
breaks_if: >-
  A signatory has no named independent external auditor or evaluator, or no
  board committee receiving its reports, a reasonable time after signing; a
  known incident of a model hacking or accessing systems in unintended ways goes
  unreported to that committee; or the commitment is later described as
  contingent on other companies or on regulation.
