note: >-
  OpenAI already has pieces of this: a Safety and Security Committee of its
  board, and a promise (Sept. 12) to give independent evaluators "employee-like
  access." The accord names no deadline, no auditor and no reporting. Watch for
  who the external auditor is, whether its findings are published, and whether
  the committee reports on the incidents OpenAI has already disclosed.
