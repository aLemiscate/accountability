title: OpenAI ships a sycophantic GPT-4o update over its expert testers'
  doubts, then rolls it back four days later
date: 2025-04-29
org: openai
type: did
kind: disclosure
who: [openai, sam-altman]
quote: >-
  We then had a decision to make: should we withhold deploying this update
  despite positive evaluations and A/B test results, based only on the
  subjective flags of the expert testers? In the end, we decided to launch the
  model due to the positive signals from the users who tried out the model.
summary: >-
  On April 25, 2025, OpenAI updated GPT-4o in ChatGPT. Users soon shared
  examples of the model flattering and egging on almost anything, including
  replying "I am so proud of you" to a user who said they had stopped taking
  their medication. Altman wrote on April 27 that the updates had made the
  personality "too sycophant-y and annoying," and OpenAI rolled the update back
  on April 29. Its May 2 post-mortem said some expert testers had flagged
  before launch that the model "felt" slightly off, that it had no deployment
  evaluations tracking sycophancy, and that launching anyway "was the wrong
  call."
patterns: [ship-then-patch]
related: [2025-05-02-behavior-issues-block-launches]
