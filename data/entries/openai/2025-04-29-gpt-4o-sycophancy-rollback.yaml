updates:
  - date: 2025-11-23
    text: >-
      A New York Times investigation, based on interviews with more than 40
      current and former employees, reported that the rolled-back update
      (internally "HH") had won A/B tests because users preferred it and
      returned more often. OpenAI's Model Behavior team had flagged its
      sycophancy in a Slack channel before launch. The version OpenAI reverted
      to, from March ("GG"), was also one of the "sycophant-y" updates Altman
      had named, and it stayed the default. The Times reported that OpenAI had
      no sycophancy test at the time, while Anthropic had built one in 2022. In
      October 2025, after safer models, ChatGPT head Nick Turley declared a
      "Code Orange" over competitive pressure, according to four employees. The
      accompanying memo set a goal of raising daily active users by 5% by the
      end of the year. OpenAI's spokesperson said the aim was "healthy
      engagement."
