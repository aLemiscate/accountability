title: Altman expects GPT-5.2-level intelligence to cost at least 100 times less
  by the end of 2027
date: 2026-01-26
org: openai
type: said
kind: claim
who: [sam-altman, openai]
venue: OpenAI Town Hall with AI builders, livestreamed on YouTube
quote: >-
  GPT 5.2x level intelligence by the end of 2027 for at least 100x less
summary: >-
  At a livestreamed town hall with developers, Altman said OpenAI expects to
  deliver intelligence at the level of GPT-5.2 for at least a hundredth of the
  price by the end of 2027. He added that OpenAI had paid less attention to
  speed, and that some users would pay more for answers delivered in a fraction
  of the time. 36Kr's translated account has him calling it a goal: "to reduce
  the intellectual cost at the level of GPT - 5.2 by at least 100 times by the
  end of 2027."
concreteness: measurable
status: open
last_checked: 2026-10-14
due: '2027'
breaks_if: >-
  By the end of 2027, no OpenAI model that matches GPT-5.2's results on the
  benchmarks OpenAI reported for it is priced at a hundredth of GPT-5.2's
  January 2026 API price or less.
