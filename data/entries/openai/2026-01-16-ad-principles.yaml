  - date: 2026-09-16
    text: >-
      With ChatGPT ads at a reported $1 billion annualized run rate, OpenAI
      began testing "Sponsored Agents": separate, labeled conversations with a
      business's agent that a user can open from an ad. OpenAI said they are
      "separate from the original conversation in ChatGPT and from ChatGPT's
      independent answers." Nothing reported so far trips the breaks-if test.
