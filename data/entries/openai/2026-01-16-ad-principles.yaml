  - date: 2026-02-11
    text: >-
      In an interview published as OpenAI began testing ads, Fidji Simo,
      OpenAI's CEO of applications, described the principles, including the
      ability to delete the personal data used for ads, as "very clear, very
      prominent, and we've committed to them forever." She also said that in
      OpenAI's projections "ads will remain a minority of our revenue ... For
      many, many years. And I think probably forever." (Quoted from the audio of
      Sources with Alex Heath, about 42:21 and 58:25.)
    sources:
      - title: OpenAI's Fidji Simo on why ads are coming to ChatGPT
        publisher: Sources with Alex Heath
        url: https://podcasts.apple.com/us/podcast/openais-fidji-simo-on-why-ads-are-coming-to-chatgpt/id1840154537?i=1000749173634
        date: 2026-02-11
        type: primary
        archive: https://web.archive.org/web/20260710205155/https://podcasts.apple.com/us/podcast/openais-fidji-simo-on-why-ads-are-coming-to-chatgpt/id1840154537?i=1000749173634
        snapshot: snapshots/2026-10-07-podcasts.apple.com-f91321de
  - date: 2026-02-11
    text: >-
      OpenAI researcher Zoë Hitzig, who had worked on safety policy and model
      pricing, resigned on February 9 and explained why in a New York Times
      essay, "OpenAI Is Making the Mistakes Facebook Made. I Quit." She wrote:
      "I believe the first iteration of ads will probably follow those
      principles. But I'm worried subsequent iterations won't, because the
      company is building an economic engine that creates strong incentives to
      override its own rules." She called for real oversight, "not a blog post
      of principles."
