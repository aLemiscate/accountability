updates:
  - date: 2026-02-09
    text: >-
      As ads launched, OpenAI deleted a sentence that had stood in its help
      article on training since January 2024: "We don’t use your content to
      market our services or create advertising profiles of you—we use it to
      make our models more helpful." It was there on February 7 and gone by
      February 10, with no note of the change. The privacy policy dated
      February 9 added personalizing ads for Free and Go users as a use of
      personal data. OpenAI had said in January that ads would be matched to
      the conversation.
