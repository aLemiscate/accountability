  - date: 2026-09-16
    text: >-
      With ChatGPT ads at a reported $1 billion annualized run rate, OpenAI
      began testing "Sponsored Agents": separate, labeled conversations with a
      business's agent that a user can open from an ad. OpenAI said they are
      "separate from the original conversation in ChatGPT and from ChatGPT's
      independent answers." Nothing reported so far trips the breaks-if test.
    sources:
      - title: OpenAI Tests Sponsored AI Agents in ChatGPT Ads
        publisher: PYMNTS
        url: https://www.pymnts.com/news/artificial-intelligence/2026/openai-tests-sponsored-ai-agents-in-chatgpt-ads/
        date: 2026-09-16
        type: reporting
        archive: https://web.archive.org/web/20261001034724/https://www.pymnts.com/news/artificial-intelligence/2026/openai-tests-sponsored-ai-agents-in-chatgpt-ads/
        snapshot: snapshots/2026-10-01-pymnts.com-68e76f8a
  - date: 2026-10-05
    text: >-
      OpenAI announced a "visual ad format" for ChatGPT, to be tested first
      during image generation in the U.S. in October. It did not say where the
      ads would appear or how they would be targeted, and said it would share
      more once testing began. Free users can turn ads off without paying, but
      doing so turns off tools including image generation.
    sources:
