  - date: 2026-04-30
    text: >-
      OpenAI emailed users that it had updated its privacy policy, and turned on
      marketing cookies by default for free ChatGPT users. The policy dropped
      its statement that OpenAI does not "share" personal data for cross-context
      behavioral advertising or process it for "targeted advertising." It now
      says OpenAI "may share limited data with select marketing partners for
      purposes of promoting our products and services to you on third-party
      properties." Reporting cited cookie IDs, device IDs and email addresses. A
      spokesperson told Adweek that "nothing about our policy of not sharing
      people’s conversations or other private user content with advertisers has
      changed." Since its February 2026 version, the policy has also said OpenAI
      may receive information from advertisers about purchases users make. The
      ad principles hold in letter. Anthropic's privacy policy made the same
      change for marketing its own products in 2024.
