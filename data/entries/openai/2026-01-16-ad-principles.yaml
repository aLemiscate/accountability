note: >-
  This one is measurable from outside, so it's worth watching closely. The
  time-spent principle used to rest on the business model. In May 2025, eight
  months before ads, ChatGPT's head of product Nick Turley said: "We actually
  don't care at all how much time you spend in that product. In fact, less time
  is better because it means we solved your problem." He gave two reasons: "our
  mission, but B, our business model. We charge people directly to use our
  products." (Quoted from the audio of his OMR Festival talk, about 11:43.)
