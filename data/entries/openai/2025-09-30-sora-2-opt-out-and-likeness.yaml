updates:
  - date: 2025-12-11
    text: >-
      Disney became the first major content licensing partner on Sora: a
      three-year license for more than 200 Disney, Marvel, Pixar and Star Wars
      characters, excluding "any talent likenesses or voices," with a $1
      billion Disney equity investment in OpenAI. On CNBC that morning, asked
      whether the deal grew out of talks about IP, Altman said: "We always have
      wanted to respect IP. When we launched Sora initially, we had a lot of
      blocks in place." (Quoted from the audio, about 35:53.) The blocks he
      described covered rights holders who had opted out; launch-week reporting
      said other characters would appear unless their owners asked.
    sources:
      - title: The Walt Disney Company and OpenAI Reach Landmark Agreement to Bring
          Beloved Characters from Across Disney’s Brands to Sora
        publisher: The Walt Disney Company
        url: https://thewaltdisneycompany.com/news/disney-openai-sora-agreement/
        date: 2025-12-11
        type: primary
      - title: 'SOTS 10AM: Exclusive: Disney CEO Bob Iger and OpenAI CEO Sam Altman
          on new deal 12/11/25'
        publisher: CNBC Squawk on the Street
        url: https://podcasts.apple.com/us/podcast/sots-10am-exclusive-disney-ceo-bob-iger-and-openai/id1475116211?i=1000740871814
        date: 2025-12-11
        type: primary
  - date: 2026-03-24
    text: >-
      Six months after launch, OpenAI announced it was shutting down the Sora
      app without giving a reason. A licensing deal with Disney collapsed with
      it. The Sora 2 model stayed available inside ChatGPT's paid tiers.
    sources:
      - title: OpenAI’s Sora was the creepiest app on your phone — now it’s shutting
          down
        publisher: TechCrunch
        url: https://techcrunch.com/2026/03/24/openais-sora-was-the-creepiest-app-on-your-phone-now-its-shutting-down/
        date: 2026-03-24
        type: reporting
        archive: https://web.archive.org/web/20261001034209/https://techcrunch.com/2026/03/24/openais-sora-was-the-creepiest-app-on-your-phone-now-its-shutting-down/
        snapshot: snapshots/2026-10-01-techcrunch.com-767bb5cf
  - date: 2026-04-01
    text: >-
      A week later OpenAI president Greg Brockman gave a reason: the Sora
      models "are a different branch of the tech tree than the core reasoning
      GPT series," and "pursuing both branches is very hard for us to do" with
      limited compute. He said Sora research would continue for robotics.
      (Quoted from the audio of the Big Technology Podcast, about 4:51 and
      5:03.)
    sources:
      - title: 'OpenAI President Greg Brockman: AI Self-Improvement, The Superapp
          Bet, Path To AGI, Scaling Compute'
        publisher: Big Technology Podcast
        url: https://podcasts.apple.com/us/podcast/openai-president-greg-brockman-ai-self-improvement/id1522960417?i=1000758669158
        date: 2026-04-01
        type: primary
note: >-
  "Should ultimately have control" was the right principle. OpenAI adopted it
  after launch, for one estate at a time, on request.
