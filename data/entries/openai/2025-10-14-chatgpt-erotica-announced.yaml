title: Altman announces erotica for verified adults, to "treat adult users like
  adults"
date: 2025-10-14
org: openai
type: did
kind: reversal
who: [sam-altman, openai]
venue: Post on X
quote: treat adult users like adults
summary: >-
  Altman said ChatGPT would relax restrictions, first letting the bot respond
  "in a very human-like way," and then in December letting verified adults
  generate erotica as age-gating rolled out.
