        snapshot: snapshots/2026-09-29-axios.com-6d520b57
  - date: 2026-03
    text: >-
      The Financial Times reported that OpenAI had "indefinitely" paused work on
      adult mode after pushback over unhealthy attachments to AI and minors'
      exposure to sexual content, and concern among some investors. OpenAI said
      it was waiting for long-term research on the effects of sexually explicit
      chats and emotional attachment.
    sources:
      - title: OpenAI is No Longer Working on 'Adult Mode' for ChatGPT (citing the
          Financial Times)
        publisher: Thurrott.com
        url: https://www.thurrott.com/a-i/334240/openai-is-no-longer-working-on-adult-mode-for-chatgpt
        date: 2026-03
        type: reporting
        archive: https://web.archive.org/web/20261001034340/https://www.thurrott.com/a-i/334240/openai-is-no-longer-working-on-adult-mode-for-chatgpt
        snapshot: snapshots/2026-10-01-thurrott.com-a3398be2
note: >-
  The stated principle flipped in two months. The product hadn't shipped as of
  the last update, but the reversal of the stated principle is the receipt. The
  "adults like adults" idea itself was not new: in May 2025 Senate testimony
  Altman said "we want to treat our adult users like adults" and that if OpenAI
  could tell adults from children "we would allow adults to be much more
  permissive." In 2023 he had told senators OpenAI refused all adult content
  because it could not "reliably enough differentiate" what came with it.
