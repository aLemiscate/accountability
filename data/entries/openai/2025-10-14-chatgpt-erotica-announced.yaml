response: >-
  OpenAI said it had mitigated serious mental-health issues and built new tools,
  so it could safely relax restrictions in most cases.
updates:
  - date: 2025-12-18
    text: >-
      With adult mode still planned, Altman said OpenAI would "give people
      quite a bit of personal freedom here," but that there were "things ...
      other services will offer, but we won't." His example: OpenAI would not
      have its AI "try to convince people that should be like an exclusive
      romantic relationship with them." (Quoted from the audio of the Big
      Technology Podcast, about 18:54 and 19:07.)
    sources:
      - title: 'Sam Altman: How OpenAI Wins, AI Buildout Logic, IPO in 2026?'
        publisher: Big Technology Podcast
        url: https://podcasts.apple.com/us/podcast/sam-altman-how-openai-wins-ai-buildout-logic-ipo-in-2026/id1522960417?i=1000741901091
        date: 2025-12-18
        type: primary
  - date: 2026-02-10
    text: >-
      The Wall Street Journal reported that OpenAI had fired Ryan Beiermeister,
      vice president of its product policy team, in January, citing sexual
      discrimination against a male colleague. According to the Journal's
      sources, she had told colleagues she opposed adult mode and that she
      didn't think OpenAI's safeguards against child-exploitation content, or
      against teens reaching adult content, were strong enough. Beiermeister
      called the discrimination allegation "absolutely false." OpenAI said her
      "departure was not related to any issue she raised while working at the
      company."
    sources:
      - title: 'The Wall Street Journal on X ("Exclusive: OpenAI fired executive Ryan
