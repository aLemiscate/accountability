    type: analysis
response: >-
  OpenAI said the Foundation controls the PBC and that the recapitalization
  makes it one of the best-resourced philanthropies, with an initial $25B
  commitment to health and "AI resilience."
note: >-
  In 2015 there was no financial return. In 2019 it was capped. In 2025 the
  cap was gone. At each step OpenAI said the mission was being protected.
