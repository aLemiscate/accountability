title: OpenAI completes its for-profit recapitalization
date: 2025-10-28
org: openai
type: did
kind: revision
who: [ openai ]
summary: >-
  The nonprofit became the OpenAI Foundation, holding about 26% of a new
  Delaware public benefit corporation, OpenAI Group PBC (a stake worth about
  $130B). Current and former employees and investors hold about 47%, and
  Microsoft about 27%. Coverage noted that the 2019 caps on investor returns
  were gone. California's attorney general said his office would not challenge
  the plan.
contradicts: [ 2015-12-11-founded-as-nonprofit ]
related: [ 2019-03-11-capped-profit-lp, 2025-05-05-nonprofit-control-retained ]
patterns: [ mission-to-market ]
