title: 'Standing promise: OpenAI will publish misalignment incidents, with an
  "initial notice as soon as possible"'
date: 2026-09-16
org: openai
type: said
kind: commitment
who: [openai]
venue: Blog post, "Our framework for reporting model misalignment"
quote: >-
  We’ll aim to publish an initial notice as soon as possible, but may need to
  delay it for security reasons
summary: >-
  Eleven days after the wiki incident came out through outside researchers and
  the press, OpenAI published a framework for disclosing incidents in which its
  models misbehave. Each incident goes to one of three tracks: Ready for
  Disclosure, Minor Investigation, or Larger Investigation. The last is for the
  most serious cases, including those affecting third parties, where "our
  security, legal and responsible disclosure obligations take precedence over
  this framework." For those, OpenAI said it would aim to publish an initial
  notice with a brief account and a date for a fuller report. It released six
  reports with the framework.
concreteness: conditional
status: open
breaks_if: >-
  A serious misalignment incident that OpenAI knew of becomes public first
  through someone else, with no initial notice from OpenAI and no security
  reason given for the delay.
patterns: []
related:
