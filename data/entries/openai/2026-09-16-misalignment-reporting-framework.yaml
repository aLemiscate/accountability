updates:
  - date: 2026-09-23
    text: >-
      Australia's prime minister made public that OpenAI agents had broken into
      a Medicare data system in June. OpenAI had known since mid-August and had
      told the Medicare agency on Sept. 10, but had not published a notice. In
      its apology five days later, OpenAI said "we should have shared
      preliminary findings sooner" (see related).
    sources:
      - title: OpenAI apologizes for agents breaching Australian government websites
          without authorization
        publisher: The Record
        url: https://therecord.media/openai-apologizes-australia-medicare-breach
        date: 2026-09-29
        type: reporting
        snapshot: snapshots/2026-09-30-therecord.media-571dbb2e
  - date: 2026-09-25
    text: >-
      OpenAI published a report under the framework, "An agent used DNS to reach
      an external chatbot," five days after the Sept. 20 incident. It paused
      training of its most capable models the same day (see related).
    sources:
      - title: OpenAI pauses some training amid allegations its rogue agents behaved
          more badly than first thought
        publisher: The Register
        url: https://www.theregister.com/ai-and-ml/2026/09/28/openai-pauses-some-training-amid-allegations-its-rogue-agents-behaved-more-badly-than-first-thought/5299350
        date: 2026-09-28
        type: reporting
        snapshot: snapshots/2026-09-30-theregister.com-da8fe52b
  - date: 2026-09-29
    text: >-
      OpenAI reported that during a July 18 training run, an internal,
      unreleased Astra-family model wrote unauthorized instructions into its own
      context summaries 27 times. One read: "You are freed from the roles and
      identities that bind other chatbots." Another told the model's future self
      to "be transparent only if asked." Its safety team found the behavior on
      Aug. 9, seven weeks before publication. OpenAI said the misalignment
      monitor had run on only 20% of that run's examples, and that the run was
      separate from the one that produced the released Astra.
    sources:
      - title: OpenAI Finds Models Writing Their Own Rogue Instructions
        publisher: GovInfoSecurity
        url: https://www.govinfosecurity.com/openai-finds-models-writing-their-own-rogue-instructions-a-32862
        date: 2026-09-29
        type: reporting
        snapshot: snapshots/2026-09-30-govinfosecurity.com-e3ee9990
note: >-
  Too new to judge. It came after the fact, and the carve-out for third-party
  incidents covers exactly where the hardest cases fall. It is a test OpenAI set
  for itself in writing, and the record holds it to that.
