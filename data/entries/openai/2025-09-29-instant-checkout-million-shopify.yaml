title: 'Instant Checkout in ChatGPT: "over 1 million Shopify merchants coming
  soon"; it ended six months later'
date: 2025-09-29
org: openai
type: said
kind: claim
who: [openai, fidji-simo]
venue: Launch thread on X for Instant Checkout and the Agentic Commerce Protocol
quote: >-
  Instant Checkout is now rolling out to US ChatGPT Pro, Plus and Free
  logged-in users buying from US Etsy sellers, with over 1 million Shopify
  merchants coming soon.
summary: >-
  OpenAI launched purchases inside ChatGPT with Etsy sellers and promised more
  than a million Shopify merchants soon, alongside an open protocol built with
  Stripe. "Cool thing launching today," wrote Fidji Simo, its CEO of
  Applications. On Nov. 20 it began rolling out the first Shopify merchants,
  starting with Glossier, SKIMS and Spanx. In March 2026, as first reported by
  The Information, OpenAI moved away from Instant Checkout: shoppers would
  instead be sent to retailers' own apps and sites to pay. CNBC reported that,
  according to Forrester analyst Emily Pfeiffer, about 30 Shopify merchants
  were available through Instant Checkout as of February, that onboarding
  merchants had been arduous, and that the feature was prone to errors.
concreteness: measurable
status: broken
patterns: [coming-weeks]
