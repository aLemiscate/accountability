response: >-
  An OpenAI spokesperson said the company was focusing on search and product
  discovery inside ChatGPT, where it had seen early adoption: "Instant
  Checkout is moving to Apps, where purchases can happen more seamlessly."
note: >-
  Commerce is hard, and according to The Information OpenAI and Stripe are
  still developing the open protocol. What did not hold was
  the scale announced at launch: "over 1 million" merchants "coming soon"
  became a few dozen before the feature was wound down.
