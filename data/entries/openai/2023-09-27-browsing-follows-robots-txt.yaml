title: 'ChatGPT browsing now follows robots.txt "so sites can control how ChatGPT
  interacts with them"; the docs later said it "may not apply"'
date: 2023-09-27
org: openai
type: said
kind: commitment
who: [openai]
venue: Post on X relaunching ChatGPT browsing
quote: >-
  Since the original launch of browsing in May, we received useful feedback.
  Updates include following robots.txt and identifying user agents so sites
  can control how ChatGPT interacts with them.
summary: >-
  OpenAI relaunched web browsing in ChatGPT with a promise to site owners:
  pages fetched for users would follow robots.txt, the file sites use to tell
  bots what to stay out of. Its crawler documentation listed robots.txt tags
  as applying to all three of its user agents, including ChatGPT-User, which
  fetches pages when a user asks. On Dec. 9, 2025, without an announcement,
  OpenAI revised the page; a marketing consultant spotted the change. The
  current version says of ChatGPT-User: "Because these actions are initiated
  by a user, robots.txt rules may not apply." TollBit's State of the Bots
  report for the first half of 2026 found that ChatGPT-User reached pages it
  was explicitly disallowed from on nearly half of the European sites that
  blocked it by name, more sites than any other agent tracked.
concreteness: measurable
status: reversed
patterns: [silent-edit]
