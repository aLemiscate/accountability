note: >-
  OpenAI's argument is that a page fetched because a person asked for it is
  closer to that person's browser than to a crawler, and robots.txt was
  written for crawlers. But the 2023 promise was made for exactly these
  user-requested fetches. For comparison, Anthropic's help page says its
  equivalent agent, Claude-User, "allows site owners to control which sites
  can be accessed through these user-initiated requests."
