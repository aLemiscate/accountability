note: >-
  A principle, not a promise, so it can't be broken outright. It is marked
  eroded because the related entries show a different practice: ship first, then
  patch, roll back or publish the safety report. By 2025 OpenAI described its
  approach as learning how to make the next system safe from deploying the
  current one.
