title: '"Building advanced AI and only then making it safe is like building the
  internet and later trying to make it secure"'
date: 2017-10-18
org: openai
type: said
kind: principle
who: [openai, greg-brockman]
venue: Wall Street Journal op-ed by OpenAI researchers, "Protecting Against AI's
  Existential Threat," as summarized by OpenAI
quote: >-
  Building advanced AI and only then making it safe is like building the
  internet and later trying to make it secure
summary: >-
  Promoting an op-ed by its researchers in the Wall Street Journal, OpenAI said
  safety had to be built in from the start, not added after capabilities. Greg
  Brockman summarized it as: "we messed up safety with the internet, don't make
  same mistake with advanced AI."
concreteness: directional
status: eroded
patterns: [ship-then-patch]
