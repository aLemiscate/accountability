title: OpenAI launches as a nonprofit "unconstrained by a need to generate financial return"
date: 2015-12-11
org: openai
type: said
kind: principle
who: [openai]
venue: Launch blog post, "Introducing OpenAI"
quote: >-
  OpenAI is a non-profit artificial intelligence research company. Our goal is
  to advance digital intelligence in the way that is most likely to benefit
  humanity as a whole, unconstrained by a need to generate financial return.
summary: >-
  The founding announcement made freedom from profit pressure the reason
  OpenAI existed: because it wouldn't answer to shareholders, it could put
  humanity's interests first.
concreteness: directional
status: reversed
patterns: [mission-to-market]
sources:
  - title: Introducing OpenAI
    publisher: OpenAI
    url: https://openai.com/index/introducing-openai/
    date: 2015-12-11
    type: primary
  - title: Non-profit OpenAI launches with backing from Elon Musk and Sam Altman
    publisher: TechCrunch
    url: https://techcrunch.com/2015/12/11/non-profit-openai-launches-with-backing-from-elon-musk-and-sam-altman/
    date: 2015-12-11
    type: reporting
updates:
  - date: 2026-05-18
    text: >-
      Elon Musk's suit accusing Altman and Brockman of a "breach of charitable
      trust" for abandoning the founding mission ended after a three-week
      trial. A unanimous advisory jury found the claims were filed too late, and
      Judge Yvonne Gonzalez Rogers agreed and dismissed the case. The verdict
      did not reach the merits. OpenAI's lawyer called the suit "a hypocritical
      attempt to sabotage a competitor"; Musk said he would appeal.
    sources:
      - title: Jury dismisses all claims in Elon Musk’s lawsuit against OpenAI CEO Sam Altman
        publisher: NPR
        url: https://www.npr.org/2026/05/18/nx-s1-5822366/musk-altman-openai-jury-verdict-claims-dismissed
        date: 2026-05-18
        type: reporting
note: >-
  This promise was structural, not rhetorical: no profit motive. Every later
  restructuring (2019, 2025) has been presented as the way to protect it.
