updates:
  - date: 2026-05-18
    text: >-
      Elon Musk's suit accusing Altman and Brockman of a "breach of charitable
      trust" for abandoning the founding mission ended after a three-week trial.
      A unanimous advisory jury found the claims were filed too late, and Judge
      Yvonne Gonzalez Rogers agreed and dismissed the case. The verdict did not
      reach the merits. OpenAI's lawyer called the suit "a hypocritical attempt
      to sabotage a competitor"; Musk said he would appeal.
    sources:
      - title: Jury dismisses all claims in Elon Musk’s lawsuit against OpenAI CEO Sam
          Altman
        publisher: NPR
        url: https://www.npr.org/2026/05/18/nx-s1-5822366/musk-altman-openai-jury-verdict-claims-dismissed
        date: 2026-05-18
        type: reporting
        archive: https://web.archive.org/web/20260927033804/https://www.npr.org/2026/05/18/nx-s1-5822366/musk-altman-openai-jury-verdict-claims-dismissed
        snapshot: snapshots/2026-10-01-npr.org-c27c6d8c
  - date: 2026-07-28
    text: >-
      Looking back, Altman said: "I think we made a mistake to try to innovate
      in our structure in the beginning." The nonprofit was meant to protect the
      mission "even if the technology went on a very fast takeoff," but "we
      would have saved ourselves a great deal of pain in many ways" by finding
      another way to do that. He added: "Maybe there was no other way." (Quoted
      from the audio of Invest Like the Best, about 50:37 to 51:19.)
    sources:
      - title: Sam Altman - How to Make an Abundant Future
        publisher: Invest Like the Best
        url: https://podcasts.apple.com/us/podcast/sam-altman-how-to-make-an-abundant-future/id1154105909?i=1000778668152
        date: 2026-07-28
        type: primary
        archive: https://web.archive.org/web/20261007070623/https://podcasts.apple.com/us/podcast/sam-altman-how-to-make-an-abundant-future/id1154105909?i=1000778668152
        snapshot: snapshots/2026-10-07-podcasts.apple.com-84a01af3
note: >-
  This promise was structural, not rhetorical: no profit motive. Every later
  restructuring (2019, 2025) has been presented as the way to protect it.
