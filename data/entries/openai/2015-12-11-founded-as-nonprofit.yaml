title: OpenAI launches as a nonprofit "unconstrained by a need to generate
  financial return"
date: 2015-12-11
org: openai
type: said
kind: principle
who: [openai]
venue: Launch blog post, "Introducing OpenAI"
quote: >-
  OpenAI is a non-profit artificial intelligence research company. Our goal is
  to advance digital intelligence in the way that is most likely to benefit
  humanity as a whole, unconstrained by a need to generate financial return.
summary: >-
  The founding announcement made freedom from profit pressure the reason OpenAI
  existed: because it wouldn't answer to shareholders, it could put humanity's
  interests first. In replies that week, OpenAI told a user who asked about
  investing, "Donating, actually. No equity to exchange here," and repeatedly
  promised "open-source projects over time." Greg Brockman wrote that OpenAI was
  "fully separate from any of the for-profit projects of our funders/chairs"
  and, on openness, that it would "be thoughtful rather than blindly open."
concreteness: directional
status: reversed
patterns: [mission-to-market]
