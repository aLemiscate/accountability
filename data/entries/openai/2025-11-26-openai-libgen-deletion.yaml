  - title: 'Unsealed Briefs in Authors'' Case v. Microsoft/OpenAI: Top Execs Knew
      Their Mass Book Piracy Was Illegal And Would Put Authors Out of Work'
    publisher: The Authors Guild
    url: https://authorsguild.org/news/ag-v-openai-top-execs-knew-mass-book-piracy-was-illegal/
    date: 2026-09-21
    type: analysis
    snapshot: snapshots/2026-09-30-authorsguild.org-6bc27e7b
response: >-
  OpenAI maintains that it did not willfully infringe any copyright, and appealed
  the discovery ruling.
note: >-
  The Authors Guild page is a party's summary of its own brief and is labeled
  that way. The same brief quotes Dario Amodei and Sam McCandlish, then at
  OpenAI, discussing LibGen in 2019; Anthropic later settled its own
  pirated-books case for $1.5B.
