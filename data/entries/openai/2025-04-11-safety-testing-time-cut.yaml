title: FT reports OpenAI cut safety testing from months to days as it raced to
  launch o3
date: 2025-04-11
org: openai
type: did
kind: disclosure
who: [openai, johannes-heidecke]
summary: >-
  The Financial Times reported, citing eight people familiar with OpenAI's
  testing, that staff and third-party testers had been given days, not months,
  to evaluate new models. GPT-4 had been tested for six months in 2023; some
  testers of the upcoming o3 got less than a week. One tester said: "We had
  more thorough safety testing when [the technology] was less important."
  Another, who had worked on GPT-4's evaluation, said dangerous flaws only
  emerged well into that longer process. Critics also questioned whether OpenAI
  still ran fine-tuned misuse tests on its newest models.
