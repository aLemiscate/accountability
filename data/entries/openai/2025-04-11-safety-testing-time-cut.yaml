response: >-
  OpenAI said its testing had become more efficient through automation, that the
  checkpoints it tested were "basically identical" to the final releases, and
  that models are thoroughly tested for catastrophic risks. Head of safety
  systems Johannes Heidecke: "We have a good balance of how fast we move and how
  thorough we are."
note: >-
  Four days later the Preparedness Framework gained its competitor clause, and
  GPT-4.1 shipped without a system card. In March 2023, asked how OpenAI would
  hold up under pressure from Google, Apple and Meta, Altman told Lex Fridman:
  "I'm sure people will get ahead of us in all sorts of ways and take shortcuts
  we're not going to take. And we just aren't going to do that." (Quoted from
  the audio at 1:15:50; the podcast has no published transcript.) At the Aspen
  Ideas Festival in June 2024 he was more specific: "With GPT-4, for example, we
  had about eight months between when we finished training, when we released it,
  including lots of external consultation and red teaming. Future models may
  take even longer." (Quoted from the audio of the Aspen Ideas to Go episode,
  about 31:26.)
