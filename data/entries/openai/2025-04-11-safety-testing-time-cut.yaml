response: >-
  OpenAI said its testing had become more efficient through automation, that
  the checkpoints it tested were "basically identical" to the final releases,
  and that models are thoroughly tested for catastrophic risks. Head of safety
  systems Johannes Heidecke: "We have a good balance of how fast we move and how
  thorough we are."
note: >-
  Four days later the Preparedness Framework gained its competitor clause, and
  GPT-4.1 shipped without a system card.
