# Pages whose full archived history `npm run page-history` pulls (the Capture
# workflow runs it on GitHub's runners when "history" is set). Each page lists
# every address it has lived at; their Wayback Machine captures are merged in
# date order. Entries
# with `discover:` list every archived address under a prefix instead, to find
# old addresses and the right help articles.
#
# Covers, for both companies: usage policies, terms, privacy policies,
# pricing, usage-limit help pages and model-retirement pages.

