title: Anthropic's Responsible Scaling Policy (all versions)
date: 2023-09-19
parties: [anthropic]
summary: >-
  Anthropic's own framework for catastrophic risk, in nine versions from 1.0
  (September 2023) to 3.4 (July 2026). Version 2.0 rewrote the first; version
  3.0 rewrote it again, replacing hard limits on training and deployment with
  Risk Reports, a public Frontier Safety Roadmap and commitments that depend on
  what competitors do. Every version was read: 1.0, 2.0 and 3.0 in full, and
  each of the six minor versions by comparing it in full against the one before.
  Each commitment below is quoted from the version named in its "versions" field
  and graded over the time it was in force. A commitment a later version dropped
  or weakened is graded "eroded", even if it was met while it lasted; the
  evidence says which. Much of the policy is internal process that can't be
  checked from outside.
