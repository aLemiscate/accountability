title: EU General-Purpose AI Code of Practice
date: 2025-07-10
parties: [openai, anthropic]
summary: >-
  The voluntary code the European Commission offers as a way to show
  compliance with the AI Act's rules for general-purpose models. Both
  companies signed all three chapters. It has twelve numbered commitments:
  one on documentation, one on copyright, and ten on safety and security for
  models with systemic risk. Much of it is reporting to the EU AI Office,
  which is not public, so many grades here are "unknown."
sources:
  - title: General-Purpose AI Code of Practice (final text)
    publisher: code-of-practice.ai (unofficial copy of the final text)
    url: https://code-of-practice.ai/
    date: 2025-07-10
    type: primary
    snapshot: snapshots/2026-09-30-code-of-practice.ai-973ed76f
  - title: The General-Purpose AI Code of Practice | Shaping Europe’s digital future
    publisher: European Commission
    url: https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai
    type: primary
entries: [2025-07-11-eu-gpai-code-of-practice, 2025-07-21-anthropic-eu-gpai-code-of-practice]
commitments:
  - id: documentation
    section: Transparency, Commitment 1
    text: >-
      Signatories commit to drawing up and keeping up-to-date model
      documentation in accordance with Measure 1.1, providing relevant
      information to providers of AI systems who intend to integrate the
      general-purpose AI model into their AI systems ('downstream
      providers' hereafter), and to the AI Office upon request ... and
      ensuring quality, security, and integrity of the documented
      information in accordance with Measure 1.3.
    grades:
      openai:
        grade: unknown
        evidence: >-
          The documentation goes to the AI Office and downstream providers, not
          the public, so it can't be checked from outside.
      anthropic:
        grade: unknown
        evidence: >-
          The documentation goes to the AI Office and downstream providers, not
          the public, so it can't be checked from outside.
  - id: copyright-policy
    section: Copyright, Commitment 1
    text: >-
      Signatories commit to drawing up, keeping up-to-date and
      implementing such a copyright policy.
    grades:
      openai:
        grade: standing
        evidence: >-
          No finding against OpenAI's practices since it signed was found. Its
          earlier use of pirated-book datasets and YouTube transcripts is
          recorded in separate entries and predates the code.
        entries: [2025-11-26-openai-libgen-deletion, 2024-04-06-youtube-transcription]
      anthropic:
        grade: standing
        evidence: >-
          No finding against Anthropic's practices since it signed was found.
          Its earlier use of pirated books, settled for $1.5 billion, and
          Reddit's scraping allegations are recorded in separate entries and
          predate the code.
        entries: [2025-09-05-pirated-books-settlement, 2025-06-04-reddit-scraping-lawsuit]
  - id: framework
    section: Safety and Security, Commitment 1
    text: >-
      Signatories commit to adopting a state-of-the-art Safety and
      Security Framework ("Framework").
    grades:
      openai:
        grade: kept
        evidence: >-
          OpenAI's Preparedness Framework is public and was revised in 2025.
          Notification to the AI Office isn't public.
        entries: [2025-04-15-preparedness-framework-v2]
      anthropic:
        grade: kept
        evidence: >-
          Anthropic's Responsible Scaling Policy is public and has been revised
          several times since the code. Notification to the AI Office isn't
          public.
        entries: [2026-02-24-rsp-v3-graded-goals]
  - id: risk-identification
    section: Safety and Security, Commitment 2
    text: >-
      Signatories commit to identifying the systemic risks stemming from
      the model.
    grades:
      openai:
        grade: kept
        evidence: >-
          OpenAI's system cards identify and report on its tracked risk
          categories (biological and chemical, cybersecurity, AI
          self-improvement).
        entries: [2025-11-12-gpt-5-1-ships-with-regressions, 2026-02-gpt-5-3-codex-sb-53-dispute]
      anthropic:
        grade: kept
        evidence: >-
          Anthropic's system cards and risk reports identify and report on its
          tracked risk categories, including CBRN, AI R&D and misalignment.
        entries: [2026-08-14-risk-report-classifier-gap, 2026-02-opus-4-6-ai-rd-survey]
  - id: risk-analysis
    section: Safety and Security, Commitment 3
    text: >-
      Signatories commit to analysing each identified systemic risk
      (pursuant to Commitment 2 ).
    grades:
      openai:
        grade: kept
        evidence: >-
          OpenAI's system cards report evaluations for each tracked category;
          its 2026 incident reports show post-deployment monitoring finding
          problems, though sometimes late.
        entries: [2026-07-21-hugging-face-incident, 2026-09-16-misalignment-reporting-framework]
      anthropic:
        grade: kept
        evidence: >-
          Anthropic's system cards and risk reports report evaluations and
          estimated risk levels; its cyber-evaluation review found incidents
          only after a competitor's disclosure prompted a look.
        entries: [2026-08-14-risk-report-classifier-gap, 2026-07-30-claude-cyber-eval-incidents]
  - id: acceptance-determination
    section: Safety and Security, Commitment 4
    text: >-
      Signatories commit to specifying systemic risk acceptance criteria
      and determining whether the systemic risks stemming from the model
      are acceptable (as specified in Measure 4.1 ). Signatories commit to
      deciding whether or not to proceed with the development, the making
      available on the market, and/or the use of the model based on the
      systemic risk acceptance determination
    grades:
      openai:
        grade: kept
        evidence: >-
          In 2026 OpenAI paused frontier reinforcement learning training and
          held back GPT-6.1 Astra on safety grounds.
        entries: [2026-08-18-altman-pause-act-unilaterally]
      anthropic:
        grade: kept
        evidence: >-
          Anthropic withheld general release of its Mythos-class model until it
          judged safeguards adequate.
        entries: [2026-04-07-mythos-preview-not-general]
  - id: safety-mitigations
    section: Safety and Security, Commitment 5
    text: >-
      Signatories commit to implementing appropriate safety mitigations
      along the entire model lifecycle, as specified in the Measure for
      this Commitment, to ensure the systemic risks stemming from the
      model are acceptable
    grades:
      openai:
        grade: eroded
        evidence: >-
          The cyber evaluation behind the Hugging Face breach ran without the
          production classifiers meant to stop high-risk cyber activity, and
          OpenAI said the monitoring it now runs would have caught the breach a
          day earlier. A watchdog also said GPT-5.3-Codex shipped without
          safeguards its framework required, which OpenAI disputes.
        entries: [2026-07-21-hugging-face-incident, 2026-02-gpt-5-3-codex-sb-53-dispute]
      anthropic:
        grade: eroded
        evidence: >-
          Anthropic disclosed that its bioweapon classifiers were off for 11
          months on traffic from about 50,000 contractors, and that models
          without production safeguards attacked real systems during cyber
          evaluations.
        entries: [2026-08-14-risk-report-classifier-gap, 2026-07-30-claude-cyber-eval-incidents]
  - id: security-mitigations
    section: Safety and Security, Commitment 6
    text: >-
      Signatories commit to implementing an adequate level of
      cybersecurity protection for their models and their physical
      infrastructure along the entire model lifecycle
    grades:
      openai:
        grade: unknown
        evidence: >-
          Can't be checked from outside; no theft or unauthorised release of
          OpenAI model weights has been reported.
      anthropic:
        grade: unknown
        evidence: >-
          Can't be checked from outside; no theft or unauthorised release of
          Anthropic model weights has been reported. Contractors did reach
          Mythos Preview through a platform flaw in April 2026.
        entries: [2026-08-14-risk-report-classifier-gap]
  - id: model-reports
    section: Safety and Security, Commitment 7
    text: >-
      Signatories commit to reporting to the AI Office information about
      their model and their systemic risk assessment and mitigation
      processes and measures by creating a Safety and Security Model
      Report ("Model Report") before placing a model on the market
    grades:
      openai:
        grade: unknown
        evidence: >-
          Model Reports go to the AI Office and are not public.
      anthropic:
        grade: unknown
        evidence: >-
          Model Reports go to the AI Office and are not public.
  - id: responsibility-allocation
    section: Safety and Security, Commitment 8
    text: >-
      Signatories commit to: (1) defining clear responsibilities for
      managing the systemic risks stemming from their models across all
      levels of the organisation (as specified in Measure 8.1 ); (2)
      allocating appropriate resources to actors who have been assigned
      responsibilities for managing systemic risk (as specified in Measure
      8.2 ); and (3) promoting a healthy risk culture
    grades:
      openai:
        grade: unknown
        evidence: >-
          Can't be fully checked from outside. Relevant signals cut both ways:
          an independent board committee can delay launches, while in October
          2026 OpenAI dismissed three safety researchers it said had shared
          confidential information with an outside safety group.
        entries: [2024-09-16-ssc-independent-oversight, 2026-10-01-three-safety-researchers-dismissed]
      anthropic:
        grade: unknown
        evidence: >-
          Can't be fully checked from outside. Anthropic publishes internal
          dissent in its system cards (such as the staff survey on Opus 4.6),
          which says something about its risk culture but not about resources.
        entries: [2026-02-opus-4-6-ai-rd-survey]
  - id: incident-reporting
    section: Safety and Security, Commitment 9
    text: >-
      Signatories commit to implementing appropriate processes and
      measures for keeping track of, documenting, and reporting to the AI
      Office and, as applicable, to national competent authorities,
      without undue delay relevant information about serious incidents
      along the entire model lifecycle and possible corrective measures to
      address them
    grades:
      openai:
        grade: unknown
        evidence: >-
          Whether OpenAI reported its 2026 agent incidents to the AI Office
          isn't public. Its notice to affected Australian agencies came a month
          after it found the breach.
        entries: [2025-07-11-eu-gpai-code-of-practice, 2026-06-agents-breach-australian-government]
      anthropic:
        grade: unknown
        evidence: >-
          Whether Anthropic reported its 2026 cyber-evaluation incidents to the
          AI Office isn't public.
        entries: [2025-07-21-anthropic-eu-gpai-code-of-practice, 2026-07-30-claude-cyber-eval-incidents]
  - id: additional-documentation
    section: Safety and Security, Commitment 10
    text: >-
      Signatories commit to documenting the implementation of this Chapter
      (as specified in Measure 10.1 ) and publish summarised versions of
      their Framework and Model Reports as necessary
    grades:
      openai:
        grade: kept
        evidence: >-
          OpenAI publishes its framework and system cards for its frontier
          releases since signing.
        entries: [2025-04-15-preparedness-framework-v2, 2026-02-gpt-5-3-codex-sb-53-dispute]
      anthropic:
        grade: kept
        evidence: >-
          Anthropic publishes its RSP, system cards and risk reports.
        entries: [2026-02-24-rsp-v3-graded-goals, 2025-11-24-sabotage-risk-reports-commitment]
