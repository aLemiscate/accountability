      disclosure: announced
    - date: 2025-09-15
      when: 2025-09-15 (posted August 15)
      change: >-
        Adds a section banning attacks on computer systems. Political rules narrowed
        from a ban on all campaigning and lobbying to deceptive or disruptive activity
        and voter targeting. Law enforcement: the ban on "any official local, state or
        national law enforcement application," with exceptions for back-office and
        missing-persons work, becomes a ban on "any law enforcement application that
        violates or impairs the liberty, civil liberties, or human rights of natural
        persons"; scoring people is barred only "without notification or their consent";
        emotion recognition is allowed "for medical or safety reasons." High-risk
        requirements now apply only to consumer-facing uses.
      notice: >-
        Announced ("Usage Policy update," August 15, 2025), including the political
        change. On law enforcement Anthropic said the update "does not change what is
        allowed or prohibited"; the new wording reads broader than the old. Reporting at
        the time described Anthropic refusing federal agencies' surveillance uses.
      disclosure: announced
    - date: 2026-10-08
      when: >-
        2026-10-08 (effective 2026-11-12; read from the live page, not yet archived)
      change: >-
        Rewritten. New section on deceptive campaigns; elections section narrowed and
        the ban on "personalized vote or campaign targeting" removed; weapons rules now
        name fire control and arming drones and autonomous platforms; law enforcement:
        from a ban on "determinations on criminal justice applications" (parole,
        sentencing) to a ban on making or suggesting decisions "to investigate, charge,
        arrest or detain"; tracking without consent banned "through analysis of
        previously collected data"; new ban on "sustained and needless abusive or cruel
        behavior toward our models"; high-risk requirements rewritten with a list of
        covered recommendations and new rules for physical actions. Not described in the
        post: the high-risk requirements now apply to anyone making a covered
        recommendation, no longer only "consumer-facing" uses; a new exception lets
        wholly favorable decisions (paying a claim, granting a benefit) skip human
        review; and a new line says the rules "do not categorically prohibit use by any
        particular industry or line of business."
      notice: >-
        Announced ("2026 Usage Policy update," October 8, 2026). Update added to
        `2026-02-27-anthropic-pentagon-red-lines`
      disclosure: announced
