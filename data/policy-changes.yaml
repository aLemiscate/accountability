- page: openai-data-controls-faq
  org: openai
  title: OpenAI data controls help articles
  versions: 292 versions of two articles, November 2021 – October 2026
  note: >-
    "How your data is used to improve model performance" (since 2021) and the "Data
    Controls FAQ" (since April 2023, renamed "Data controls in ChatGPT" in September
    2026). Help-center captures alternate between layouts; most of the 146 changes are
    layout, menus and links.
  changes:
    - date: 2023-04-25
      change: >-
        Data Controls FAQ published with the chat-history switch: chats with history off
        are kept 30 days "to monitor for abuse." Promises to "honor previous opt-out
        requests."
      notice: Announced (chat history controls)
      disclosure: announced
    - date: 2023-04-23
      change: >-
        "We remove any personally identifiable information" from training data becomes
        "we also use PII filtering techniques to reduce the amount of personal data
        used."
      notice: Not dated
      disclosure: none
      cut: true
    - date: 2023-04-25
      when: 2023-04-25 and 2023-04-28
      change: >-
        Both articles add "We don’t use data for selling our services, advertising, or
        building profiles of people—we use data to make our models more helpful for
        people."
      notice: With the chat-history controls
      disclosure: announced
    - date: 2024-01-14
      change: >-
        The training article rewords that as "We don’t use your content to market our
        services or create advertising profiles of you—we use it to make our models more
        helpful." Opt-out moves to the privacy portal.
      notice: Not dated
      disclosure: none
    - date: 2024-05-02
      change: >-
        "Chat history & model training" replaced by Temporary Chats and "Improve the
        model for everyone"; Temporary Chats "deleted from our systems within 30 days."
      notice: Announced on the page and in product
      disclosure: announced
    - date: 2024-09-24
      change: >-
        Business data: "We don’t use content from our business offerings ... to train
        our models" becomes "By default, we do not train on any inputs or outputs from
        our products for business users," with API customers able to opt in through
        Playground feedback.
      notice: Not dated
      disclosure: none
      cut: true
    - date: 2025-04-26
      change: >-
        FAQ rewritten: "Temporary Chats are deleted from our systems after 30 days." The
        April 2023 advertising sentence is dropped from the FAQ.
      notice: >-
        Not dated. Noted in `2026-01-16-ad-principles` and the commitment grade
      disclosure: none
      cut: true
    - date: 2025-05-15
      change: >-
        Adds that if a user who opted out gives a thumbs up or down, "the entire
        conversation associated with that feedback may be used to train our models."
      notice: Not dated
      disclosure: none
      cut: true
    - date: 2025-12-03
      when: 2025-12-03 to 2025-12-22
      change: >-
        "We don’t use your content to market our services" becomes "We do not use your
