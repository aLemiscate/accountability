      notice: Not dated
      disclosure: none
    - date: 2025-06-08
      when: 2025-06-08 to 2026-07-09
      change: >-
        Note: "Data retention for certain services may be affected by recent legal
        developments." The Temporary Chat deletion sentence stays unchanged.
      notice: >-
        Linked to OpenAI's blog post on the New York Times data demands. Entry:
        `2025-05-nyt-chat-preservation-order`
      disclosure: page
    - date: 2026-02-07
      when: 2026-02-07 to 2026-02-10
      change: >-
        Deletes the "advertising profiles" sentence as ads launch; adds links to ad
        controls.
      notice: >-
        No note. Update added to `2026-01-16-ad-principles`; graded as an eroded
        commitment
      disclosure: none
      cut: true
    - date: 2026-05-21
      change: >-
        Adds that turning off Memory "does not disable safety features that may use
