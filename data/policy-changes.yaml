      notice: Links to an OpenAI post on sensitive conversations
      disclosure: page
    - date: 2026-06-11
      change: Support conversations may be used to train models if training is on.
      notice: Not dated
      disclosure: none
      cut: true
    - date: 2026-09-23
      when: 2026-09-23 to 2026-09-25
      change: >-
        Both articles rewritten. Temporary Chats now "may be retained for up to 30 days
        for safety purposes"; managed workspaces not used for training "by default."
      notice: Page shows an update date
      disclosure: page
- page: openai-api-your-data
  org: openai
  title: OpenAI API data controls page
  versions: 44 versions; March–July 2023, then December 2025 – October 2026
  note: >-
    Archived copies of the platform documentation from July 2023 to December 2025 are a
    JavaScript shell with no readable text, so that stretch could not be compared.
  changes:
    - date: 2023-03-01
      change: >-
        "OpenAI will not use data submitted by customers via our API to train or improve
        our models, unless you explicitly decide to share your data"; API data kept "for
        a maximum of 30 days ... (unless otherwise required by law)."
      notice: Announced
      disclosure: announced
    - date: 2023-04-06
      change: >-
        Drops the line that enterprise customers with low-risk uses "may request to not
        have API data stored at all." (Zero data retention reappears in later versions.)
      notice: Not dated
      disclosure: none
      cut: true
    - date: 2023-05-24
      when: 2023-05-24 and 2023-06-05
      change: >-
        European data center: "Yes. We are expanding the availability" becomes, twelve
        days later, "Not presently."
      notice: Dated
      disclosure: page
    - date: 2026-04-24
      when: 2026-04-24 to 2026-04-26
      change: >-
        With GPT-5.5: abuse logs kept 30 days "unless longer retention is required by
        law, or is reasonably necessary to protect our services or any third party from
        harm" (until then, only law); "Safety Retention": OpenAI may make GPT-5.5 and
        later models ineligible for zero data retention for specific customers "if
        reasonably necessary to investigate severe risk activity," with written notice;
        GPT-5.5 and later require extended prompt caching.
      notice: Not announced beyond the page; graded as an eroded commitment
      disclosure: none
      cut: true
    - date: 2026-07-10
      change: >-
        Adds "Private Retention with Private Safety Processing": OpenAI may make models
        ineligible for zero data retention for specific customers with written notice,
        this time without the "severe risk activity" condition; content is kept in
        encrypted logs excluded from human review "unless required by applicable law."
      notice: Not dated
      disclosure: none
      cut: true
    - date: 2026-09-24
      change: Videos API shut down; its retention terms kept as history.
      notice: Page note
      disclosure: page
