# Changes to the companies' policy, terms, pricing and help pages.
#
# Every archived version of the pages in data/history.yaml was compared in
# order (inbox/history/CHANGES.md says how, and what couldn't be done). This is
# the log of what changed, page by page. The site shows it under "Policy
# changes", and the build checks every quoted phrase in `change` against the
# archived texts in inbox/history/<page>/.
#
#   page        id in data/history.yaml
#   versions    how many distinct versions were read, and their span
#   note        what to know about the page's history before reading its changes
#   date        when the change was made (YYYY, YYYY-MM or YYYY-MM-DD). When the
#               page gives no date, the first of the two captures it falls between.
#   when        the date as the log gives it, when it says more than `date`
#               (a range between two captures, an effective date)
#   change      what changed. Text in double quotes is quoted from the page, and
#               the build fails when no saved text of the page holds it (mark an
#               omission with …; quote other sources in `notice`).
#   notice      how the change was made known, as found. `entry-id` links an entry.
#   disclosure  announced  a post, blog, release notes, email or in-product notice
#                          was found
#               page       the page itself carried a new date, a changelog or a note
#               none       no new date, no note on the page and no announcement
#                          found ("found": it does not prove none was made)
#               n/a        wording, typo and layout fixes
#               unchecked  how it was made known wasn't checked
#   cut         true when the change cut what users get or what the company had
#               promised and came with no notice. Sorting changes this way is a
#               judgment, and the site says so.
#   after       what to know after reading the changes

- page: openai-usage-policies
  org: openai
  title: OpenAI usage policies
  versions: 34 versions, April 2023 – October 2026
  note: >-
    Earlier versions (2021–2022, on beta.openai.com and the API site) left no readable
    archived text; the page's own changelog lists them.
  changes:
    - date: 2023-03-23
      when: 2023-03-23 (first readable capture April 3)
      change: >-
        Use-case and content policies combined; lists "Military and warfare", "Adult
        content, adult industries, and dating apps", "Disinformation", and requires
        chatbots to "disclose to users that they are interacting with an AI system."
      notice: Changelog on the page
      disclosure: page
    - date: 2024-01-10
      change: >-
        Rewritten into universal rules plus API and GPT rules. Drops "Military and
        warfare", multi-level marketing and plagiarism; narrows the adult-content ban to
        builders ("Don’t build tools that may be inappropriate for minors, including: …
        Sexually explicit or suggestive content").
      notice: >-
        Changelog on the page ("to be clearer and provide more service-specific
        guidance"); the military change was not mentioned and was reported by The
        Intercept. Entry: `2024-01-10-military-ban-removed`
      disclosure: page
    - date: 2024-03-11
      change: Adds a form to sign up for notice of future changes.
      notice: n/a
      disclosure: n/a
    - date: 2025-01-29
      change: >-
        Adds prohibitions matching the EU AI Act (manipulative techniques, facial
        recognition databases, social scoring, emotion inference at work and school,
        biometric categorization).
      notice: Changelog on the page
      disclosure: page
    - date: 2025-09-30
      when: 2025-09-30 (effective 2025-10-29)
      change: >-
        Rewritten as one universal list. New: "national security or intelligence
        purposes without our review and approval", "unsolicited safety testing",
        "circumventing our safeguards". Gone from this page: the API rules against
        generating disinformation and against chatbots that don't disclose they are AI,
        the builder ban on sexually explicit content, the ban on tools targeting
        under-13s, payday lending, and the GPT Store ban on GPTs "dedicated to fostering
        romantic companionship." Sexual content is now barred where it involves
        violence, non-consent or minors.
      notice: >-
        Notice and changelog on the page ("a universal set of policies"); the specific
        removals were not listed, and no reporting on them was found. Whether the
        dropped rules moved to another OpenAI policy was not checked. Update added to
        `2025-10-14-chatgpt-erotica-announced`.
      disclosure: page
    - date: 2025-10-12
      change: >-
        Typo fix: "accountable for appropriate use" becomes "inappropriate use".
      notice: n/a
      disclosure: n/a
    - date: 2026-07-25
      change: Apostrophes only.
      notice: n/a
      disclosure: n/a
- page: openai-terms-of-use
  org: openai
  title: OpenAI terms of use
  versions: 85 versions, May 2021 – October 2026
  note: >-
    Until late 2022 OpenAI had separate site terms and API terms; they merged in
    December 2022 and split again into consumer terms and business terms in November
    2023. Copies of the European terms, served at the same address to some crawlers,
    were set aside (3 versions).
  changes:
    - date: 2022-01-07
      change: >-
        API terms add fees and payments: price increases take effect "no sooner than 14
        days after they are posted"; free-tier and preview-service rules.
      notice: Dated on the page
      disclosure: page
    - date: 2022-07-20
      change: >-
        API terms extended from "APIs" to all OpenAI "Services" (covering DALL·E).
      notice: Dated on the page
      disclosure: page
    - date: 2022-11-03
      change: Adds Service Terms; drops the beta-services clause from these terms.
      notice: Dated on the page
      disclosure: page
    - date: 2022-12-13
      change: >-
        Merged terms for all services. Adds mandatory individual arbitration and a
        class-action waiver, with a 30-day opt-out. Notice by email or in-product for
        changes that "materially adversely" affect users, effective no sooner than 30
        days later; other changes effective immediately. Drops the clause saying OpenAI
        did not support use involving protected health information.
      notice: Dated on the page; no announcement found
      disclosure: page
    - date: 2023-02-21
      change: >-
        Users under 18 allowed with a parent's or guardian's permission (until then, 18
        and over only); the 13-year minimum is stated from November 2023.
      notice: Dated on the page
      disclosure: page
    - date: 2023-03-01
      change: >-
        API content no longer used to improve services; non-API content may be, with an
        opt-out form.
      notice: >-
        Announced (Altman on Twitter, blog). Entry: `2023-08-15-altman-never-trains-api`
      disclosure: announced
    - date: 2023-03-14
      change: >-
        Bars using output "to develop models that compete with OpenAI"; adds
        mass-arbitration procedures and an accuracy section.
      notice: Dated on the page; no announcement found
      disclosure: page
    - date: 2023-11-14
      when: 2023-11-14 (effective 2024-01-31)
      change: >-
        Rewritten as consumer terms, with separate business terms. Content may be used
        "to provide, maintain, develop, and improve our Services," with an opt-out. New
        promises: at least 30 days' notice of subscription price increases; "advance
        notice and a refund for any prepaid, unused Services" if a service is
        discontinued; notice before an employer's business account takes over a
        work-email account; advance notice before deleting inactive free accounts.
        Arbitration moves to NAM with batch procedures.
      notice: >-
        Dated, with a link to the previous version; effective date moved from December
        14, 2023 to January 31, 2024
      disclosure: page
    - date: 2024-10-23
      change: Adds a pointer for users of ChatGPT through Apple's integrations.
      notice: Dated
      disclosure: page
    - date: 2024-12-11
      change: New address.
      notice: Dated
      disclosure: page
    - date: 2026-01-01
      change: Contracting entity becomes OpenAI OpCo, L.L.C.
      notice: Dated
      disclosure: page
  after: >-
    No change since November 2023 reduces a user's rights, so the 30-day notice promise
    for adverse changes has not been tested by these terms.
- page: openai-business-terms
  org: openai
  title: OpenAI business terms and Services Agreement
  versions: 24 versions, November 2023 – September 2026
  changes:
    - date: 2023-08-28
      when: 2023-08-28 (first capture November 8)
      change: >-
        Business terms: OpenAI uses Customer Content only to provide the services and
        "in accordance with our API data usage policies."
      notice: Dated
      disclosure: page
    - date: 2023-11-14
      change: >-
        Adds the copyright indemnity (announced as Copyright Shield), covering claims
        about "training data we use to train a model that powers the Services"; data
        handling now refers to the enterprise privacy commitments. Adds ChatGPT Team in
        January 2024.
      notice: Announced at DevDay, November 6, 2023
      disclosure: announced
    - date: 2025-05-31
      change: >-
        Replaced by the OpenAI Services Agreement. The no-training promise gains an
        opt-in: "OpenAI will not use Customer Content to develop or improve the
        Services, unless Customer explicitly agrees to such use." New: deletion of
        Customer Content within 30 days of termination (unless legally required or
        agreed otherwise), retention of "Abusive Customer Content", a right to terminate
        if an update "materially reduces the Services functionality" or security, and 30
        days' notice of updates OpenAI judges material. Price changes on the pricing
        page take effect after 14 days.
      notice: >-
        Posted in advance ("View upcoming services agreement" from May 8, 2025)
      disclosure: page
    - date: 2025-11
      when: 2025-11 to 2026-06
      change: >-
        Renames (ChatGPT Business, OpenAI OpCo), adds ChatGPT for Clinicians, link
        fixes. Version dated December 1, 2025, effective January 1, 2026.
      notice: Dated
      disclosure: page
- page: openai-privacy-policy
  org: openai
  title: OpenAI privacy policy
  versions: 89 versions, May 2021 – October 2026
  note: >-
    Two policies until September 2022: one for the website and a separate API privacy
    policy. From May 2025 the same address sometimes served OpenAI's European policy;
    those captures (5) were set aside.
  changes:
    - date: 2021-08-12
      change: >-
        Adds research as a use, "which may remain internal or may be shared with third
        parties, published or made generally available," and allows publishing
        aggregated data.
      notice: Dated
      disclosure: page
    - date: 2022-09-19
      change: >-
        One policy for the website and all services replaces the two. The API policy's
        promise, "If we make any material change to our Privacy Policy, we will notify
        you by posting a prominent announcement on the Site," is gone; changes are now
        posted on the page "unless another type of notice is required by applicable
        law." Also drops the promise to describe any future response to Do Not Track
        signals.
      notice: Dated; no announcement found
      disclosure: page
    - date: 2023-03-14
      change: >-
        First version to say OpenAI collects what users type and upload ("User
        Content"), three and a half months after ChatGPT launched. Adds rights for
        European users, a retention section, and "we will not attempt to reidentify"
        de-identified data. "We do not and will not sell your Personal Information"
        becomes "We don’t sell or share Personal Information as defined by the
        California Consumer Privacy Act."
      notice: Dated (GPT-4 launch day)
      disclosure: page
    - date: 2023-04-27
      change: >-
        After Italy's regulator ordered changes: discloses that content may be used "to
        train the models that power ChatGPT" with an opt-out, adds correction and
        removal requests for inaccurate output about a person, and parental consent for
        ages 13–17.
      notice: >-
        Dated; OpenAI announced the Italy measures. Entry:
        `2024-12-20-italy-privacy-fine`
      disclosure: announced
    - date: 2023-06-23
      change: >-
        Allows disclosure to "government authorities, industry peers, or other third
        parties" including where OpenAI determines "in our sole discretion" that terms
        were violated; drops the line that de-identified data may be used "indefinitely
        without further notice."
      notice: Dated
      disclosure: page
    - date: 2023-11-14
      when: 2023-11-14 (effective 2024-01-31)
      change: >-
        Adds sharing with employers' business accounts, shared links and GPT actions.
      notice: Dated, with effective date a month or more later
      disclosure: page
    - date: 2024-11-04
      change: >-
        Rewritten. Adds date of birth and general location to what is collected, and
        names public internet data as a training source; adds "we do not process
        Personal Data for 'targeted advertising' purposes"; temporary chats "kept up to
        30 days for safety purposes"; changes now published with "an updated version and
        effective date."
      notice: Dated
      disclosure: page
    - date: 2025-06-27
      change: >-
        Wording only ("do not" to "don't") and a link to California request statistics.
      notice: Dated
      disclosure: page
    - date: 2026-02-09
      change: >-
        With the launch of ads: may receive data from advertisers, including
        "information about purchases you make from these advertisers"; ads personalized
        for Free and Go users; contact uploads; age estimation; teen account linking;
        "monitoring any Content submitted or exchanged on our platforms"; de-identified
        data shared with third parties; detailed deletion and retention rules ("remove
        it from our systems within 30 days" with exceptions). Links to the previous
        version from here on.
      notice: >-
        Dated; no separate announcement of the policy found (ads themselves were
        announced January 16)
      disclosure: page
    - date: 2026-04-01
      change: Korea addendum moved.
      notice: Dated
      disclosure: page
    - date: 2026-04-30
      change: >-
        Drops "we do not ‘sell’ Personal Data or ‘share’ Personal Data for
        cross-contextual behavioral advertising" and "we do not process Personal Data
        for ‘targeted advertising’"; adds "marketing partners" who receive limited data
        to promote OpenAI on other sites, with opt-outs including Global Privacy
        Control, not for known minors. Marketing cookies on by default for free users.
      notice: >-
        Email to users (reported by The Decoder and Wired); OpenAI told Adweek
        conversations are not shared with advertisers. Update added to
        `2026-01-16-ad-principles`; graded as an eroded commitment
      disclosure: announced
    - date: 2026-05-02
      when: 2026-05-02 and 2026-05-14
      change: >-
        Restores the sensitive-data sentence and the list of state privacy rights that
        the April 30 version had dropped.
      notice: Not dated (fixes)
      disclosure: n/a
    - date: 2026-05-18
      change: Adds the in-app Data Controls opt-out for logged-out users.
      notice: Dated
      disclosure: page
    - date: 2026-09-10
      change: >-
        Removes Sora and the Atlas browser; adds collection of "ads history and
        interests" for Free and Go users.
      notice: Dated
      disclosure: page
  after: >-
    OpenAI's API privacy policy (2021–2022, 3 versions) had no substantive changes.
- page: openai-row-privacy-policy
  org: openai
  title: OpenAI privacy policy for users outside the U.S. and Europe
  versions: 20 versions, July 2024 – October 2026
  note: >-
    Follows the U.S. policy: rewritten November 4, 2024, wording changes June 27, 2025,
    and a rewrite dated February 6, 2026 matching the U.S. version of February 9
    (contacts, age estimation, teen linking, ads for Free and Go users). It did not take
    the April 30, 2026 U.S. change on sharing with marketing partners, and has not
    changed since February 2026 apart from layout.
  changes: []
- page: openai-enterprise-privacy
  org: openai
  title: OpenAI enterprise privacy page
  versions: 30 versions, August 2023 – October 2026
