- page: openai-rate-limits
  org: openai
  title: OpenAI API rate limits page
  versions: 18 versions, December 2025 – October 2026
  note: >-
    Older captures of the platform documentation have no readable text. Changes since
    December 2025 loosen or explain limits: tier upgrades no longer require waiting 7 to
    30 days after first payment (May 2026); new rate-limit headers and retry guidance
    (June–August 2026); a note that OpenAI sets an approved monthly usage limit per
