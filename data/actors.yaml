# Who appears in the record.
#
# Scope rule (see METHODOLOGY.md): only organizations and people speaking in a
# public or official capacity: executives, founders, board members, and
# staff who publicly speak about the company's mission, products, safety or
# policy.
# No private individuals, private accounts, family members or personal lives.
#
#   kind   org | person | body
#   basis  why this person is in scope (executive, founder, board, spokesperson,
#          researcher-public, former-staff-witness)

